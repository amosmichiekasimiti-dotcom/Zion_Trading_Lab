<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#1a1c2c] min-h-screen text-white font-sans">

    <div class="flex justify-between items-center p-4 bg-[#0f111a] border-b border-white/5">
        <div class="flex items-center gap-3">
            <i class="fas fa-bars text-xl text-blue-500"></i>
            <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center">
                <i class="fas fa-globe text-xs"></i>
            </div>
            <i class="fas fa-phone-alt text-blue-500"></i>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-xs font-bold text-red-500">Log in</span>
            <button class="bg-red-600 text-[10px] font-bold px-4 py-2 rounded uppercase tracking-tighter">Sign up</button>
        </div>
    </div>

    <div class="flex overflow-x-auto whitespace-nowrap bg-blue-700/50 backdrop-blur-md py-3 px-4 gap-6 no-scrollbar border-b border-white/10">
        <div class="flex items-center gap-2 text-white border-b-2 border-white pb-1">
            <i class="fas fa-th-large text-xs"></i><span class="text-[10px] font-bold uppercase">Dashboard</span>
        </div>
        <div class="flex items-center gap-2 text-zinc-400">
            <i class="fas fa-robot text-xs"></i><span class="text-[10px] font-bold uppercase">Bot Builder</span>
        </div>
        <div class="flex items-center gap-2 text-zinc-400">
            <i class="fas fa-project-diagram text-xs"></i><span class="text-[10px] font-bold uppercase">Analysis</span>
        </div>
        <div class="flex items-center gap-2 text-zinc-400">
            <i class="fas fa-chart-line text-xs"></i><span class="text-[10px] font-bold uppercase">TradeView</span>
        </div>
        <div class="flex items-center gap-2 text-zinc-400">
            <i class="fas fa-robot text-xs"></i><span class="text-[10px] font-bold uppercase">Bots</span>
        </div>
        <div class="flex items-center gap-2 text-zinc-400">
            <i class="fas fa-signal text-xs"></i><span class="text-[10px] font-bold uppercase">Signal</span>
        </div>
    </div>

    <div class="grid grid-cols-3 gap-4 p-6 max-w-sm mx-auto mt-4">
        <div id="nav-dashboard" class="bg-white/5 backdrop-blur-md rounded-2xl p-4 flex flex-col items-center justify-center border border-white/10 aspect-square cursor-pointer">

            <div class="bg-white p-2 rounded-lg mb-2"><i class="fas fa-th-large text-blue-600"></i></div>
            <span class="text-[9px] text-zinc-400 font-bold uppercase text-center">Dashboard</span>
        <div id="nav-bot" class="bg-white/5 backdrop-blur-md rounded-2xl p-4 flex flex-col items-center justify-center border border-white/10 aspect-square cursor-pointer">

        <div class="bg-white/5 backdrop-blur-md rounded-2xl p-4 flex flex-col items-center justify-center border border-white/10 aspect-square">
            <div class="bg-red-600 w-8 h-8 rounded-lg mb-2 flex items-center justify-center text-[10px] font-black">DB</div>
            <span class="text-[9px] text-zinc-400 font-bold uppercase text-center">Bot Builder</span>
        </div>
        <div class="bg-white/5 backdrop-blur-md rounded-2xl p-4 flex flex-col items-center justify-center border border-white/10 aspect-square">
            <i class="fas fa-signal text-zinc-500 text-2xl mb-2"></i>
            <span id="signal-display" class="text-[9px] text-zinc-400 font-bold uppercase text-center">Waiting for Signal...</span>
        </div>
    </div>

    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<script src="../strategy-engine/logic.js"></script>

</body>
</html>
