<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#1a1c2c] min-h-screen text-white font-sans">

    <div class="flex justify-between items-center p-4 bg-[#0f111a] border-b border-white/5">
        <div class="flex items-center gap-3">
            <i class="fas fa-bars text-xl text-blue-500"></i>
            <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center">
                <i class="fas fa-globe text-xs"></i>
            </div>
            <i class="fas fa-phone-alt text-blue-500"></i>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-xs font-bold text-red-500">Log in</span>
            <button class="bg-red-600 text-[10px] font-bold px-4 py-2 rounded uppercase tracking-tighter">Sign up</button>
        </div>
    </div>

    <div class="flex overflow-x-auto whitespace-nowrap bg-blue-700/50 backdrop-blur-md py-3 px-4 gap-6 no-scrollbar border-b border-white/10">
        <div class="flex items-center gap-2 text-white border-b-2 border-white pb-1">
            <i class="fas fa-th-large text-xs"></i><span class="text-[10px] font-bold uppercase">Dashboard</span>
        </div>
        <div class="flex items-center gap-2 text-zinc-400">
            <i class="fas fa-robot text-xs"></i><span class="text-[10px] font-bold uppercase">Bot Builder</span>
        </div>
        <div class="flex items-center gap-2 text-zinc-400">
            <i class="fas fa-project-diagram text-xs"></i><span class="text-[10px] font-bold uppercase">Analysis</span>
        </div>
        <div class="flex items-center gap-2 text-zinc-400">
            <i class="fas fa-chart-line text-xs"></i><span class="text-[10px] font-bold uppercase">TradeView</span>
        </div>
        <div class="flex items-center gap-2 text-zinc-400">
            <i class="fas fa-robot text-xs"></i><span class="text-[10px] font-bold uppercase">Bots</span>
        </div>
        <div class="flex items-center gap-2 text-zinc-400">
            <i class="fas fa-signal text-xs"></i><span class="text-[10px] font-bold uppercase">Signal</span>
        </div>
    </div>
        <div class="flex justify-between items-center w-full px-4 mb-6">
            <button id="mute-btn" onclick="toggleMute()" class="bg-green-600 text-white px-4 py-2 rounded-xl text-[10px] font-bold shadow-lg">🔊 VOICE: ON</button>
            <div class="flex gap-3">
                <button onclick="filterMarkets('all')" class="text-[10px] text-zinc-500 font-bold uppercase">All</button>
                <button onclick="filterMarkets('1S')" class="text-[10px] text-blue-500 font-bold uppercase underline">1S Only</button>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-3 w-full px-4 mb-8">
            <div class="bg-white/5 backdrop-blur-xl rounded-2xl p-4 flex flex-col items-center justify-center border border-white/10 aspect-square">
                <div class="bg-blue-600/20 p-2 rounded-lg mb-2"><i class="fas fa-th-large text-blue-500"></i></div>
                <span class="text-[9px] text-zinc-400 font-bold uppercase">Dashboard</span>
            </div>
            <div class="bg-white/5 backdrop-blur-xl rounded-2xl p-4 flex flex-col items-center justify-center border border-white/10 aspect-square">
                <div class="bg-green-600/20 p-2 rounded-lg mb-2"><i class="fas fa-signal text-green-500"></i></div>
                <span class="text-[9px] text-zinc-400 font-bold uppercase">Signals</span>
            </div>
        </div>

        <div class="w-full px-4">
            <h2 class="text-white text-[11px] font-black uppercase mb-3">Live Volatility 1S Feed</h2>
            <div id="signal-list" class="space-y-3 pb-10">
                <div class="text-zinc-600 text-[10px] italic">Scanning Volatility 15, 90, and more...</div>
            </div>
        </div>
    </div>
    <script src="logic.js"></script>
</body>
</html>
