<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zion Trading Lab | Live Discovery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <div class="logo-area">
                <h1>ZION TRADING LAB</h1>
                <div id="connection-status" class="status-offline">Connecting Handshake...</div>
            </div>
            <nav id="filters">
                <button onclick="filterType('all', event)" class="active">All Markets</button>
                <button onclick="filterType('synthetic_index', event)">Synthetics</button>
                <button onclick="filterType('forex', event)">Forex</button>
                <button onclick="filterType('indices', event)">Stock Indices</button>
            </nav>
        </header>

        <main id="market-grid">
            <div class="loading-state">Initial handshake in progress...</div>
        </main>
    </div>

    <script>
        // UI INJECTOR: This function is triggered by app.js
        window.renderMarkets = function(list) {
            const grid = document.getElementById('market-grid');
            grid.innerHTML = ''; 

            list.forEach(m => {
                const card = document.createElement('div');
                card.className = 'market-card';
                card.setAttribute('data-symbol', m.symbol); 
                
                card.innerHTML = `
                    <div class="card-header">
                        <span class="category">${m.market_display_name}</span>
                        <span class="live-price">0.0000</span>
                    </div>
                    <h3>${m.display_name}</h3>
                    <div class="stats-area">
                        <div class="calibrating">Handshaking Stream...</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        };

        function filterType(type, event) {
            document.querySelectorAll('#filters button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            if(window.allSymbols) {
                const filtered = type === 'all' ? window.allSymbols : window.allSymbols.filter(s => s.market === type);
                window.renderMarkets(filtered);
            }
        }
    </script>
    <script src="app.js"></script>
</body>
</html>
