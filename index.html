<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zion · Ultimate Trading Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { background:#0f172a; color:white; font-family:'Inter',Arial; }
.card { background:#1e293b; padding:20px; border-radius:12px; margin-bottom:15px; border:1px solid #334155; }
.group-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
.group-tab { padding: 15px; border-radius: 12px; text-align: center; cursor: pointer; transition: all 0.3s; border: 2px solid transparent; background: #1e293b; }
.group-tab:hover { transform: translateY(-2px); }
.group-tab.active { border-color: #fbbf24; box-shadow: 0 0 20px rgba(251,191,36,0.3); }
.group-tab.rf { border-left: 5px solid #22c55e; }
.group-tab.eo { border-left: 5px solid #f59e0b; }
.group-tab.ou { border-left: 5px solid #3b82f6; }
.group-tab.md { border-left: 5px solid #a855f7; }
.tab-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; }
.tab-count { font-size: 0.9rem; color: #94a3b8; }
.market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 15px; margin-top: 20px; }
.market-card { background: #1e293b; border-radius: 12px; padding: 18px; border-left: 6px solid; transition: all 0.3s; border: 1px solid #334155; cursor:pointer; }
.market-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
.signal-badge { display: inline-block; padding: 6px 16px; border-radius: 30px; font-size: 0.9rem; font-weight: 700; }
.badge-rise { background: #22c55e; color: black; }
.badge-fall { background: #ef4444; color: white; }
.badge-even { background: #22c55e; color: black; }
.badge-odd { background: #f59e0b; color: black; }
.badge-over { background: #3b82f6; color: white; }
.badge-under { background: #f59e0b; color: black; }
.badge-match { background: #a855f7; color: white; }
.badge-differ { background: #ec4899; color: white; }
.indicator-box { background: #0f172a; border-radius: 8px; padding: 8px; margin-top: 8px; border: 1px solid #334155; }
.tick-up { color: #22c55e; font-weight: bold; }
.tick-down { color: #ef4444; font-weight: bold; }
.group-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.group-title { font-size: 1.5rem; font-weight: bold; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.scanning-badge { animation: pulse 2s infinite; background: #22c55e; color: black; padding: 4px 12px; border-radius: 20px; font-weight: bold; }
@keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; box-shadow: 0 0 15px #22c55e; } 100% { opacity: 0.8; }}
.modal-bg { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:50; justify-content:center; align-items:center; }
.modal-content { background:#1e293b; border-radius:12px; width:90%; max-width:900px; padding:20px; position:relative; }
.modal-close { position:absolute; top:10px; right:10px; cursor:pointer; font-size:1.5rem; }
#digitCircle { width:200px; height:200px; margin:auto; display:block; }
</style>
</head>
<body class="p-6">
<h1 class="text-3xl font-bold mb-4 bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">Zion · Ultimate Trading Dashboard</h1>
<div class="card flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="scanning-badge" id="scanStatus">🔄 SCANNING: ALL MARKETS</div>
<span id="lastScan" class="text-gray-400">--:--:--</span>
</div>
<div class="flex gap-4">
<input id="token" type="password" class="p-2 rounded text-black" placeholder="API Token">
<button onclick="connectWS()" class="bg-blue-600 px-4 py-2 rounded hover:bg-blue-700">Connect</button>
<span id="status" class="text-yellow-400">Disconnected</span>
</div>
</div>
<div class="group-tabs">
<div id="groupRF" class="group-tab rf active" onclick="switchGroup('rf')"><div class="tab-title">📈 RISE/FALL</div><div class="tab-count" id="countRF">0 markets</div></div>
<div id="groupEO" class="group-tab eo" onclick="switchGroup('eo')"><div class="tab-title">🔢 EVEN/ODD</div><div class="tab-count" id="countEO">0 markets</div></div>
<div id="groupOU" class="group-tab ou" onclick="switchGroup('ou')"><div class="tab-title">⚖️ OVER/UNDER</div><div class="tab-count" id="countOU">0 markets</div></div>
<div id="groupMD" class="group-tab md" onclick="switchGroup('md')"><div class="tab-title">🎯 MATCH/DIFFER</div><div class="tab-count" id="countMD">0 markets</div></div>
</div>
<div class="group-header">
<div class="group-title" id="groupTitle">RISE/FALL STRATEGY</div>
<div id="marketCount" class="text-gray-400">0 markets active</div>
</div>
<div id="marketGrid" class="market-grid"></div>
<div class="card">
<div id="log" class="h-24 overflow-y-auto text-sm font-mono text-gray-300"></div>
</div>
<div id="chartModal" class="modal-bg flex">
<div class="modal-content">
<span class="modal-close" onclick="closeModal()">&times;</span>
<div id="tradingviewContainer" style="height:500px; width:100%;"></div>
<canvas id="digitCircle"></canvas>
</div>
</div>
<script src="https://s3.tradingview.com/tv.js"></script>
<script>
const VOLATILITIES = [{name:'Volatility 10',symbol:'1HZ10V',type:'rf'},{name:'Volatility 25',symbol:'1HZ25V',type:'eo'},{name:'Volatility 50',symbol:'R_50',type:'ou'}];
let marketSignals = {};
VOLATILITIES.forEach(v=>marketSignals[v.symbol]={signal:'--',type:'neutral',price:0,digit:0});
const els={marketGrid:document.getElementById('marketGrid'),groupTitle:document.getElementById('groupTitle'),scanStatus:document.getElementById('scanStatus'),lastScan:document.getElementById('lastScan'),countRF:document.getElementById('countRF'),countEO:document.getElementById('countEO'),countOU:document.getElementById('countOU'),countMD:document.getElementById('countMD'),marketCount:document.getElementById('marketCount')};
function log(msg){console.log(msg);document.getElementById('log').innerHTML=`[${new Date().toLocaleTimeString()}] ${msg}<br>`+document.getElementById('log').innerHTML;}
function switchGroup(group){currentGroup=group;document.querySelectorAll('.group-tab').forEach(el=>el.classList.remove('active'));document.getElementById('group'+group.toUpperCase()).classList.add('active');const titles={rf:'RISE/FALL',eo:'EVEN/ODD',ou:'OVER/UNDER',md:'MATCH/DIFFER'};els.groupTitle.textContent=titles[group]+' STRATEGY';els.scanStatus.textContent=`🔄 SCANNING: ${titles[group]}`;renderMarketGrid();}
function connectWS(){log('WS connection simulated. Use your Deriv token for live data.');}
function renderMarketGrid(){let html='';let count=0;VOLATILITIES.forEach(v=>{const s=marketSignals[v.symbol];if(currentGroup!==s.type&&s.type!=='neutral')return;count++;html+=`<div class='market-card' onclick='openModal("${v.symbol}")'><div class='font-bold'>${v.name}</div><div>${s.signal} · ${s.price}</div></div>`;});els.marketGrid.innerHTML=html||'<div class="text-center text-gray-500 py-10">No signals yet.</div>';els.marketCount.textContent=count+' markets active';}
function openModal(symbol){document.getElementById('chartModal').style.display='flex';new TradingView.widget({container_id:'tradingviewContainer',width:'100%',height:500,symbol:'DERIV:'+symbol,interval:'1',timezone:'Etc/UTC',theme:'dark',style:'1',toolbar_bg:'#1e293b',withdateranges:true,hide_side_toolbar:false,allow_symbol_change:true,studies:['MASimple@tv-basicstudies']});drawDigitCircle(symbol);}
function closeModal(){document.getElementById('chartModal').style.display='none';}
function drawDigitCircle(symbol){const canvas=document.getElementById('digitCircle');const ctx=canvas.getContext('2d');const digits=[Math.floor(Math.random()*10)];ctx.clearRect(0,0,canvas.width,canvas.height);const centerX=canvas.width/2,centerY=canvas.height/2,radius=80;for(let i=0;i<10;i++){const angle=(i/10)*2*Math.PI-Math.PI/2;const x=centerX+radius*Math.cos(angle);const y=centerY+radius*Math.sin(angle);ctx.beginPath();ctx.arc(x,y,20,0,2*Math.PI);ctx.fillStyle=digits.includes(i)?'#22c55e':'#334155';ctx.fill();ctx.fillStyle='white';ctx.font='16px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(i,x,y);}}
renderMarketGrid();log('🚀 Zion Ultimate Dashboard initialized');
</script>
</body>
</html>
