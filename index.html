<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Automated Synthetic Index Mirror</title>
    <script src="https://unpkg.com/@deriv/deriv-api/dist/DerivAPIBasic.js"></script>
</head>
<body>
    <h1>Live Synthetic Assets</h1>
    <div id="status">Connecting...</div>
    <ul id="asset-list"></ul>

    <script>
        // Initialize with your App ID
        const api = new DerivAPIBasic({ 
            endpoint: 'ws.derivws.com', 
            app_id: 1089, // Replace with your own App ID from api.deriv.com
            lang: 'EN' 
        });

        // 1. "Read Everything" - Automatically fetch all current assets
        const listAssets = async () => {
            const response = await api.active_symbols({ active_symbols: 'brief' });
            const list = document.getElementById('asset-list');
            list.innerHTML = response.active_symbols
               .filter(s => s.market === 'synthetic_index')
               .map(s => `<li>${s.display_name} (${s.symbol})</li>`)
               .join('');
        };

        // 2. "Auto Update" - Listen for platform changes
        api.websiteStatus().subscribe(status => {
            console.log("Platform Update Detected:", status);
            document.getElementById('status').innerText = "Platform Status: Online";
            listAssets(); // Refresh list if something changes
        });

        // Initial launch
        api.onOpen().subscribe(() => listAssets());
    </script>
</body>
</html>
