<script>
const APP_ID = 126973;
const ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);

let allSymbols = [];
let activeSubscriptionId = null;
let digitHistory = [];
let priceHistory = [];
let currentSymbol = null;
const MAX_DIGITS = 1000;

/* ---------------- CONNECTION STATUS ---------------- */

ws.onopen = () => {
    document.getElementById("status-text").innerText = "● Connected";
    document.getElementById("status-text").style.color = "var(--green)";
    ws.send(JSON.stringify({ active_symbols: "brief", product_type: "basic" }));
};

ws.onerror = () => {
    document.getElementById("status-text").innerText = "● Connection Error";
    document.getElementById("status-text").style.color = "red";
};

ws.onclose = () => {
    document.getElementById("status-text").innerText = "● Disconnected";
    document.getElementById("status-text").style.color = "orange";
};

/* ---------------- MESSAGE HANDLER ---------------- */

ws.onmessage = (msg) => {
    const data = JSON.parse(msg.data);

    // Active symbols
    if (data.active_symbols) {
        allSymbols = data.active_symbols;
        filterMarkets('synthetic');
    }

    // History response (FULL REPLACEMENT)
    if (data.history && data.echo_req.ticks_history === currentSymbol) {

        const asset = allSymbols.find(s => s.symbol === currentSymbol);
        const pipSize = asset ? asset.pip_size : 2;

        digitHistory = [];
        priceHistory = [];

        data.history.prices.forEach(price => {
            const formatted = Number(price).toFixed(pipSize);
            const digit = parseInt(formatted.slice(-1));
            digitHistory.push(digit);
            priceHistory.push(Number(price));
        });

        updateDigitCircles();
    }

    // Live tick
    if (data.tick && data.tick.symbol === currentSymbol) {
        handleTick(data.tick);
    }
};

/* ---------------- MARKET FILTER ---------------- */

function filterMarkets(type, btn) {
    if(btn){
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    const tbody = document.getElementById('market-list');
    tbody.innerHTML = '';

    const filtered = allSymbols.filter(s => {
        if (type === 'synthetic') return s.market === 'synthetic_index' &&
            !s.display_name.includes('Crash') &&
            !s.display_name.includes('Boom') &&
            !s.display_name.includes('Step') &&
            !s.display_name.includes('Range');
        return s.market === type;
    });

    filtered.forEach(s => {
        tbody.innerHTML += `
            <tr>
                <td>${s.display_name}</td>
                <td style="color:#666; font-size:10px;">${s.symbol}</td>
                <td>
                    <button class="btn-analyze"
                        onclick="openAnalysis('${s.symbol}', '${s.display_name}')">
                        Analyze
                    </button>
                </td>
            </tr>`;
    });
}

/* ---------------- OPEN ANALYSIS ---------------- */

function openAnalysis(symbol, name) {

    currentSymbol = symbol;

    document.getElementById('target-name').innerText = name;
    document.getElementById('target-symbol').innerText = symbol;
    document.getElementById('analysis-overlay').style.display = 'block';

    digitHistory = [];
    priceHistory = [];

    buildDigitUI();

    // Cancel previous subscription
    if (activeSubscriptionId) {
        ws.send(JSON.stringify({ forget: activeSubscriptionId }));
        activeSubscriptionId = null;
    }

    // Request EXACT 1000 latest ticks
    ws.send(JSON.stringify({
        ticks_history: symbol,
        adjust_start_time: 1,
        count: MAX_DIGITS,
        end: "latest",
        style: "ticks"
    }));

    // Subscribe to live ticks
    ws.send(JSON.stringify({
        ticks: symbol,
        subscribe: 1
    }));
}

/* ---------------- HANDLE LIVE TICK ---------------- */

function handleTick(tick) {

    activeSubscriptionId = tick.id;

    const asset = allSymbols.find(s => s.symbol === tick.symbol);
    const pipSize = asset ? asset.pip_size : 2;

    const price = Number(tick.quote);
    const formatted = price.toFixed(pipSize);
    const digit = parseInt(formatted.slice(-1));

    document.getElementById('live-price').innerText = formatted;

    digitHistory.push(digit);
    priceHistory.push(price);

    // STRICT ROLLING BUFFER
    if (digitHistory.length > MAX_DIGITS) digitHistory.shift();
    if (priceHistory.length > MAX_DIGITS) priceHistory.shift();

    updateDigitCircles();
    updateStrategyPanel(digit, price);
}

/* ---------------- DIGIT ANALYTICS ---------------- */

function updateDigitCircles() {

    const counts = new Array(10).fill(0);
    digitHistory.forEach(d => counts[d]++);

    const total = digitHistory.length;
    document.getElementById('tick-counter').innerText = `${total}/${MAX_DIGITS}`;

    const maxVal = Math.max(...counts);
    const minVal = total >= MAX_DIGITS ? Math.min(...counts) : -1;

    counts.forEach((count, i) => {

        const pct = total > 0 ? ((count / total) * 100).toFixed(1) : "0.0";
        const circle = document.getElementById(`circle-${i}`);
        document.getElementById(`pct-${i}`).innerText = `${pct}%`;

        circle.classList.remove('most-freq','least-freq','active');

        if (digitHistory[total - 1] === i)
            circle.classList.add('active');

        if (count === maxVal && total >= MAX_DIGITS)
            circle.classList.add('most-freq');

        if (count === minVal && total >= MAX_DIGITS)
            circle.classList.add('least-freq');
    });
}

/* ---------------- STRATEGY PANEL ---------------- */

function updateStrategyPanel(digit, price) {

    const evenOdd = document.getElementById('stat-even-odd');
    const overUnder = document.getElementById('stat-over-under');
    const riseFall = document.getElementById('stat-rise-fall');

    const isEven = digit % 2 === 0;
    evenOdd.innerText = isEven ? "EVEN" : "ODD";
    evenOdd.style.color = isEven ? "var(--blue)" : "var(--gold)";

    const isOver = digit > 4;
    overUnder.innerText = isOver ? "OVER" : "UNDER";
    overUnder.style.color = isOver ? "var(--green)" : "var(--red)";

    const lastPrice = priceHistory[priceHistory.length - 2] || price;
    riseFall.innerText = price >= lastPrice ? "RISE" : "FALL";
    riseFall.style.color = price >= lastPrice ? "var(--green)" : "var(--red)";

    const counts = new Array(10).fill(0);
    digitHistory.forEach(d => counts[d]++);
    const hot = counts.indexOf(Math.max(...counts));
    document.getElementById('stat-match-diff').innerText = `HOT: ${hot}`;
}

/* ---------------- CLOSE ---------------- */

function closeAnalysis() {
    document.getElementById('analysis-overlay').style.display = 'none';
    if (activeSubscriptionId) {
        ws.send(JSON.stringify({ forget: activeSubscriptionId }));
        activeSubscriptionId = null;
    }
}
</script>
