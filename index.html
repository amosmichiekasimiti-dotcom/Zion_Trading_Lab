<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zion Trading Lab | Universal Feed</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --red: #ff444f; --dark: #11111b; --green: #4caf50; --neon: #00f2fe; }
        body { font-family: 'Segoe UI', sans-serif; background: #0e0e15; margin: 0; padding: 10px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; color: white; }
        
        /* Navigation Grid */
        .nav-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(85px, 1fr)); gap: 8px; margin-bottom: 15px; }
        .nav-card { background: #161625; padding: 10px; border-radius: 10px; text-align: center; cursor: pointer; border: 1px solid #2e2e48; font-size: 10px; font-weight: 800; color: #8e8e9e; transition: 0.3s; }
        .nav-card.active { background: var(--red); color: white; border-color: var(--red); box-shadow: 0 0 15px rgba(255, 68, 79, 0.4); }
        
        /* Main Content Area */
        .card { background: #161625; border-radius: 12px; flex-grow: 1; overflow-y: auto; border: 1px solid #2e2e48; }
        table { width: 100%; border-collapse: collapse; }
        td, th { padding: 12px; text-align: left; border-bottom: 1px solid #2e2e48; font-size: 13px; }
        .btn-view { background: var(--red); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }

        /* Full Screen Modal */
        #modal { display:none; position:fixed; z-index:100; left:0; top:0; width:100%; height:100%; background:#0e0e15; }
        .modal-body { height: 100%; display: flex; flex-direction: column; padding: 15px; box-sizing: border-box; }
        
        /* Universal Price Header */
        .price-header { background: #1c1c2d; padding: 20px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2e2e48; }
        #live-price { font-size: 32px; font-family: 'Courier New', monospace; font-weight: bold; }
        #live-price span { color: var(--red); border-bottom: 3px solid var(--red); padding-bottom: 2px; }

        /* Physics Momentum Display */
        #market-strength-container { background: #161625; padding: 12px; border-radius: 8px; border: 1px solid #2e2e48; text-align: right; min-width: 150px; }

        /* Digit Analysis Grid */
        #digit-analysis-panel { display: none; margin-bottom: 15px; }
        .digit-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; background: #000; padding: 8px; border-radius: 8px; }
        .d-box { background: #161625; height: 60px; display: flex; flex-direction: column-reverse; align-items: center; position: relative; border: 1px solid #2e2e48; border-radius: 4px; transition: 0.2s; }
        .d-bar { width: 100%; background: linear-gradient(to top, #2e2e48, var(--neon)); transition: height 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0.7; }
        .d-num { position: absolute; top: 4px; font-size: 12px; color: white; font-weight: bold; z-index: 2; }
        .d-pct { position: absolute; bottom: -18px; font-size: 10px; font-weight: 900; color: var(--neon); }
        
        /* Chart & Tabs */
        #chart-container { flex-grow: 1; border-radius: 12px; overflow: hidden; border: 1px solid #2e2e48; background: #161625; }
        .tabs { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 5px; }
        .tab { padding: 10px 20px; border-radius: 25px; border: 1px solid #2e2e48; background: #1c1c2d; font-size: 11px; font-weight: bold; cursor: pointer; color: #8e8e9e; white-space: nowrap; }
        .tab.active { background: var(--red); color: white; border-color: var(--red); box-shadow: 0 4px 10px rgba(255, 68, 79, 0.3); }
    </style>
</head>
<body>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; padding: 5px;">
        <h2 style="margin:0; font-size: 18px; letter-spacing: 1px;">ZION <span style="color:var(--red)">TRADING LAB</span></h2>
        <div id="status" style="color:#4caf50; font-weight:bold; font-size:11px; background: rgba(76, 175, 80, 0.1); padding: 5px 12px; border-radius: 20px;">● CONNECTED</div>
    </div>

    <div class="nav-grid">
        <div class="nav-card active" onclick="loadCategory('volatility', this)">VOLATILITY</div>
        <div class="nav-card" onclick="loadCategory('crashboom', this)">CRASH/BOOM</div>
        <div class="nav-card" onclick="loadCategory('jump', this)">JUMP</div>
        <div class="nav-card" onclick="loadCategory('range', this)">RANGE/STEP</div>
        <div class="nav-card" onclick="loadCategory('forex', this)">FOREX</div>
    </div>

    <div class="card">
        <table>
            <thead><tr><th>Asset Name</th><th>Symbol</th><th>Market Status</th></tr></thead>
            <tbody id="market-list"></tbody>
        </table>
    </div>

    <div id="modal">
        <div class="modal-body">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <div style="display:flex; align-items:center; gap: 10px;">
                    <button onclick="closeModal()" style="background:none; border:none; color:#8e8e9e; font-size: 20px; cursor:pointer;"><i class="fas fa-arrow-left"></i></button>
                    <h3 id="mTitle" style="margin:0; font-size: 16px;">Analyzing...</h3>
                </div>
                <div id="market-strength-container">
                    <div id="market-strength" style="font-size: 13px; font-weight: bold; color: var(--neon);">CALCULATING...</div>
                </div>
            </div>

            <div class="tabs">
                <div class="tab active" onclick="switchContract('rise_fall', this)">Rise/Fall</div>
                <div class="tab" onclick="switchContract('even_odd', this)">Even/Odd</div>
                <div class="tab" onclick="switchContract('matches_differs', this)">Matches/Differs</div>
                <div class="tab" onclick="switchContract('over_under', this)">Over/Under</div>
            </div>

            <div class="price-header">
                <div>
                    <div id="live-price">0.0000<span>0</span></div>
                    <span id="price-symbol" style="font-size:10px; font-weight:bold; color: #8e8e9e; letter-spacing: 2px;">ASSET_LOAD</span>
                </div>
                <div style="text-align:right;">
                    <i class="fas fa-bolt" style="color: var(--neon); font-size: 24px;"></i>
                </div>
            </div>

            <div id="digit-analysis-panel">
                <div class="digit-grid" id="digit-grid">
                    </div>
                <div style="height: 20px;"></div> </div>

            <div id="chart-container"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
