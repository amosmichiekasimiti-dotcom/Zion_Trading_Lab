<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zion Trading Lab | Automated Sync</title>
    <link rel="stylesheet" href="style.css?v=304">
    <script src="https://unpkg.com/@deriv/deriv-api/dist/DerivAPIBasic.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <h1>Zion Trading Lab</h1>
            <div id="connection-status" class="status-badge">Establishing Connection...</div>
        </div>
    </header>
    
    <main class="container">
        <div class="dashboard-meta">
            <h2>Live Synthetic Hub</h2>
            <p>Automatically detecting all 24/7 assets via Master Code modules.</p>
        </div>

        <div id="loader-area">
            <div class="spinner"></div>
            <p id="loading-text">Synchronizing platform data...</p>
        </div>

        <div id="indices-grid" class="asset-grid"></div>

        <div id="debug-log" class="hidden">
            <h3>⚠️ System Alert</h3>
            <p id="error-msg">Checking permissions...</p>
            <p><small>Ensure Redirect URL and 'Read' scope are set at api.deriv.com</small></p>
            <button class="btn-refresh" onclick="location.reload()">Force Sync</button>
        </div>
    </main>

    <script src="app.js?v=304"></script>
</body>
</html>
