<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zion Market Scanner · All 13 Volatilities</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    body { background:#0f172a; color:white; font-family:'Inter',Arial; }
    .card { background:#1e293b; padding:20px; border-radius:12px; margin-bottom:15px; border:1px solid #334155; }
    
    .market-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 15px;
        margin-top: 20px;
    }
    
    .market-card {
        background: #1e293b;
        border-radius: 12px;
        padding: 15px;
        border-left: 5px solid;
        transition: all 0.3s;
        cursor: pointer;
        border: 1px solid #334155;
    }
    .market-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .market-card.rise { border-left-color: #22c55e; }
    .market-card.fall { border-left-color: #ef4444; }
    .market-card.even { border-left-color: #22c55e; }
    .market-card.odd { border-left-color: #f59e0b; }
    .market-card.over { border-left-color: #3b82f6; }
    .market-card.under { border-left-color: #f59e0b; }
    .market-card.match { border-left-color: #a855f7; }
    .market-card.differ { border-left-color: #ec4899; }
    .market-card.neutral { border-left-color: #6b7280; }
    
    .signal-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 600;
    }
    .badge-rise { background: #22c55e20; color: #22c55e; }
    .badge-fall { background: #ef444420; color: #ef4444; }
    .badge-even { background: #22c55e20; color: #22c55e; }
    .badge-odd { background: #f59e0b20; color: #f59e0b; }
    .badge-over { background: #3b82f620; color: #3b82f6; }
    .badge-under { background: #f59e0b20; color: #f59e0b; }
    .badge-match { background: #a855f720; color: #a855f7; }
    .badge-differ { background: #ec489920; color: #ec4899; }
    
    .type-badge {
        background: #334155;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 0.7rem;
        color: #94a3b8;
    }
    
    .indicator-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
        margin-right: 4px;
    }
    .dot-green { background: #22c55e; }
    .dot-red { background: #ef4444; }
    .dot-yellow { background: #f59e0b; }
    
    .stats-row {
        display: flex;
        justify-content: space-between;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #334155;
    }
    
    .scanning-badge {
        animation: pulse 2s infinite;
        background: #22c55e;
        color: black;
        padding: 4px 12px;
        border-radius: 20px;
        font-weight: bold;
    }
    
    @keyframes pulse {
        0% { opacity: 0.8; }
        50% { opacity: 1; box-shadow: 0 0 15px #22c55e; }
        100% { opacity: 0.8; }
    }
    
    .digit-bar {
        width: 100%;
        height: 4px;
        background: #334155;
        border-radius: 2px;
        margin-top: 4px;
    }
    .digit-fill {
        height: 100%;
        background: #22c55e;
        border-radius: 2px;
    }
</style>
</head>
<body class="p-6">

<h1 class="text-3xl font-bold mb-2 bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">
    Zion Market Scanner · All 13 Volatilities
</h1>

<!-- Scanner Status -->
<div class="card flex items-center justify-between">
    <div class="flex items-center gap-4">
        <div class="scanning-badge">🔄 SCANNING ALL MARKETS</div>
        <span id="lastScan" class="text-gray-400">Updating...</span>
    </div>
    <div class="flex gap-4">
        <input id="token" type="password" class="p-2 rounded text-black" placeholder="API Token">
        <button onclick="connectWS()" class="bg-blue-600 px-4 py-2 rounded hover:bg-blue-700">Connect</button>
        <span id="status" class="text-yellow-400">Disconnected</span>
    </div>
</div>

<!-- Market Count & Summary -->
<div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
    <div class="card text-center">
        <div class="metric">Total Markets</div>
        <div class="text-3xl font-bold">13</div>
    </div>
    <div class="card text-center">
        <div class="metric">1-Second Markets</div>
        <div class="text-3xl font-bold text-blue-400">8</div>
    </div>
    <div class="card text-center">
        <div class="metric">Standard Markets</div>
        <div class="text-3xl font-bold text-green-400">5</div>
    </div>
    <div class="card text-center">
        <div class="metric">Active Signals</div>
        <div id="activeCount" class="text-3xl font-bold text-yellow-400">0</div>
    </div>
</div>

<!-- Best Trade Recommendation -->
<div id="bestTrade" class="card hidden" style="border-left: 8px solid #fbbf24;">
    <div class="flex items-center gap-2 mb-2">
        <span class="bg-yellow-500 text-black px-3 py-1 rounded-full text-sm font-bold">⭐ BEST TRADE RIGHT NOW ⭐</span>
        <span class="text-gray-400">Highest confidence signal</span>
    </div>
    <div id="bestTradeContent" class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <!-- Populated by JS -->
    </div>
</div>

<!-- MARKET GRID - ALL 13 VOLATILITIES -->
<div id="marketGrid" class="market-grid">
    <!-- Populated by JavaScript -->
</div>

<!-- Strategy Summary -->
<div class="card">
    <h3 class="text-lg font-bold mb-3">📊 Signal Distribution</h3>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div><span class="metric">RISE/FALL</span><br><span id="countRiseFall" class="text-2xl">0</span></div>
        <div><span class="metric">EVEN/ODD</span><br><span id="countEvenOdd" class="text-2xl">0</span></div>
        <div><span class="metric">OVER/UNDER</span><br><span id="countOverUnder" class="text-2xl">0</span></div>
        <div><span class="metric">MATCH/DIFFER</span><br><span id="countMatchDiffer" class="text-2xl">0</span></div>
    </div>
</div>

<!-- Log -->
<div class="card">
    <div id="log" class="h-24 overflow-y-auto text-sm font-mono text-gray-300"></div>
</div>

<script>
// =====================================================================
// ZION MARKET SCANNER - ALL 13 VOLATILITIES
// =====================================================================

const APP_ID = '126973';
const VOLATILITIES = [
    // 1-Second Markets (8)
    { name: 'Volatility 10 (1s)', symbol: '1HZ10V', type: '1s', ticksPerWindow: 30 },
    { name: 'Volatility 15 (1s)', symbol: '1HZ15V', type: '1s', ticksPerWindow: 30 },
    { name: 'Volatility 25 (1s)', symbol: '1HZ25V', type: '1s', ticksPerWindow: 30 },
    { name: 'Volatility 30 (1s)', symbol: '1HZ30V', type: '1s', ticksPerWindow: 30 },
    { name: 'Volatility 50 (1s)', symbol: '1HZ50V', type: '1s', ticksPerWindow: 30 },
    { name: 'Volatility 75 (1s)', symbol: '1HZ75V', type: '1s', ticksPerWindow: 30 },
    { name: 'Volatility 90 (1s)', symbol: '1HZ90V', type: '1s', ticksPerWindow: 30 },
    { name: 'Volatility 100 (1s)', symbol: '1HZ100V', type: '1s', ticksPerWindow: 30 },
    
    // Standard Markets (5)
    { name: 'Volatility 10', symbol: 'R_10', type: 'standard', ticksPerWindow: 15 },
    { name: 'Volatility 25', symbol: 'R_25', type: 'standard', ticksPerWindow: 15 },
    { name: 'Volatility 50', symbol: 'R_50', type: 'standard', ticksPerWindow: 15 },
    { name: 'Volatility 75', symbol: 'R_75', type: 'standard', ticksPerWindow: 15 },
    { name: 'Volatility 100', symbol: 'R_100', type: 'standard', ticksPerWindow: 15 }
];

// State for all markets
let marketData = {};
let tickHistory = {};
let priceHistory = {};
let digitHistory = {};
let marketSignals = {};

VOLATILITIES.forEach(v => {
    marketData[v.symbol] = { price: null, digit: null, time: null, history: [] };
    tickHistory[v.symbol] = [];
    priceHistory[v.symbol] = [];
    digitHistory[v.symbol] = Array(10).fill(0);
    marketSignals[v.symbol] = { signal: '--', direction: 'neutral', confidence: 0, type: 'neutral' };
});

let ws = null;
let authorized = false;

// DOM Elements
const els = {
    marketGrid: document.getElementById('marketGrid'),
    bestTrade: document.getElementById('bestTrade'),
    bestTradeContent: document.getElementById('bestTradeContent'),
    activeCount: document.getElementById('activeCount'),
    countRiseFall: document.getElementById('countRiseFall'),
    countEvenOdd: document.getElementById('countEvenOdd'),
    countOverUnder: document.getElementById('countOverUnder'),
    countMatchDiffer: document.getElementById('countMatchDiffer'),
    lastScan: document.getElementById('lastScan'),
    status: document.getElementById('status'),
    log: document.getElementById('log')
};

function log(msg) {
    console.log(msg);
    if (els.log) {
        els.log.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}<br>` + els.log.innerHTML;
    }
}

// ===== WEBSOCKET CONNECTION =====
function connectWS() {
    const token = document.getElementById('token').value;
    if (!token) { alert('Enter API token'); return; }
    
    ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);
    
    ws.onopen = () => {
        log('WebSocket connected');
        els.status.textContent = 'Connected';
        els.status.className = 'text-green-400';
        ws.send(JSON.stringify({ authorize: token }));
    };
    
    ws.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.msg_type === 'authorize') {
            authorized = true;
            log(`✅ Authorized: ${data.authorize.loginid}`);
            subscribeAll();
        }
        else if (data.msg_type === 'tick') { handleTick(data.tick); }
        else if (data.error) { log(`❌ Error: ${data.error.message}`); }
    };
    
    ws.onclose = () => {
        els.status.textContent = 'Disconnected';
        els.status.className = 'text-yellow-400';
    };
}

function subscribeAll() {
    VOLATILITIES.forEach(v => {
        ws.send(JSON.stringify({ ticks: v.symbol, subscribe: 1 }));
    });
    log(`📡 Scanning ${VOLATILITIES.length} markets`);
}

// ===== GET LAST DIGIT =====
function getLastDigit(price) {
    const str = price.toString();
    if (str.includes('.')) return parseInt(str.split('.')[1].charAt(0)) || 0;
    return parseInt(str.slice(-1)) || 0;
}

// ===== HANDLE TICK FOR ALL MARKETS =====
function handleTick(tick) {
    const symbol = tick.symbol;
    const price = tick.quote;
    const digit = getLastDigit(price);
    
    // Update market data
    marketData[symbol] = { price, digit, time: tick.epoch };
    
    // Update history
    if (!tickHistory[symbol]) tickHistory[symbol] = [];
    if (!priceHistory[symbol]) priceHistory[symbol] = [];
    if (!digitHistory[symbol]) digitHistory[symbol] = Array(10).fill(0);
    
    tickHistory[symbol].push({ price, digit, time: tick.epoch });
    priceHistory[symbol].push(price);
    
    if (tickHistory[symbol].length > 200) tickHistory[symbol].shift();
    if (priceHistory[symbol].length > 200) priceHistory[symbol].shift();
    
    // Update digit counts for this symbol
    const recentDigits = tickHistory[symbol].slice(-100).map(t => t.digit);
    digitHistory[symbol] = Array(10).fill(0);
    recentDigits.forEach(d => digitHistory[symbol][d]++);
    
    // Analyze signal for this market
    analyzeMarketSignal(symbol);
    
    // Update display
    renderMarketGrid();
    updateStats();
    updateBestTrade();
    els.lastScan.textContent = `Last scan: ${new Date().toLocaleTimeString()}`;
}

// ===== ANALYZE INDIVIDUAL MARKET =====
function analyzeMarketSignal(symbol) {
    const history = tickHistory[symbol];
    if (!history || history.length < 50) return;
    
    const market = VOLATILITIES.find(v => v.symbol === symbol);
    const recent = history.slice(-30);
    const digits = recent.map(t => t.digit);
    const digitPcts = Array(10).fill(0);
    digits.forEach(d => digitPcts[d]++);
    const total = digits.length;
    
    // Calculate percentages
    const pcts = digitPcts.map(c => (c / total * 100).toFixed(1));
    
    // Find peak and second peak
    let sorted = [];
    for (let i = 0; i < 10; i++) {
        sorted.push({ digit: i, pct: parseFloat(pcts[i]) });
    }
    sorted.sort((a,b) => b.pct - a.pct);
    
    const peak = sorted[0];
    const second = sorted[1];
    const least = sorted[9];
    
    // Price trend
    const prices = recent.map(t => t.price);
    const trend = prices[prices.length - 1] > prices[0] ? 'RISE' : 'FALL';
    
    // ===== DETERMINE SIGNAL TYPE =====
    let signal = '--';
    let signalType = 'neutral';
    let confidence = 0;
    
    // Try RISE/FALL first
    if (trend === 'RISE' && peak.pct > 15) {
        signal = 'RISE';
        signalType = 'rise';
        confidence = 70 + Math.floor(peak.pct);
    } else if (trend === 'FALL' && peak.pct > 15) {
        signal = 'FALL';
        signalType = 'fall';
        confidence = 70 + Math.floor(peak.pct);
    }
    // Try EVEN/ODD
    else {
        const evenDigits = [0,2,4,6,8];
        const oddDigits = [1,3,5,7,9];
        
        let evenPct = 0, oddPct = 0;
        evenDigits.forEach(d => evenPct += digitPcts[d]);
        oddDigits.forEach(d => oddPct += digitPcts[d]);
        
        if (evenPct > oddPct * 1.5) {
            signal = 'EVEN';
            signalType = 'even';
            confidence = 70 + Math.floor(evenPct / total * 50);
        } else if (oddPct > evenPct * 1.5) {
            signal = 'ODD';
            signalType = 'odd';
            confidence = 70 + Math.floor(oddPct / total * 50);
        }
        // Try OVER/UNDER
        else {
            const lowPct = digitPcts[1] + digitPcts[2] + digitPcts[3];
            const highPct = digitPcts[7] + digitPcts[8] + digitPcts[9];
            
            if (lowPct > highPct * 1.3 && digitPcts[1] > 8 && digitPcts[2] > 8 && digitPcts[3] > 8) {
                signal = 'UNDER 4';
                signalType = 'under';
                confidence = 70 + Math.floor(lowPct / total * 30);
            } else if (highPct > lowPct * 1.3 && digitPcts[7] > 8 && digitPcts[8] > 8 && digitPcts[9] > 8) {
                signal = 'OVER 5';
                signalType = 'over';
                confidence = 70 + Math.floor(highPct / total * 30);
            }
            // Try MATCH/DIFFER
            else if (second.pct > 12) {
                signal = `MATCH ${second.digit}`;
                signalType = 'match';
                confidence = 75 + Math.floor(second.pct);
            } else if (least.pct < 4) {
                signal = `DIFFER ${least.digit}`;
                signalType = 'differ';
                confidence = 70 + Math.floor(20 - least.pct);
            }
        }
    }
    
    marketSignals[symbol] = {
        signal,
        direction: signalType,
        confidence: Math.min(95, confidence),
        peak: peak.digit,
        peakPct: peak.pct,
        second: second.digit,
        secondPct: second.pct,
        trend,
        digitPcts: pcts,
        price: marketData[symbol]?.price || 0,
        digit: marketData[symbol]?.digit || 0
    };
}

// ===== RENDER MARKET GRID =====
function renderMarketGrid() {
    let html = '';
    
    VOLATILITIES.forEach(v => {
        const signal = marketSignals[v.symbol] || { 
            signal: '--', 
            direction: 'neutral', 
            confidence: 0,
            price: 0,
            digit: 0,
            peak: 0,
            peakPct: 0,
            digitPcts: Array(10).fill(0)
        };
        
        const cardClass = `market-card ${signal.direction}`;
        const badgeClass = `signal-badge badge-${signal.direction}`;
        
        // Create digit bars
        let bars = '';
        for (let i = 0; i < 10; i++) {
            const pct = signal.digitPcts[i] || 0;
            bars += `<div class="digit-bar"><div class="digit-fill" style="width:${pct}%"></div></div>`;
        }
        
        html += `<div class="${cardClass}" onclick="selectMarket('${v.symbol}')">
            <div class="flex justify-between items-start">
                <div>
                    <div class="font-bold">${v.name}</div>
                    <div class="type-badge mt-1">${v.type} · ${v.ticksPerWindow} ticks/30s</div>
                </div>
                <span class="${badgeClass}">${signal.signal}</span>
            </div>
            
            <div class="flex justify-between mt-3">
                <div>
                    <span class="text-2xl font-mono">${signal.price.toFixed(2)}</span>
                    <span class="text-sm text-gray-400 ml-1">Digit: <span class="text-yellow-400 font-bold">${signal.digit}</span></span>
                </div>
                <div class="text-right">
                    <span class="metric">Confidence</span>
                    <div class="text-xl font-bold ${signal.confidence > 80 ? 'text-green-400' : 'text-yellow-400'}">${signal.confidence}%</div>
                </div>
            </div>
            
            <div class="stats-row">
                <div><span class="metric">Peak</span><br>${signal.peak} (${signal.peakPct.toFixed(1)}%)</div>
                <div><span class="metric">2nd</span><br>${signal.second} (${signal.secondPct.toFixed(1)}%)</div>
                <div><span class="metric">Trend</span><br><span class="${signal.trend === 'RISE' ? 'text-green-400' : 'text-red-400'}">${signal.trend || '--'}</span></div>
            </div>
            
            <div class="mt-2">
                <div class="flex gap-1">
                    ${Array(10).fill(0).map((_,i) => 
                        `<div class="flex-1 text-center text-xs ${i === signal.peak ? 'text-green-400 font-bold' : 'text-gray-500'}">${i}</div>`
                    ).join('')}
                </div>
                <div class="flex gap-1">
                    ${bars}
                </div>
            </div>
        </div>`;
    });
    
    els.marketGrid.innerHTML = html;
}

// ===== UPDATE STATISTICS =====
function updateStats() {
    let riseFall = 0, evenOdd = 0, overUnder = 0, matchDiffer = 0;
    let active = 0;
    
    Object.values(marketSignals).forEach(s => {
        if (s.signal !== '--' && s.confidence > 60) {
            active++;
            if (s.signal === 'RISE' || s.signal === 'FALL') riseFall++;
            else if (s.signal === 'EVEN' || s.signal === 'ODD') evenOdd++;
            else if (s.signal.includes('OVER') || s.signal.includes('UNDER')) overUnder++;
            else if (s.signal.includes('MATCH') || s.signal.includes('DIFFER')) matchDiffer++;
        }
    });
    
    els.activeCount.textContent = active;
    els.countRiseFall.textContent = riseFall;
    els.countEvenOdd.textContent = evenOdd;
    els.countOverUnder.textContent = overUnder;
    els.countMatchDiffer.textContent = matchDiffer;
}

// ===== FIND AND SHOW BEST TRADE =====
function updateBestTrade() {
    let best = null;
    let bestConfidence = 0;
    
    Object.entries(marketSignals).forEach(([symbol, signal]) => {
        if (signal.confidence > bestConfidence && signal.signal !== '--') {
            bestConfidence = signal.confidence;
            best = { symbol, ...signal };
        }
    });
    
    if (best && bestConfidence > 70) {
        const market = VOLATILITIES.find(v => v.symbol === best.symbol);
        els.bestTrade.classList.remove('hidden');
        
        els.bestTradeContent.innerHTML = `
            <div>
                <div class="metric">Market</div>
                <div class="font-bold">${market.name}</div>
                <div class="type-badge mt-1">${market.type}</div>
            </div>
            <div>
                <div class="metric">Signal</div>
                <div class="text-2xl font-bold text-yellow-400">${best.signal}</div>
                <div class="metric mt-1">Direction: ${best.direction}</div>
            </div>
            <div>
                <div class="metric">Confidence</div>
                <div class="text-3xl font-bold text-green-400">${best.confidence}%</div>
            </div>
            <div>
                <div class="metric">Entry</div>
                <div class="text-xl font-mono">${best.price.toFixed(2)}</div>
                <div class="metric mt-1">Digit: ${best.digit}</div>
            </div>
        `;
    } else {
        els.bestTrade.classList.add('hidden');
    }
}

// ===== SELECT MARKET =====
window.selectMarket = function(symbol) {
    const market = VOLATILITIES.find(v => v.symbol === symbol);
    const signal = marketSignals[symbol];
    if (market && signal) {
        alert(`📊 ${market.name}\n\n` +
              `Signal: ${signal.signal}\n` +
              `Confidence: ${signal.confidence}%\n` +
              `Price: ${signal.price.toFixed(2)}\n` +
              `Digit: ${signal.digit}\n` +
              `Peak Digit: ${signal.peak} (${signal.peakPct.toFixed(1)}%)\n` +
              `Trend: ${signal.trend}`);
    }
};

// ===== INIT =====
function init() {
    // Render empty grid initially
    renderMarketGrid();
    log('🚀 Zion Market Scanner initialized');
    log('📡 Ready to scan all 13 volatilities');
}

init();
</script>
</body>
                                                          </html>
