<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Synthetic Hub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@deriv/deriv-api/dist/DerivAPIBasic.js"></script>
</head>
<body>
    <header>
        <h1>Live Synthetic Platform</h1>
        <div id="connection-status">Connecting to Deriv...</div>
    </header>
    
    <main>
        <section id="platform-updates">
            <h3>Platform Status: <span id="status-text">Checking...</span></h3>
        </section>

        <section id="asset-container">
            <h3>Available Indices (Auto-Detected)</h3>
            <div id="loader">Reading platform data...</div>
            <div id="indices-grid" class="grid"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
