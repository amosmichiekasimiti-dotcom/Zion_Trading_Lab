<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deriv Dynamic Discovery</title>
    <!-- Tailwind CSS for Design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #ffffff; font-family: sans-serif; }
        .market-card {
            background: #111111;
            border: 1px solid #222;
            transition: all 0.3s ease;
        }
        .market-card:hover {
            border-color: #3b82f6;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px -10px rgba(59, 130, 246, 0.4);
        }
        .active-filter {
            background-color: #3b82f6 !important;
            color: white !important;
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Header -->
    <header class="border-b border-white/10 p-6 sticky top-0 bg-black/90 backdrop-blur-md z-50">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="text-center md:text-left">
                <h1 class="text-2xl font-black tracking-tighter uppercase">Deriv Auto-Pull</h1>
                <p id="status-text" class="text-[10px] font-bold text-yellow-500 uppercase tracking-widest mt-1">Connecting Handshake...</p>
            </div>
            
            <nav id="filter-nav" class="flex flex-wrap gap-2 justify-center">
                <button onclick="updateFilter('all', this)" class="active-filter px-4 py-2 rounded-full text-[10px] font-bold uppercase bg-zinc-800 text-zinc-400">All</button>
                <button onclick="updateFilter('synthetic_index', this)" class="px-4 py-2 rounded-full text-[10px] font-bold uppercase bg-zinc-800 text-zinc-400">Synthetics</button>
                <button onclick="updateFilter('forex', this)" class="px-4 py-2 rounded-full text-[10px] font-bold uppercase bg-zinc-800 text-zinc-400">Forex</button>
                <button onclick="updateFilter('indices', this)" class="px-4 py-2 rounded-full text-[10px] font-bold uppercase bg-zinc-800 text-zinc-400">Stocks</button>
            </nav>
        </div>
    </header>

    <!-- Market Grid -->
    <main class="max-w-7xl mx-auto p-6">
        <div id="market-display" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
            <div class="col-span-full py-20 text-center text-zinc-500">
                Waiting for Deriv Handshake...
            </div>
        </div>
    </main>

    <script>
        const socket = new WebSocket('wss://ws.binaryws.com/websockets/v3?app_id=1089');
        let globalSymbols = [];

        socket.onopen = () => {
            document.getElementById('status-text').innerText = "Handshake Secure - Reading Markets";
            document.getElementById('status-text').classList.replace('text-yellow-500', 'text-green-500');

            // This command pulls EVERYTHING from Deriv
            socket.send(JSON.stringify({
                "active_symbols": "full",
                "product_type": "basic"
            }));
        };

        socket.onmessage = (msg) => {
            const data = JSON.parse(msg.data);
            if (data.msg_type === 'active_symbols') {
                globalSymbols = data.active_symbols;
                renderMarkets(globalSymbols);
            }
        };

        function renderMarkets(markets) {
            const display = document.getElementById('market-display');
            display.innerHTML = '';

            markets.forEach(m => {
                const isFast = m.display_name.includes('1s') ? '⚡' : '';
                const card = document.createElement('div');
                card.className = 'market-card p-5 rounded-xl flex flex-col justify-between h-32';
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="text-[9px] font-black text-zinc-600 uppercase tracking-tighter">${m.market_display_name}</span>
                        <span class="text-blue-500 text-xs">${isFast}</span>
                    </div>
                    <div>
                        <h3 class="text-sm font-bold leading-tight">${m.display_name}</h3>
                        <p class="text-[10px] font-mono text-zinc-500 mt-1">${m.symbol}</p>
                    </div>
                `;
                display.appendChild(card);
            });
        }

        function updateFilter(type, btn) {
            document.querySelectorAll('#filter-nav button').forEach(b => b.classList.remove('active-filter'));
            btn.classList.add('active-filter');
            if (type === 'all') {
                renderMarkets(globalSymbols);
            } else {
                renderMarkets(globalSymbols.filter(s => s.market === type));
            }
        }

        setInterval(() => {
            if (socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ "ping": 1 }));
        }, 30000);
    </script>
</body>
</html>
