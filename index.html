<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zion Trading Lab | Pro Dashboard</title>
    <style>
        :root { --deriv-red: #ff444f; --bg-gray: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-gray); margin: 20px; }
        
        /* Tabs */
        .tabs-header { display: flex; gap: 10px; border-bottom: 2px solid #ddd; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; border: none; background: none; cursor: pointer; font-weight: bold; color: #666; }
        .tab-btn.active { color: var(--deriv-red); border-bottom: 3px solid var(--deriv-red); }

        /* Table */
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #fafafa; padding: 15px; text-align: left; color: #888; border-bottom: 1px solid #eee; }
        td { padding: 15px; border-bottom: 1px solid #f9f9f9; }
        
        .status-pill { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
        .open { background: #e6f4ea; color: #008832; }
        .closed { background: #fce8e6; color: var(--deriv-red); }

        /* Modal Popup */
        #marketModal { display:none; position:fixed; z-index:100; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.7); }
        .modal-content { background:white; margin:10% auto; padding:20px; border-radius:10px; width:80%; max-width:500px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Zion Trading Lab Dashboard</h1>
    <div id="connection-status">● Connecting...</div>

    <div class="tabs-header">
        <button class="tab-btn active" onclick="filterMarket('synthetic_index', this)">Derived</button>
        <button class="tab-btn" onclick="filterMarket('forex', this)">Forex</button>
        <button class="tab-btn" onclick="filterMarket('cryptocurrency', this)">Crypto</button>
    </div>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>Market Name</th>
                    <th>Symbol</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="market-list"></tbody>
        </table>
    </div>
</div>
<div id="marketModal" style="display:none; position:fixed; z-index:100; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.8); backdrop-filter: blur(5px);">

    <div style="background:white; margin:15% auto; padding:25px; border-radius:15px; width:85%; max-width:450px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.3);">
        <span onclick="closeModal()" style="float:right; cursor:pointer; font-size:28px; font-weight:bold; color:#888;">&times;</span>
        <h2 id="modalTitle" style="color:#333; margin-top:0;">Market Analysis</h2>
        <hr style="border:0; border-top:1px solid #eee; margin:20px 0;">
        
        <div id="modalContent">
            <p style="color:#666;">Current Price</p>
            <h1 id="live-price" style="font-size:3.5rem; margin:10px 0; font-family:monospace; color:#333;">---</h1>
            <div id="price-direction" style="font-weight:bold; font-size:1.2rem; color:#888;">Connecting to feed...</div>
        </div>
        <button onclick="closeModal()" style="margin-top:25px; width:100%; padding:12px; background:#ff444f; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Close Dashboard</button>
    </div>
<script src="script.js"></script>
</body>
</html>
