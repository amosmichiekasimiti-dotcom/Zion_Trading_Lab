<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Synthetic Trading Terminal</title>
<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0f172a;
    color:white;
}

header{
    background:#111827;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #1f2937;
}

h1{
    font-size:18px;
}

select, input{
    padding:6px;
    background:#1f2937;
    border:none;
    color:white;
}

.container{
    display:grid;
    grid-template-columns: 2fr 1fr;
    gap:15px;
    padding:15px;
}

.card{
    background:#111827;
    border-radius:10px;
    padding:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.5);
}

button{
    background:#2563eb;
    border:none;
    padding:10px;
    color:white;
    cursor:pointer;
    border-radius:6px;
    margin-top:5px;
}

button:hover{
    background:#1d4ed8;
}

.chart-icons{
    display:flex;
    gap:15px;
    margin-bottom:10px;
}

.icon{
    background:#1f2937;
    padding:10px;
    border-radius:8px;
    cursor:pointer;
    text-align:center;
    flex:1;
}

.icon:hover{
    background:#374151;
}

.digit-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:5px;
}

.digit-box{
    background:#1f2937;
    padding:8px;
    text-align:center;
    border-radius:6px;
}

.signal{
    font-size:18px;
    font-weight:bold;
    margin-top:10px;
}

.green{color:#10b981;}
.red{color:#ef4444;}
.yellow{color:#facc15;}

footer{
    text-align:center;
    padding:10px;
    font-size:12px;
    color:gray;
}
</style>
</head>

<body>

<header>
<h1>AI Synthetic Trading Terminal</h1>

<div>
Market:
<select id="market">
<option value="R_10">Volatility 10</option>
<option value="R_25">Volatility 25</option>
<option value="R_50">Volatility 50</option>
<option value="R_75">Volatility 75</option>
<option value="R_100">Volatility 100</option>
</select>

Stake: <input type="number" id="stake" value="1">
Max Loss: <input type="number" id="maxLoss" value="5">
</div>
</header>

<div class="container">

<!-- LEFT SIDE -->
<div class="card">

<div class="chart-icons">
<div class="icon" onclick="openDeriv()">📊 Open Deriv Chart</div>
<div class="icon" onclick="openTrader()">🔢 Digit Trader</div>
</div>

<div id="tv_chart" style="height:450px;"></div>

</div>

<!-- RIGHT SIDE -->
<div class="card">

<h3>Digit Analyzer</h3>
<h2 id="lastDigit">-</h2>

<div class="digit-grid" id="digitGrid"></div>

<div class="signal" id="evenOddSignal">Even/Odd: -</div>
<div class="signal" id="overUnderSignal">Over/Under: -</div>

<hr>

<h3>Risk Control</h3>
<div>Loss Count: <span id="lossCount">0</span></div>
<div>Total Loss: <span id="totalLoss">0</span></div>

<button onclick="resetStats()">Reset</button>

</div>
</div>

<footer>
Professional Synthetic Index Terminal
</footer>

<script>
let digitFrequency = Array(10).fill(0);
let tickHistory = [];
let lossCount = 0;
let totalLoss = 0;
let ws;

// Initialize TradingView
function loadChart(symbol){
    document.getElementById("tv_chart").innerHTML="";
    new TradingView.widget({
        container_id:"tv_chart",
        width:"100%",
        height:450,
        symbol:symbol,
        interval:"1",
        timezone:"Etc/UTC",
        theme:"dark",
        style:"1",
        locale:"en",
        toolbar_bg:"#111827",
        enable_publishing:false
    });
}

loadChart("R_100");

// Open Deriv external
function openDeriv(){
    window.open("https://app.deriv.com/charts","_blank");
}

function openTrader(){
    window.open("https://app.deriv.com/trader","_blank");
}

// Connect WebSocket
function connect(){
    if(ws) ws.close();

    ws = new WebSocket("wss://ws.derivws.com/websockets/v3?app_id=1089");

    ws.onopen = () => {
        ws.send(JSON.stringify({
            ticks: document.getElementById("market").value
        }));
    };

    ws.onmessage = (msg)=>{
        const data = JSON.parse(msg.data);
        if(data.tick){
            let price = data.tick.quote.toString();
            let lastDigit = parseInt(price.slice(-1));
            processDigit(lastDigit);
        }
    };
}

function processDigit(digit){
    document.getElementById("lastDigit").innerText=digit;

    digitFrequency[digit]++;
    tickHistory.push(digit);
    if(tickHistory.length>100) tickHistory.shift();

    updateGrid();
    generateSignals();
}

function updateGrid(){
    let grid="";
    for(let i=0;i<10;i++){
        grid += `<div class="digit-box">${i}: ${digitFrequency[i]}</div>`;
    }
    document.getElementById("digitGrid").innerHTML=grid;
}

function generateSignals(){

    let even = 0;
    let odd = 0;

    tickHistory.forEach(d=>{
        if(d%2==0) even++;
        else odd++;
    });

    if(even > odd){
        document.getElementById("evenOddSignal").innerHTML=
        "Even Bias: <span class='green'>BUY EVEN</span>";
    }else{
        document.getElementById("evenOddSignal").innerHTML=
        "Odd Bias: <span class='green'>BUY ODD</span>";
    }

    let high=0, low=0;
    tickHistory.forEach(d=>{
        if(d>=5) high++;
        else low++;
    });

    if(high>low){
        document.getElementById("overUnderSignal").innerHTML=
        "Over 5 Bias: <span class='yellow'>BUY OVER</span>";
    }else{
        document.getElementById("overUnderSignal").innerHTML=
        "Under 5 Bias: <span class='yellow'>BUY UNDER</span>";
    }
}

function resetStats(){
    digitFrequency = Array(10).fill(0);
    tickHistory=[];
    lossCount=0;
    totalLoss=0;
    document.getElementById("lossCount").innerText=0;
    document.getElementById("totalLoss").innerText=0;
}

document.getElementById("market").addEventListener("change",()=>{
    loadChart(document.getElementById("market").value);
    connect();
});

connect();
</script>

</body>
</html>
