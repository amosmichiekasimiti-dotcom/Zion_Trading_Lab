<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zion Ultimate | Fixed Terminal</title>
    <style>
        :root { --red: #ff444f; --dark: #050508; --green: #00ff88; --gold: #ffd700; --blue: #00f2fe; --panel: #111118; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; margin: 0; padding: 10px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .dash-header { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .box { background: var(--panel); padding: 10px; border-radius: 10px; border: 1px solid #222; text-align: center; }
        .lbl { font-size: 8px; color: #888; text-transform: uppercase; }
        .val { font-size: 16px; font-weight: bold; color: var(--blue); font-family: monospace; }

        .nav-tabs { display: flex; gap: 5px; margin-bottom: 10px; background: #1a1a24; padding: 5px; border-radius: 8px; border: 1px solid #333; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: none; color: #888; border-radius: 5px; cursor: pointer; font-size: 11px; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: var(--red); color: white; box-shadow: 0 0 10px rgba(255, 68, 79, 0.3); }

        .market-browser { flex-grow: 1; overflow-y: auto; background: var(--panel); border-radius: 12px; border: 1px solid #222; padding: 5px; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 15px 10px; border-bottom: 1px solid #1a1a24; font-size: 13px; }
        .btn-action { background: var(--blue); color: #000; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; font-size: 10px; cursor: pointer; }

        #sniper-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 1000; display: none; flex-direction: column; padding: 15px; box-sizing: border-box; }
        .price-big { font-size: 45px; text-align: center; font-family: monospace; color: var(--blue); margin: 20px 0; font-weight: bold; }
        
        .buy-btn { width: 100%; padding: 20px; border-radius: 12px; border: none; font-size: 18px; font-weight: 900; cursor: pointer; text-transform: uppercase; background: #222; color: #444; }
        .buy-btn.active { background: var(--gold); color: #000; box-shadow: 0 0 25px var(--gold); }
        .terminal { height: 60px; background: #000; color: var(--green); font-family: monospace; font-size: 10px; padding: 10px; border-top: 2px solid #222; overflow-y: auto; }
    </style>
</head>
<body>

<div class="dash-header">
    <div class="box"><div class="lbl">Balance</div><div id="acc-bal" class="val">$23.74</div></div>
    <div class="box"><div class="lbl">Session P/L</div><div id="acc-pl" class="val">$0.00</div></div>
    <div class="box"><div class="lbl">Next Stake</div><div id="acc-stake" class="val">$1.60</div></div>
</div>

<div style="background:var(--panel); padding:10px; border-radius:10px; margin-bottom:10px; border:1px solid #333; display:flex; gap:10px;">
    <input type="password" id="api-token" placeholder="Enter Deriv Token" style="flex-grow:1; background:#000; border:1px solid #444; color:var(--gold); padding:10px; border-radius:5px; font-family:monospace;">
    <button onclick="initAccount()" style="background:var(--green); border:none; padding:10px 20px; border-radius:5px; font-weight:bold; cursor:pointer;">CONNECT</button>
</div>

<div class="nav-tabs">
    <button id="tab-radar" class="tab-btn active" onclick="showView('radar', this)">GLOBAL RADAR</button>
    <button id="tab-manual" class="tab-btn" onclick="showView('manual', this)">MARKET LIST</button>
</div>

<div id="view-radar" class="market-browser">
    <table><tbody id="radar-body"><tr><td style="text-align:center; color:#555;">Radar Idle. Connect to Scan.</td></tr></tbody></table>
</div>

<div id="view-manual" class="market-browser" style="display:none;">
    <table><tbody id="manual-body"><tr><td style="text-align:center; color:#555;">List Empty. Fetching assets...</td></tr></tbody></table>
</div>

<div id="sniper-overlay">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 id="target-title" style="margin:0; color:var(--gold);">ASSET SNIPER</h2>
        <button onclick="closeSniper()" style="background:#333; color:white; border:none; padding:8px 15px; border-radius:5px;">BACK</button>
    </div>
    <div class="price-big" id="live-tick">0.0000</div>
    <div style="background:var(--panel); padding:15px; border-radius:10px; border:1px solid #333; margin-bottom:15px;">
        <div id="logic-list" style="font-family:monospace; font-size:11px;"></div>
    </div>
    <button id="exec-btn" class="buy-btn" disabled>Waiting for Signal...</button>
    <div id="tv-chart" style="flex-grow:1; margin-top:15px; border-radius:10px; overflow:hidden;"></div>
</div>

<div class="terminal" id="sys-log">>> System Ready. Awaiting Token...</div>

<script>
    let wsMkt, wsAcc, activeSym = '', allAssets = [], marketData = {};
    let sessionPL = 0, currentStake = 1.60, isTrading = false;

    function log(m) { const l = document.getElementById('sys-log'); l.innerHTML += `<br>> ${m}`; l.scrollTop = l.scrollHeight; }

    function initAccount() {
        const token = document.getElementById('api-token').value;
        if(!token) return alert("Please paste your API Token!");
        
        log("Connecting to Gateway...");
        wsAcc = new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=126973');
        
        wsAcc.onopen = () => wsAcc.send(JSON.stringify({ authorize: token }));
        
        wsAcc.onmessage = (e) => {
            const d = JSON.parse(e.data);
            if(d.authorize) {
                log("Connection Verified.");
                document.getElementById('acc-bal').innerText = "$" + d.authorize.balance;
                wsAcc.send(JSON.stringify({ balance: 1, subscribe: 1 }));
                wsAcc.send(JSON.stringify({ proposal_open_contract: 1, subscribe: 1 }));
                fetchMarkets(); // Force market list generation
            }
            if(d.balance) document.getElementById('acc-bal').innerText = "$" + d.balance.balance;
            if(d.proposal_open_contract) handleContract(d.proposal_open_contract);
        };
    }

    function fetchMarkets() {
        log("Refreshing Market Data...");
        wsMkt = new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=126973');
        wsMkt.onopen = () => wsMkt.send(JSON.stringify({ active_symbols: "brief", product_type: "basic" }));
        
        wsMkt.onmessage = (e) => {
            const d = JSON.parse(e.data);
            if(d.active_symbols) {
                // Filter specifically for the assets you see in your screenshots
                allAssets = d.active_symbols.filter(s => s.market === 'synthetic_index');
                log(`Found ${allAssets.length} Synthetic Assets.`);
                renderManualList();
                
                // Subscribe to ticks for the Radar
                allAssets.slice(0, 15).forEach(s => {
                    marketData[s.symbol] = { digits: [], name: s.display_name, prices: [] };
                    wsMkt.send(JSON.stringify({ ticks: s.symbol, subscribe: 1 }));
                });
            }
            if(d.tick) processTick(d.tick);
        };
    }

    function renderManualList() {
        const manual = document.getElementById('manual-body');
        if(allAssets.length === 0) return;
        manual.innerHTML = allAssets.map(s => `
            <tr>
                <td style="font-weight:bold;">${s.display_name}</td>
                <td style="text-align:right;">
                    <button class="btn-action" onclick="openSniper('${s.symbol}','${s.display_name}')">SNIPE ASSET</button>
                </td>
            </tr>
        `).join('');
    }

    function processTick(t) {
        if(!marketData[t.symbol]) return;
        const d = parseInt(t.quote.toString().slice(-1));
        marketData[t.symbol].digits.push(d);
        marketData[t.symbol].prices.push(t.quote);
        if(marketData[t.symbol].digits.length > 15) { marketData[t.symbol].digits.shift(); marketData[t.symbol].prices.shift(); }

        if(t.symbol === activeSym) {
            document.getElementById('live-tick').innerText = t.quote;
            updateSniperLogic(marketData[t.symbol]);
        }
        updateRadarUI();
    }

    function updateRadarUI() {
        const radar = document.getElementById('radar-body');
        const sorted = Object.keys(marketData).sort((a,b) => {
            const scoreA = marketData[a].digits.slice(-10).filter(x => x > 4).length;
            const scoreB = marketData[b].digits.slice(-10).filter(x => x > 4).length;
            return scoreB - scoreA;
        });
        
        radar.innerHTML = sorted.map(k => {
            const data = marketData[k];
            const score = data.digits.slice(-10).filter(x => x > 4).length;
            return `
                <tr>
                    <td>${data.name}</td>
                    <td style="color:${score >= 8 ? 'var(--green)' : '#555'}; font-weight:bold;">${score}/10 GINO</td>
                    <td style="text-align:right;"><button class="btn-action" onclick="openSniper('${k}','${data.name}')">VIEW</button></td>
                </tr>
            `;
        }).join('');
    }

    function openSniper(sym, name) {
        activeSym = sym;
        document.getElementById('target-title').innerText = name;
        document.getElementById('sniper-overlay').style.display = 'flex';
        document.getElementById('tv-chart').innerHTML = `<iframe src="https://tradingview.binary.com/v2/main.php?symbol=${sym}&theme=dark" width="100%" height="100%" frameborder="0"></iframe>`;
    }

    function updateSniperLogic(data) {
        const last10 = data.digits.slice(-10);
        const vacuum = !last10.includes(0) && !last10.includes(1);
        const density = last10.filter(x => x > 4).length >= 8;
        const trigger = data.digits[data.digits.length-1] >= 8;

        document.getElementById('logic-list').innerHTML = `
            VACUUM (0,1 COLD): <span style="color:${vacuum?'var(--green)':'#444'}">${vacuum?'PASS':'FAIL'}</span><br>
            ZONE DENSITY: <span style="color:${density?'var(--green)':'#444'}">${density?'PASS':'FAIL'}</span><br>
            GINO TRIGGER: <span style="color:${trigger?'var(--green)':'#444'}">${trigger?'PASS':'FAIL'}</span>
        `;

        const btn = document.getElementById('exec-btn');
        if(vacuum && density && trigger && !isTrading) {
            btn.disabled = false; btn.className = "buy-btn active"; btn.innerText = "GINO READY: SNIPE";
        } else {
            btn.disabled = true; btn.className = "buy-btn"; btn.innerText = "WAITING FOR SIGNAL...";
        }
    }

    document.getElementById('exec-btn').onclick = () => {
        isTrading = true;
        wsAcc.send(JSON.stringify({
            buy: "1", price: currentStake,
            parameters: { amount: currentStake, basis: "stake", contract_type: "CALL", currency: "USD", duration: 1, duration_unit: "t", symbol: activeSym }
        }));
    };

    function handleContract(c) {
        if(c.is_sold) {
            sessionPL += c.profit;
            document.getElementById('acc-pl').innerText = "$" + sessionPL.toFixed(2);
            // Martingale Logic from Bandwagon XML
            if(c.profit > 0) { currentStake = 1.60; log("WIN! Stake Reset."); }
            else { currentStake = (currentStake * 2.1).toFixed(2); log("LOSS. Martingale Applied."); }
            document.getElementById('acc-stake').innerText = "$" + currentStake;
            isTrading = false;
        }
    }

    function showView(view, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('view-radar').style.display = view === 'radar' ? 'block' : 'none';
        document.getElementById('view-manual').style.display = view === 'manual' ? 'block' : 'none';
        if(view === 'manual') renderManualList();
    }

    function closeSniper() { document.getElementById('sniper-overlay').style.display = 'none'; activeSym = ''; }
</script>
</body>
</html>
