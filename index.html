<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zion Trading Lab | Live</title>
    <link rel="stylesheet" href="style.css?v=302">
    <script src="https://unpkg.com/@deriv/deriv-api/dist/DerivAPIBasic.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <h1>Zion Trading Lab</h1>
            <div id="connection-status" class="status-badge">System Offline</div>
        </div>
    </header>
    
    <main class="container">
        <div id="loader-area">
            <div class="spinner"></div>
            <p id="loading-text">Synchronizing with platform assets...</p>
        </div>

        <div id="indices-grid" class="asset-grid"></div>

        <div id="debug-log" class="hidden">
            <h3>⚠️ System Notification</h3>
            <p id="error-msg"></p>
            <p><small>Ensure Redirect URL matches in api.deriv.com</small></p>
        </div>
    </main>

    <script src="app.js?v=302"></script>
</body>
</html>
