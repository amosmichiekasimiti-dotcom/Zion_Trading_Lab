<script>
    // Try 1089 first to test if the code works, then switch back to 125403
    const APP_ID = 125403; 
    const tickerBody = document.getElementById('ticker-body');
    const statusDiv = document.getElementById('status');
    const errorDisplay = document.getElementById('error-display');
    
    let ws;
    const symbolRows = {};

    function connect() {
        // Use wss:// for secure Vercel connections
        ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);

        ws.onopen = () => {
            statusDiv.innerText = "Connected! Fetching Indices...";
            errorDisplay.style.display = 'none';
            ws.send(JSON.stringify({ "active_symbols": "brief", "product_type": "basic" }));
        };

        ws.onmessage = (msg) => {
            const data = JSON.parse(msg.data);

            if (data.error) {
                errorDisplay.innerText = "Deriv API Error: " + data.error.message;
                errorDisplay.style.display = 'block';
                return;
            }

            if (data.msg_type === 'active_symbols') {
                const synthetics = data.active_symbols.filter(s => s.market === 'synthetic_index');
                tickerBody.innerHTML = ''; // Clear "Loading"
                
                synthetics.forEach(s => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="symbol-name">${s.display_name}</td>
                        <td>${s.symbol}</td>
                        <td id="price-${s.symbol}">- - -</td>
                    `;
                    tickerBody.appendChild(row);
                    symbolRows[s.symbol] = { element: document.getElementById(`price-${s.symbol}`), lastPrice: 0 };
                    ws.send(JSON.stringify({ "ticks": s.symbol, "subscribe": 1 }));
                });
                statusDiv.innerText = `Live: ${synthetics.length} Indices`;
            }

            if (data.msg_type === 'tick') {
                const tick = data.tick;
                const info = symbolRows[tick.symbol];
                if (info) {
                    const currentPrice = tick.quote;
                    info.element.className = currentPrice >= info.lastPrice ? 'price-up' : 'price-down';
                    info.element.innerText = currentPrice;
                    info.lastPrice = currentPrice;
                }
            }
        };

        ws.onclose = () => {
            statusDiv.innerText = "Reconnecting...";
            setTimeout(connect, 5000);
        };
    }

    connect();
    setInterval(() => { if(ws.readyState === 1) ws.send(JSON.stringify({"ping":1})); }, 30000);
</script>
