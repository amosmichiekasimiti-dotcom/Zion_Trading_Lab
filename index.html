<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Zion Advanced Quant Engine</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0f172a;color:white;font-family:Arial}
.card{background:#1e293b;padding:20px;border-radius:12px;margin-bottom:15px}
.green{color:#22c55e}.red{color:#ef4444}.yellow{color:#facc15}
</style>
</head>
<body class="p-6">

<h1 class="text-3xl font-bold mb-4">Zion Advanced Quant Engine</h1>

<div class="card">
API Token:
<input id="token" type="password" class="text-black p-2 w-full mb-2">
<button onclick="connect()" class="bg-blue-600 px-4 py-2 rounded">Connect</button>
<div id="status">Disconnected</div>
</div>

<div class="card">
Symbol:
<select id="symbol" class="text-black p-1">
<option value="R_100">Volatility 100</option>
<option value="1HZ100V">Volatility 100 (1s)</option>
</select>

Base Stake:
<input id="stake" type="number" value="1" class="text-black p-1">

Max Trades:
<input id="maxTrades" type="number" value="10" class="text-black p-1">

Max Consecutive Losses:
<input id="maxLoss" type="number" value="3" class="text-black p-1">

Auto:
<select id="auto" class="text-black p-1">
<option value="off">OFF</option>
<option value="on">ON</option>
</select>
</div>

<div class="card">
Price: <span id="price">--</span><br>
Digit: <span id="digit">--</span><br>
Trend: <span id="trend">--</span><br>
Volatility: <span id="vol">--</span><br>
Momentum: <span id="momentum">--</span><br>
Confidence: <span id="confidence">--</span>%
</div>

<div class="card">
Win Rate: <span id="winrate">0%</span><br>
Trades: <span id="trades">0</span><br>
Consecutive Losses: <span id="losses">0</span>
</div>

<div class="card">
<button onclick="manualTrade()" class="bg-green-600 px-6 py-2 rounded">Manual Trade</button>
<div id="log"></div>
</div>

<script>

let ws, authorized=false;
let prices=[], digits=[];
let proposalId=null;
let tradeCount=0;
let wins=0;
let losses=0;
let consecutiveLosses=0;

function connect(){
ws=new WebSocket("wss://ws.derivws.com/websockets/v3?app_id=126973");

ws.onopen=()=>{
ws.send(JSON.stringify({authorize:document.getElementById("token").value}));
};

ws.onmessage=(m)=>{
let data=JSON.parse(m.data);

if(data.msg_type==="authorize"){
authorized=true;
document.getElementById("status").innerText="Connected";
subscribe();
}

if(data.msg_type==="tick") handleTick(data.tick);
if(data.msg_type==="proposal") proposalId=data.proposal.id;
if(data.msg_type==="buy"){
tradeCount++;
updateStats();
log("Trade Placed ID "+data.buy.contract_id);
}

if(data.msg_type==="proposal_open_contract"){
if(data.proposal_open_contract.is_sold){
if(data.proposal_open_contract.profit>0){
wins++; consecutiveLosses=0;
}else{
losses++; consecutiveLosses++;
}
updateStats();
}
}

};

}

function subscribe(){
ws.send(JSON.stringify({
ticks:document.getElementById("symbol").value,
subscribe:1
}));
}

function handleTick(tick){
let price=tick.quote;
let digit=parseInt(price.toString().slice(-1));

prices.push(price);
digits.push(digit);
if(prices.length>200) prices.shift();
if(digits.length>200) digits.shift();

document.getElementById("price").innerText=price;
document.getElementById("digit").innerText=digit;

analyze();
}

function analyze(){

if(prices.length<30) return;

let returns=[];
for(let i=1;i<prices.length;i++)
returns.push(prices[i]-prices[i-1]);

let mean=returns.reduce((a,b)=>a+b)/returns.length;
let variance=returns.reduce((a,b)=>a+Math.pow(b-mean,2),0)/returns.length;
let volatility=Math.sqrt(variance);

// Momentum persistence
let sameDirection=0;
for(let i=1;i<returns.length;i++){
if(Math.sign(returns[i])===Math.sign(returns[i-1]))
sameDirection++;
}
let momentum=sameDirection/returns.length;

document.getElementById("trend").innerText=mean.toFixed(5);
document.getElementById("vol").innerText=volatility.toFixed(5);
document.getElementById("momentum").innerText=(momentum*100).toFixed(1)+"%";

// Multi-factor confidence
let trendScore=Math.abs(mean)/(volatility+0.0001);
let momentumScore=momentum;
let volatilityFilter=volatility<5?1:0.5;

let confidence=Math.min(95,Math.round((trendScore*50 + momentumScore*50)*volatilityFilter));
document.getElementById("confidence").innerText=confidence;

if(document.getElementById("auto").value==="on"
&& confidence>75
&& tradeCount<parseInt(document.getElementById("maxTrades").value)
&& consecutiveLosses<parseInt(document.getElementById("maxLoss").value)){
execute(mean>0?"CALL":"PUT",confidence);
}

}

function execute(type,confidence){

if(!authorized) return;

let baseStake=parseFloat(document.getElementById("stake").value);

// Risk-adjusted stake
let stake=baseStake*(confidence/100);

ws.send(JSON.stringify({
proposal:1,
amount:stake,
basis:"stake",
contract_type:type,
currency:"USD",
duration:5,
duration_unit:"t",
symbol:document.getElementById("symbol").value
}));

setTimeout(()=>{
if(proposalId){
ws.send(JSON.stringify({
buy:proposalId,
price:stake
}));
}
},800);

}

function manualTrade(){
execute("CALL",80);
}

function updateStats(){
let total=wins+losses;
let winrate=total>0?((wins/total)*100).toFixed(1):0;
document.getElementById("winrate").innerText=winrate+"%";
document.getElementById("trades").innerText=tradeCount;
document.getElementById("losses").innerText=consecutiveLosses;
}

function log(msg){
document.getElementById("log").innerText=msg;
}

</script>

</body>
</html>
