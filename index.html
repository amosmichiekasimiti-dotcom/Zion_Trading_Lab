<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zion Trading Lab - All Volatilities</title>
<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #0f172a;
        color: white;
    }
    header {
        padding: 15px;
        background: #111827;
        text-align: center;
        font-weight: bold;
        font-size: 20px;
        border-bottom: 2px solid #1f2937;
    }
    .volatility-buttons, .signal-buttons {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        padding: 15px;
    }
    button {
        padding: 10px 15px;
        background: #1f2937;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.2s;
    }
    button:hover {
        background: #3b82f6;
    }
    .charts-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        padding: 20px;
    }
    .chart-box {
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 8px;
        padding: 10px;
        width: 450px;
        height: 400px;
    }
</style>
</head>
<body>

<header>Zion Trading Lab - AI Signals Dashboard</header>

<section class="volatility-buttons">
    <button data-symbol="1HZ10V">Volatility 10 (1s) Index</button>
    <button data-symbol="1H10V">Volatility 10 Index</button>
    <button data-symbol="1HZ15V">Volatility 15 (1s) Index</button>
    <button data-symbol="1HZ25V">Volatility 25 (1s) Index</button>
    <button data-symbol="1H25V">Volatility 25 Index</button>
    <button data-symbol="1HZ30V">Volatility 30 (1s) Index</button>
    <button data-symbol="1HZ50V">Volatility 50 (1s) Index</button>
    <button data-symbol="1H50V">Volatility 50 Index</button>
    <button data-symbol="1HZ75V">Volatility 75 (1s) Index</button>
    <button data-symbol="1H75V">Volatility 75 Index</button>
    <button data-symbol="1HZ90V">Volatility 90 (1s) Index</button>
    <button data-symbol="1HZ100V">Volatility 100 (1s) Index</button>
    <button data-symbol="1H100V">Volatility 100 Index</button>
</section>

<section class="signal-buttons">
    <button data-signal="rise">Rise</button>
    <button data-signal="fall">Fall</button>
    <button data-signal="even">Even</button>
    <button data-signal="odd">Odd</button>
    <button data-signal="over">Over</button>
    <button data-signal="under">Under</button>
    <button data-signal="matches">Matches</button>
    <button data-signal="differs">Differs</button>
</section>

<section class="charts-container">
    <div class="chart-box" id="tradingview1"></div>
    <div class="chart-box" id="digitchart">Digit Chart Placeholder</div>
</section>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
    // Initialize TradingView chart for each symbol dynamically
    const tradingViewBoxes = ["tradingview1"];
    tradingViewBoxes.forEach(boxId => {
        new TradingView.widget({
            container_id: boxId,
            width: "100%",
            height: "100%",
            symbol: "1HZ10V", // Default, will update based on click
            interval: "1",
            timezone: "Etc/UTC",
            theme: "dark",
            style: "1",
            locale: "en",
            toolbar_bg: "#111827",
            enable_publishing: false,
            allow_symbol_change: true
        });
    });

    // Volatility Button Click Logic
    const volButtons = document.querySelectorAll('.volatility-buttons button');
    volButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            const symbol = btn.dataset.symbol;
            alert(`Selected Volatility: ${symbol}`);
            // Here you can trigger DeepSeek API logic or XML bot signals for selected volatility
        });
    });

    // Signal Button Click Logic
    const signalButtons = document.querySelectorAll('.signal-buttons button');
    signalButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            const signal = btn.dataset.signal;
            alert(`Selected Signal: ${signal}`);
            // Here you can run your 10-point verification logic for Rise/Fall, Even/Odd, etc.
        });
    });
</script>

</body>
</html>
