<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zion Trading Lab | Automated Hub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@deriv/deriv-api/dist/DerivAPIBasic.js"></script>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Zion Trading Lab</h1>
            <div id="connection-status" class="status-badge">Establishing Connection...</div>
        </div>
    </header>
    
    <main>
        <div id="notification-bar" class="hidden">
            <span id="update-msg"></span>
        </div>

        <div class="dashboard-controls">
            <h2>Live Synthetic Indices</h2>
            <p>Automatically detecting all platform updates...</p>
        </div>

        <div id="indices-grid" class="asset-grid">
            <div class="loader-box">
                <div class="spinner"></div>
                <p>Synchronizing with platform assets...</p>
            </div>
        </div>
    </main>

    <script src="app.js?v=1.02"></script>
</body>
</html>
