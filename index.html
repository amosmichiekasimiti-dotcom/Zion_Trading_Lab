<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Zion Trading Lab - AI Powered</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Arial;background:#0f172a;color:white;}
header{padding:15px;background:#111827;text-align:center;font-weight:bold;font-size:20px;border-bottom:1px solid #334155;}
.container{padding:10px;max-width:700px;margin:0 auto;}
.tabs{display:flex;overflow-x:auto;margin-bottom:15px;gap:5px;padding-bottom:5px;position:sticky;top:0;background:#0f172a;z-index:10;}
.tab{padding:12px 18px;background:#1e293b;border-radius:12px;cursor:pointer;white-space:nowrap;font-weight:500;transition:all 0.2s;}
.tab.active{background:#22c55e;color:#0f172a;font-weight:bold;}
.tab:hover{background:#334155;}
.section{display:none;}
.section.active{display:block;}

/* Timer */
.timer-component{font-size:14px;text-align:center;margin:5px 0;color:#22c55e;background:#1e293b;padding:5px;border-radius:8px;}

/* Inputs & Buttons */
input,button{padding:10px;margin-top:5px;border-radius:12px;border:none;font-size:14px;}
input{background:#1e293b;color:white;border:1px solid #334155;width:100%;}
button{background:#22c55e;font-weight:bold;cursor:pointer;transition:all 0.2s;}
button:hover{background:#16a34a;}
button.danger{background:#dc2626;}
button.danger:hover{background:#b91c1c;}

/* Signals */
.signal-container{min-height:80px;margin-top:10px;}
.signal-box{padding:15px;border-radius:12px;font-weight:bold;text-align:center;font-size:18px;transition:background-color 0.3s;}
.buy{background:#16a34a;color:white;}
.sell{background:#dc2626;color:white;}
.neutral{background:#475569;color:white;}

/* Stats */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
.stat-card{background:#1e293b;padding:10px;border-radius:8px;text-align:center;}
.stat-label{font-size:11px;color:#94a3b8;}
.stat-value{font-size:18px;font-weight:bold;}

/* Trade history */
.trade-history{background:#1e293b;border-radius:12px;padding:12px;margin-top:15px;max-height:200px;overflow-y:auto;}
.trade-item{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #334155;font-size:13px;}
.trade-profit{color:#22c55e;}
.trade-loss{color:#dc2626;}

/* Auto trade */
.auto-trade{display:flex;gap:5px;align-items:center;margin-top:10px;}
.auto-trade label{flex:1;}
.auto-trade input[type="number"]{width:80px;margin:0;}
.auto-trade button{width:auto;margin:0;}

/* Probability bar */
.probability-bar{height:6px;background:#334155;border-radius:3px;margin:10px 0;overflow:hidden;}
.probability-fill{height:100%;background:#22c55e;width:0%;transition:width 0.3s;}

/* Status */
.status-badge{padding:4px 8px;border-radius:20px;font-size:12px;background:#1e293b;display:inline-block;}
.connected{background:#22c55e;color:#0f172a;}
.disconnected{background:#dc2626;color:white;}
.ai-badge{background:#8b5cf6;color:white;padding:2px 8px;border-radius:12px;font-size:10px;margin-left:5px;}

/* Scrollable Market Buttons */
.market-scroll {
  display: flex;
  overflow-x: auto;
  gap: 8px;
  padding: 5px 0;
  margin-bottom: 10px;
  scrollbar-width: thin;
  scrollbar-color: #22c55e #1e293b;
}
.market-scroll::-webkit-scrollbar { height: 4px; }
.market-scroll::-webkit-scrollbar-track { background: #1e293b; }
.market-scroll::-webkit-scrollbar-thumb { background: #22c55e; border-radius: 4px; }
.market-scroll button { flex: 0 0 auto; padding: 8px 12px; border-radius: 12px; border: none; cursor: pointer; font-weight: 500; background: #1e293b; color: #f1f5f9; transition: all 0.2s; white-space: nowrap;}
.market-scroll button:hover {background: #334155;}
.market-scroll button.active {background:#22c55e;color:#0f172a;font-weight:bold;}

@media(max-width:480px){.tabs{font-size:13px;}.tab{padding:10px;}}
</style>
</head>
<body>

<header>⚡ ZION TRADING LAB - AI POWERED ⚡</header>
<div class="container">

<div style="display:flex;gap:10px;align-items:center;margin-bottom:10px;">
<input type="text" id="token" placeholder="Enter your Deriv API token" value="YOUR_DERIV_TOKEN">
<input type="text" id="gemini_key" placeholder="Gemini API Key" value="AIzaSyDM7cKxbQwB3X0ubb01Ie12WrFi8oEh2E">
<select id="app_id" style="width:100px;">
<option value="126973" selected>App 126973</option>
<option value="1089">App 1089</option>
</select>
</div>

<div style="display:flex;gap:5px;margin-bottom:15px;">
<button onclick="connectWS()">🔌 Connect</button>
<button onclick="disconnectWS()">⛔ Disconnect</button>
</div>

<div id="connectionStatus" class="status-badge disconnected" style="text-align:center;">🔴 Disconnected</div>

<!-- Stats -->
<div class="stats-grid">
<div class="stat-card"><span class="stat-label">Win Rate</span><div class="stat-value" id="winRate">0%</div></div>
<div class="stat-card"><span class="stat-label">Total Trades</span><div class="stat-value" id="totalTrades">0</div></div>
<div class="stat-card"><span class="stat-label">Balance</span><div class="stat-value" id="balance">$1000</div></div>
<div class="stat-card"><span class="stat-label">AI Confidence</span><div class="stat-value" id="aiConfidence">0%</div></div>
</div>

<!-- Tabs -->
<div class="tabs">
<div class="tab active" onclick="openTab('rise')">📈 Rise/Fall</div>
<div class="tab" onclick="openTab('evenodd')">🔢 Even/Odd</div>
<div class="tab" onclick="openTab('overunder')">🎯 Over/Under</div>
<div class="tab" onclick="openTab('matchdiff')">🎲 Match/Differ</div>
</div>

<!-- Sections: Rise, Even/Odd, Over/Under, Match/Differ (same as previous) -->

<!-- ... Keep your HTML structure for tabs and signals as in previous code ... -->

<!-- Trade History -->
<div class="trade-history" id="tradeHistory">
<div style="font-weight:bold;margin-bottom:8px;">📜 AI Trade History</div>
<div id="historyList">No trades yet</div>
</div>

</div>

<script>
// ========== CONFIGURATION ==========
const markets = {
  "Volatility 10 (1s)": "1HZ10V", "Volatility 10": "R_10",
  "Volatility 15 (1s)": "1HZ15V", "Volatility 25 (1s)": "1HZ25V", "Volatility 25": "R_25",
  "Volatility 30 (1s)": "1HZ30V", "Volatility 50 (1s)": "1HZ50V", "Volatility 50": "R_50",
  "Volatility 75 (1s)": "1HZ75V", "Volatility 75": "R_75", "Volatility 90 (1s)": "1HZ90V",
  "Volatility 100 (1s)": "1HZ100V", "Volatility 100": "R_100"
};
const marketsList = Object.keys(markets);

// ========== STATE ==========
let ws, tickHistory={}, lastSignal={}, autoTradeStates={rise:false, eo:false, ou:false, md:false}, timerValues={}, timerIntervals={}, activeMarkets={}, trades=[], balance=1000;

// ========== MARKET SCROLL INIT ==========
function populateMarketScroll(containerId, selectId, engineId){
  const container=document.getElementById(containerId);
  const selectEl=document.getElementById(selectId);
  container.innerHTML="";
  marketsList.forEach(name=>{
    const btn=document.createElement("button");
    btn.textContent=name;
    btn.onclick=()=>{container.querySelectorAll("button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");selectEl.value=markets[name];activeMarkets[engineId]=markets[name];loadChart(engineId+"Chart",markets[name]);};
    container.appendChild(btn);
  });
  if(container.children.length>0){container.children[0].classList.add("active");selectEl.value=markets[marketsList[0]];activeMarkets[engineId]=markets[marketsList[0]];loadChart(engineId+"Chart",markets[marketsList[0]]);}
}
["rise","eo","ou","md"].forEach(engine=>populateMarketScroll(engine+"MarketList",engine+((engine==="rise")?"Market":(engine==="eo")?"Market":(engine==="ou")?"Market":"Market"),engine));

// ========== TABS ==========
function openTab(tab){document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));event.target.classList.add("active");document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));document.getElementById(tab).classList.add("active");}
function loadChart(container,symbol){document.getElementById(container).innerHTML=`<iframe src="https://charts.deriv.com/deriv?symbol=${symbol}&theme=dark" style="width:100%;height:300px;border:none;border-radius:12px;"></iframe>`;}

// ========== WEBSOCKET ==========
function connectWS(){
  let token=document.getElementById("token").value.trim(),app_id=document.getElementById("app_id").value;
  if(!token){alert("Please enter your API token");return;}
  if(ws) ws.close();
  ws=new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${app_id}`);
  ws.onopen=()=>{document.getElementById("connectionStatus").innerHTML="🟢 Connected (AI Ready)";document.getElementById("connectionStatus").className="status-badge connected";ws.send(JSON.stringify({authorize:token}));};
  ws.onmessage=msg=>{
    let data=JSON.parse(msg.data);
    if(data.msg_type==='authorize'){
      for(let symbol of Object.values(markets)){ws.send(JSON.stringify({ticks:symbol,subscribe:1}));tickHistory[symbol]=[];lastSignal[symbol]="";}
      startTimers();
    }else if(data.tick){let sym=data.tick.symbol,price=parseFloat(data.tick.quote);if(!tickHistory[sym]) tickHistory[sym]=[];tickHistory[sym].push(price);if(tickHistory[sym].length>50) tickHistory[sym].shift();}
  };
  ws.onclose=()=>{document.getElementById("connectionStatus").innerHTML="🔴 Disconnected";document.getElementById("connectionStatus").className="status-badge disconnected";clearAllTimers();};
}
function disconnectWS(){if(ws) ws.close();clearAllTimers();}

// ========== 1-MINUTE STABLE SIGNALS ==========
function startTimers(){
  clearAllTimers();
  ["rise","eo","ou","md"].forEach(engine=>{
    timerValues[engine]=60;
    updateTimerDisplay(engine);
    timerIntervals[engine]=setInterval(()=>{
      timerValues[engine]--;
      updateTimerDisplay(engine);
      if(timerValues[engine]<=0){
        let symbol=activeMarkets[engine];
        if(symbol && tickHistory[symbol] && tickHistory[symbol].length>=20){
          runAIAnalysis(symbol,tickHistory[symbol].slice(-1)[0]);
        }
        timerValues[engine]=60;
      }
    },1000);
  });
}
function updateTimerDisplay(engine){const t=document.getElementById(engine+"Timer");if(t) t.innerHTML=`⏱️ Next AI analysis in: ${timerValues[engine]}s`;}
function clearAllTimers(){for(let k in timerIntervals) clearInterval(timerIntervals[k]);}

// ========== AI ANALYSIS & PREDICTION ==========
async function runAIAnalysis(symbol,price){for(let engine of ["rise","eo","ou","md"]){if(activeMarkets[engine]!==symbol) continue;let history=tickHistory[symbol];if(!history||history.length<20) continue;let prediction=await getAIPrediction(history,engine,{barrier:engine==="ou"?parseInt(document.getElementById("barrier").value):null,digit:engine==="md"?parseInt(document.getElementById("digitSelect").value):null});if(prediction) updateSignal(engine,symbol,prediction);}

// ... Keep getAIPrediction, fallbackPrediction, updateSignal, executeTrade, toggleAutoTrade, updateDashboard, displayTradeHistory as in your previous code ...

window.onload=function(){updateDashboard();};
</script>
</body>
</html>
