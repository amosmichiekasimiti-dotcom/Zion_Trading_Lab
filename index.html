<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>ZION AI Lab | Professional Trading Terminal</title>
<style>
:root { 
    --red: #ff444f; 
    --dark: #0a0a0f; 
    --green: #00ff88; 
    --gold: #ffd700; 
    --blue: #00f2fe; 
    --panel: #151520;
    --panel-light: #1e1e2a;
    --text-dim: #888;
    --text-bright: #fff;
    --success: #00ff88;
    --warning: #ffd700;
    --danger: #ff444f;
    --info: #00f2fe;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body { 
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; 
    background: var(--dark); 
    color: var(--text-bright); 
    margin: 0; 
    padding: 12px; 
    height: 100vh; 
    display: flex; 
    flex-direction: column; 
    overflow: hidden;
    position: relative;
}

/* Toast notification */
.toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel);
    border-left: 4px solid var(--blue);
    padding: 12px 24px;
    border-radius: 12px;
    color: white;
    z-index: 2000;
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    animation: slideUp 0.3s ease;
    pointer-events: none;
}

.toast.error { border-left-color: var(--red); }
.toast.success { border-left-color: var(--green); }

@keyframes slideUp {
    from { transform: translate(-50%, 100%); opacity: 0; }
    to { transform: translate(-50%, 0); opacity: 1; }
}

/* Loading spinner */
.loading-spinner {
    border: 3px solid rgba(255,255,255,0.1);
    border-top: 3px solid var(--blue);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
    margin: 20px auto;
}

@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: rgba(0,0,0,0.3);
    border-radius: 16px;
    margin-bottom: 12px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.05);
}

.logo {
    margin:0; 
    color: var(--gold); 
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--gold), #ffaa00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.status-badge {
    background: rgba(0,255,136,0.1);
    color: var(--green);
    padding: 6px 12px;
    border-radius: 30px;
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid rgba(0,255,136,0.2);
}

.status-badge::before {
    content: '';
    width: 8px;
    height: 8px;
    background: var(--green);
    border-radius: 50%;
    display: inline-block;
    animation: pulse 2s infinite;
}

@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } }

.nav-scroll { 
    display: flex; 
    gap: 8px; 
    overflow-x: auto; 
    padding: 4px 4px 12px 4px; 
    scrollbar-width: none; 
    -webkit-overflow-scrolling: touch;
}

.nav-btn { 
    background: var(--panel); 
    border: 1px solid #333; 
    color: var(--text-dim); 
    padding: 12px 20px; 
    border-radius: 30px; 
    font-size: 13px; 
    font-weight: 600; 
    cursor: pointer; 
    white-space: nowrap; 
    transition: all 0.2s ease; 
    letter-spacing: 0.3px;
    backdrop-filter: blur(10px);
}

.nav-btn:hover { background: #1e1e2a; border-color: #444; }
.nav-btn.active { 
    background: var(--blue); 
    color: var(--dark); 
    border-color: var(--blue);
    box-shadow: 0 0 20px rgba(0,242,254,0.3);
}

.table-container { 
    background: var(--panel); 
    border-radius: 20px; 
    flex-grow: 1; 
    overflow-y: auto; 
    border: 1px solid #222; 
    margin-top: 8px;
    backdrop-filter: blur(10px);
}

table { 
    width: 100%; 
    border-collapse: collapse; 
}

th { 
    position: sticky; 
    top: 0; 
    background: #1c1c2b; 
    padding: 16px; 
    text-align: left; 
    font-size: 12px; 
    color: #aaa; 
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    z-index: 10; 
}

td { 
    padding: 16px; 
    border-bottom: 1px solid #222; 
    font-size: 14px; 
    color: #fff;
}

.asset-type {
    color: var(--text-dim);
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
}

.btn-analyze { 
    background: rgba(0,242,254,0.1);
    color: var(--blue); 
    border: 1px solid rgba(0,242,254,0.3);
    padding: 8px 16px; 
    border-radius: 20px; 
    font-weight: 600; 
    font-size: 12px;
    cursor: pointer; 
    transition: all 0.2s ease;
}

.btn-analyze:hover {
    background: var(--blue);
    color: var(--dark);
    border-color: var(--blue);
}

#analysis-overlay { 
    display: none; 
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    background: var(--dark); 
    z-index: 1000; 
    padding: 16px; 
    box-sizing: border-box; 
    overflow-y: auto; 
}

.analysis-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    background: var(--panel);
    padding: 16px;
    border-radius: 16px;
    border: 1px solid #333;
}

.price-card { 
    background: linear-gradient(145deg, #151520, #1a1a25);
    padding: 20px; 
    border-radius: 24px; 
    text-align: center; 
    border: 1px solid rgba(0,242,254,0.3); 
    margin-bottom: 16px; 
    box-shadow: 0 10px 30px rgba(0,242,254,0.1);
}

#live-price { 
    font-size: 48px; 
    font-weight: 700; 
    font-family: 'JetBrains Mono', monospace;
    background: linear-gradient(135deg, #fff, #00f2fe);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.strategy-grid { 
    display: grid; 
    grid-template-columns: repeat(2, 1fr); 
    gap: 12px; 
    margin: 16px 0; 
}

.strat-card { 
    background: rgba(255,255,255,0.03); 
    padding: 16px; 
    border-radius: 16px; 
    border: 1px solid #333; 
    backdrop-filter: blur(10px);
    transition: transform 0.2s ease;
}

.strat-card:hover { transform: translateY(-2px); border-color: var(--blue); }

.strat-label { 
    font-size: 10px; 
    color: var(--text-dim); 
    text-transform: uppercase; 
    letter-spacing: 1px;
    margin-bottom: 8px; 
}

.strat-value { 
    font-weight: 700; 
    font-size: 18px; 
    font-family: 'JetBrains Mono', monospace;
}

.digit-panel {
    background: rgba(255,255,255,0.03);
    padding: 20px;
    border-radius: 24px;
    margin-bottom: 20px;
    border: 1px solid rgba(255,255,255,0.05);
    position: relative;
}

.digit-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.digit-title {
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
}

.tick-counter {
    background: var(--blue);
    color: var(--dark);
    padding: 4px 12px;
    border-radius: 30px;
    font-size: 11px;
    font-weight: 700;
}

.digit-circle-grid { 
    display: grid; 
    grid-template-columns: repeat(5, 1fr); 
    gap: 12px; 
    margin: 20px 0; 
    position: relative;
}

.digit-circle { 
    aspect-ratio: 1/1; 
    border-radius: 50%; 
    background: #1a1a24; 
    border: 2px solid #333; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
    position: relative; 
    cursor: pointer;
    backdrop-filter: blur(10px);
}

.digit-circle:hover { transform: scale(1.05); }

.digit-num { 
    font-size: 18px; 
    font-weight: 700; 
    color: white; 
}

.digit-pct { 
    font-size: 10px; 
    color: var(--text-dim); 
    margin-top: 2px; 
}

.digit-circle.hot { 
    background: linear-gradient(145deg, #00ff88, #00aa55); 
    border-color: #fff; 
    box-shadow: 0 0 20px rgba(0,255,136,0.3);
}

.digit-circle.hot .digit-num, 
.digit-circle.hot .digit-pct { color: #000; }

.digit-circle.cold { 
    background: linear-gradient(145deg, #ff444f, #aa2222); 
    border-color: #fff; 
    box-shadow: 0 0 20px rgba(255,68,79,0.3);
}

.digit-circle.cold .digit-num, 
.digit-circle.cold .digit-pct { color: #fff; }

.digit-circle.active { 
    border-color: var(--blue); 
    box-shadow: 0 0 30px var(--blue); 
    transform: scale(1.1);
    z-index: 2;
}

.digit-cursor { 
    position: absolute; 
    top: -15px; 
    width: 0; 
    height: 0; 
    border-left: 8px solid transparent; 
    border-right: 8px solid transparent; 
    border-bottom: 12px solid var(--red); 
    transition: left 0.3s ease; 
    filter: drop-shadow(0 0 10px var(--red));
    z-index: 3;
}

#chart-container { 
    height: 400px; 
    background: #000; 
    border-radius: 20px; 
    margin: 20px 0; 
    overflow: hidden; 
    border: 1px solid #333; 
}

.close-btn { 
    background: var(--panel); 
    color: var(--text-bright); 
    border: 1px solid #333;
    padding: 16px; 
    border-radius: 30px; 
    width: 100%; 
    font-weight: 600; 
    font-size: 14px;
    margin: 10px 0; 
    cursor: pointer; 
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.close-btn:hover { 
    background: var(--red); 
    border-color: var(--red);
    color: white;
}

/* Export button */
.export-btn {
    background: transparent;
    border: 1px solid #333;
    color: var(--text-dim);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.export-btn:hover {
    border-color: var(--green);
    color: var(--green);
}

/* Mobile optimizations */
@media (max-width: 480px) {
    body { padding: 8px; }
    .digit-circle-grid { gap: 6px; }
    .digit-num { font-size: 14px; }
    .digit-pct { font-size: 8px; }
    .strategy-grid { grid-template-columns: 1fr; }
    .price-card { padding: 16px; }
    #live-price { font-size: 36px; }
    .nav-btn { padding: 10px 16px; font-size: 12px; }
    th, td { padding: 12px; }
}

/* Keyboard shortcut hint */
.shortcut-hint {
    position: fixed;
    bottom: 10px;
    right: 10px;
    background: rgba(0,0,0,0.5);
    color: var(--text-dim);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 10px;
    backdrop-filter: blur(5px);
    z-index: 100;
}
</style>
</head>
<body>

<div class="header">
    <div class="logo">🤖 ZION PRO LAB</div>
    <div class="status-badge" id="status-text">● Live Data</div>
</div>

<div class="nav-scroll" id="nav-scroll">
    <button class="nav-btn active" data-filter="synthetic">🔥 VOLATILITY</button>
    <button class="nav-btn" data-filter="crashboom">📉 CRASH/BOOM</button>
    <button class="nav-btn" data-filter="step">📊 STEP/RANGE</button>
    <button class="nav-btn" data-filter="dex">⚡ DEX/DRIFT</button>
    <button class="nav-btn" data-filter="forex">💱 FOREX</button>
    <button class="nav-btn" data-filter="cryptocurrency">₿ CRYPTO</button>
</div>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Asset Name</th>
                <th>Type</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="market-list"></tbody>
    </table>
</div>

<!-- Analysis Overlay -->
<div id="analysis-overlay">
    <div class="analysis-header">
        <h3 id="target-name" style="margin:0;">Asset Analysis</h3>
        <span id="target-symbol" style="color:#666; font-family: monospace;">---</span>
        <button class="export-btn" onclick="exportData()" title="Export data">📤 Export</button>
    </div>

    <div class="price-card">
        <div id="live-price">00.00</div>
        <div style="font-size: 12px; color: #666; margin-top: 5px;" id="price-change">0.00 (0.00%)</div>
    </div>

    <div class="strategy-grid">
        <div class="strat-card">
            <div class="strat-label">Even / Odd</div>
            <div id="stat-even-odd" class="strat-value">---</div>
        </div>
        <div class="strat-card">
            <div class="strat-label">Over / Under</div>
            <div id="stat-over-under" class="strat-value">---</div>
        </div>
        <div class="strat-card">
            <div class="strat-label">Match Signal</div>
            <div id="stat-match-diff" class="strat-value">---</div>
        </div>
        <div class="strat-card">
            <div class="strat-label">Tick Trend</div>
            <div id="stat-rise-fall" class="strat-value">---</div>
        </div>
    </div>

    <div class="strategy-grid">
        <div class="strat-card">
            <div class="strat-label">Digit Pattern</div>
            <div id="stat-pattern" class="strat-value">---</div>
        </div>
        <div class="strat-card">
            <div class="strat-label">Consecutive</div>
            <div id="stat-consecutive" class="strat-value">---</div>
        </div>
    </div>

    <div class="digit-panel">
        <div class="digit-header">
            <div class="digit-title">Live Digit Distribution</div>
            <div class="tick-counter" id="tick-counter">0/1000</div>
        </div>
        <div class="digit-circle-grid" id="digit-circles"></div>
        <div class="digit-cursor" id="digit-cursor"></div>
    </div>

    <div id="chart-container">
        <div class="loading-spinner"></div>
    </div>
    
    <button class="close-btn" onclick="closeAnalysis()">⏻ Exit Terminal</button>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<!-- Keyboard shortcut hint -->
<div class="shortcut-hint">ESC: Close | Ctrl+F: Search</div>

<script>
// Configuration
const APP_ID = 126973;
const MAX_RECONNECT = 5;
const MAX_DIGITS = 1000;

// State
let ws = null;
let reconnectAttempts = 0;
let allSymbols = [];
let activeTickSubscription = null;
let digitHistory = [];
let priceHistory = [];
let currentSymbol = null;
let isAnalysisOpen = false;

// DOM Elements
const statusText = document.getElementById('status-text');
const toastContainer = document.getElementById('toast-container');
const analysisOverlay = document.getElementById('analysis-overlay');
const digitCircles = document.getElementById('digit-circles');
const cursor = document.getElementById('digit-cursor');
const marketList = document.getElementById('market-list');
const livePrice = document.getElementById('live-price');
const priceChange = document.getElementById('price-change');

// Initialize WebSocket
function initWebSocket() {
    ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);
    
    ws.onopen = () => {
        statusText.innerHTML = '● Live Data';
        statusText.style.color = 'var(--green)';
        reconnectAttempts = 0;
        ws.send(JSON.stringify({ active_symbols: "brief", product_type: "basic" }));
        showToast('Connected to market data', 'success');
        
        // Restore last session if available
        loadPreferences();
    };
    
    ws.onmessage = (msg) => {
        try {
            const data = JSON.parse(msg.data);
            if (data.active_symbols) { 
                allSymbols = data.active_symbols; 
                filterMarkets('synthetic'); 
            }
            if (data.history && data.history.prices) {
                digitHistory = data.history.prices.map(p => parseInt(Number(p).toFixed(2).slice(-1)));
                priceHistory = [...data.history.prices];
                updateDigitCircles();
                calculateStatistics();
            }
            if (data.tick) handleTick(data.tick);
            if (data.error) showToast(data.error.message, 'error');
        } catch (e) {
            console.error('Parse error:', e);
        }
    };
    
    ws.onclose = () => {
        statusText.innerHTML = '● Disconnected';
        statusText.style.color = 'var(--red)';
        
        if (reconnectAttempts < MAX_RECONNECT) {
            reconnectAttempts++;
            showToast(`Reconnecting... (${reconnectAttempts}/${MAX_RECONNECT})`, 'error');
            setTimeout(initWebSocket, 3000);
        } else {
            showToast('Connection failed. Please refresh.', 'error');
        }
    };
    
    ws.onerror = (error) => {
        console.error('WebSocket error:', error);
        showToast('Connection error', 'error');
    };
}

// Toast system
function showToast(message, type = 'info') {
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.textContent = message;
    toastContainer.appendChild(toast);
    
    setTimeout(() => {
        toast.remove();
    }, 3000);
}

// Market filtering
function filterMarkets(type, btn) {
    if (!allSymbols.length) return;
    
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    if (btn) {
        btn.classList.add('active');
    } else {
        document.querySelector(`[data-filter="${type}"]`).classList.add('active');
    }
    
    marketList.innerHTML = '';
    
    const filtered = allSymbols.filter(s => {
        if (type === 'synthetic') return s.market === 'synthetic_index' && !s.display_name.includes('Crash') && !s.display_name.includes('Boom');
        if (type === 'crashboom') return s.display_name.includes('Crash') || s.display_name.includes('Boom');
        return s.market === type;
    }).slice(0, 50); // Limit for performance
    
    filtered.forEach(s => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td style="font-weight: 500;">${s.display_name}</td>
            <td class="asset-type">${s.symbol}</td>
            <td><button class="btn-analyze" onclick="openAnalysis('${s.symbol}','${s.display_name.replace(/'/g, "\\'")}')">Analyze</button></td>
        `;
        marketList.appendChild(row);
    });
    
    savePreferences();
}

// Build digit UI
function buildDigitUI() {
    digitCircles.innerHTML = '';
    for (let i = 0; i <= 9; i++) {
        const circle = document.createElement('div');
        circle.id = `circle-${i}`;
        circle.className = 'digit-circle';
        circle.innerHTML = `
            <div class="digit-num">${i}</div>
            <div id="pct-${i}" class="digit-pct">0%</div>
        `;
        digitCircles.appendChild(circle);
    }
}

// Open analysis
function openAnalysis(symbol, name) {
    currentSymbol = symbol;
    isAnalysisOpen = true;
    
    document.getElementById('target-name').innerText = name;
    document.getElementById('target-symbol').innerText = symbol;
    analysisOverlay.style.display = 'block';
    
    // Initialize chart
    document.getElementById('chart-container').innerHTML = `<iframe src="https://tradingview.binary.com/v2/main.php?symbol=${symbol}&theme=dark" width="100%" height="100%" frameborder="0"></iframe>`;
    
    // Reset data
    digitHistory = [];
    priceHistory = [];
    buildDigitUI();
    
    // Subscribe to ticks
    ws.send(JSON.stringify({ ticks_history: symbol, adjust_start_time: 1, count: MAX_DIGITS, end: "latest", style: "ticks" }));
    
    if (activeTickSubscription) {
        ws.send(JSON.stringify({ forget: activeTickSubscription }));
    }
    
    ws.send(JSON.stringify({ ticks: symbol, subscribe: 1 }));
    
    savePreferences();
    showToast(`Analyzing ${name}`, 'success');
}

// Handle ticks
function handleTick(tick) {
    activeTickSubscription = tick.id;
    
    const pipSize = tick.pip_size || 2;
    const priceStr = Number(tick.quote).toFixed(pipSize);
    const lastDigit = parseInt(priceStr[priceStr.length - 1]);
    
    livePrice.innerText = priceStr;
    
    // Calculate price change
    if (priceHistory.length > 0) {
        const prevPrice = priceHistory[priceHistory.length - 1];
        const change = tick.quote - prevPrice;
        const changePercent = (change / prevPrice) * 100;
        priceChange.innerHTML = `${change > 0 ? '+' : ''}${change.toFixed(pipSize)} (${changePercent > 0 ? '+' : ''}${changePercent.toFixed(2)}%)`;
        priceChange.style.color = change >= 0 ? 'var(--green)' : 'var(--red)';
    }
    
    digitHistory.push(lastDigit);
    priceHistory.push(Number(tick.quote));
    
    if (digitHistory.length > MAX_DIGITS) digitHistory.shift();
    if (priceHistory.length > MAX_DIGITS) priceHistory.shift();
    
    updateDigitCircles();
    updateStrategyPanel(lastDigit, Number(tick.quote));
    calculateStatistics();
}

// Update digit circles
function updateDigitCircles() {
    const recentDigits = digitHistory.slice(-MAX_DIGITS);
    const counts = Array(10).fill(0);
    recentDigits.forEach(d => counts[d]++);
    
    const total = recentDigits.length;
    document.getElementById('tick-counter').innerText = `${total}/${MAX_DIGITS}`;
    
    // Calculate percentages
    const pctArr = counts.map(count => total > 0 ? (count / total * 100) : 0);
    
    // Find hot and cold
    const maxVal = Math.max(...counts);
    const minVal = Math.min(...counts.filter(c => c > 0));
    
    counts.forEach((count, i) => {
        const circle = document.getElementById(`circle-${i}`);
        const pctEl = document.getElementById(`pct-${i}`);
        
        if (pctEl) {
            pctEl.innerText = `${pctArr[i].toFixed(1)}%`;
        }
        
        circle.classList.remove('hot', 'cold', 'active');
        
        if (i === recentDigits[recentDigits.length - 1]) {
            circle.classList.add('active');
        }
        
        if (count === maxVal && count > 0) {
            circle.classList.add('hot');
        }
        
        if (count === minVal && count > 0 && minVal !== maxVal) {
            circle.classList.add('cold');
        }
    });
    
    // Update cursor position
    const lastDigit = recentDigits[recentDigits.length - 1];
    const targetCircle = document.getElementById(`circle-${lastDigit}`);
    
    if (targetCircle && digitCircles) {
        const rect = targetCircle.getBoundingClientRect();
        const parentRect = digitCircles.getBoundingClientRect();
        cursor.style.left = `${rect.left - parentRect.left + rect.width / 2 - 8}px`;
    }
}

// Update strategy panel
function updateStrategyPanel(digit, price) {
    const evOdEl = document.getElementById('stat-even-odd');
    const ovUnEl = document.getElementById('stat-over-under');
    const rfEl = document.getElementById('stat-rise-fall');
    
    evOdEl.innerText = digit % 2 === 0 ? "EVEN" : "ODD";
    evOdEl.style.color = digit % 2 === 0 ? 'var(--blue)' : 'var(--gold)';
    
    ovUnEl.innerText = digit > 4 ? "OVER" : "UNDER";
    ovUnEl.style.color = digit > 4 ? 'var(--green)' : 'var(--red)';
    
    const lastPrice = priceHistory[priceHistory.length - 2] || price;
    rfEl.innerText = price >= lastPrice ? "RISE" : "FALL";
    rfEl.style.color = price >= lastPrice ? 'var(--green)' : 'var(--red)';
    
    const counts = Array(10).fill(0);
    digitHistory.forEach(d => counts[d]++);
    const hotDigit = counts.indexOf(Math.max(...counts));
    document.getElementById('stat-match-diff').innerHTML = `HOT: ${hotDigit}`;
}

// Calculate advanced statistics
function calculateStatistics() {
    if (digitHistory.length < 10) return;
    
    const recent = digitHistory.slice(-50);
    const last = digitHistory[digitHistory.length - 1];
    const prev = digitHistory[digitHistory.length - 2];
    
    // Pattern detection
    let pattern = 'RANDOM';
    if (last === prev) pattern = 'DOUBLE';
    else if (Math.abs(last - prev) === 1) pattern = '±1 EDGE';
    else if (last > 7 && prev > 7) pattern = 'HIGH ZONE';
    else if (last < 3 && prev < 3) pattern = 'LOW ZONE';
    
    document.getElementById('stat-pattern').innerText = pattern;
    if (pattern !== 'RANDOM') {
        playAlert(pattern);
    }
    
    // Consecutive count
    let consecutive = 1;
    for (let i = digitHistory.length - 2; i >= 0; i--) {
        if (digitHistory[i] === last) consecutive++;
        else break;
    }
    
    document.getElementById('stat-consecutive').innerHTML = 
        `${consecutive}x <span style="color:#888;font-size:10px;">in a row</span>`;
    
    if (consecutive >= 3) {
        document.getElementById('stat-consecutive').style.color = 'var(--warning)';
    }
}

// Play alert sound
function playAlert(pattern) {
    // Create subtle vibration for mobile
    if (navigator.vibrate) {
        navigator.vibrate(50);
    }
}

// Export data
function exportData() {
    if (!currentSymbol || digitHistory.length === 0) {
        showToast('No data to export', 'error');
        return;
    }
    
    const data = {
        symbol: currentSymbol,
        name: document.getElementById('target-name').innerText,
        digits: digitHistory,
        prices: priceHistory,
        statistics: {
            distribution: Array(10).fill(0).map((_, i) => ({
                digit: i,
                count: digitHistory.filter(d => d === i).length,
                percentage: (digitHistory.filter(d => d === i).length / digitHistory.length * 100).toFixed(1)
            })),
            timestamp: new Date().toISOString()
        }
    };
    
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `zion_${currentSymbol}_${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    
    showToast('Data exported successfully', 'success');
}

// Close analysis
function closeAnalysis() {
    analysisOverlay.style.display = 'none';
    isAnalysisOpen = false;
    
    if (activeTickSubscription) {
        ws.send(JSON.stringify({ forget: activeTickSubscription }));
        activeTickSubscription = null;
    }
    
    showToast('Analysis closed', 'info');
}

// Save preferences
function savePreferences() {
    const activeFilter = document.querySelector('.nav-btn.active')?.getAttribute('data-filter');
    const prefs = {
        lastSymbol: currentSymbol,
        filterType: activeFilter,
        timestamp: Date.now()
    };
    
    try {
        localStorage.setItem('zion_prefs', JSON.stringify(prefs));
    } catch (e) {
        console.error('Failed to save preferences:', e);
    }
}

// Load preferences
function loadPreferences() {
    try {
        const saved = localStorage.getItem('zion_prefs');
        if (saved) {
            const prefs = JSON.parse(saved);
            
            // Apply saved filter
            if (prefs.filterType) {
                const btn = document.querySelector(`[data-filter="${prefs.filterType}"]`);
                if (btn) filterMarkets(prefs.filterType, btn);
            }
            
            // Auto-reconnect if less than 1 hour old
            if (prefs.lastSymbol && prefs.timestamp && (Date.now() - prefs.timestamp) < 3600000) {
                setTimeout(() => {
                    openAnalysis(prefs.lastSymbol, 'Last Session');
                }, 2000);
            }
        }
    } catch (e) {
        console.error('Failed to load preferences:', e);
    }
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && isAnalysisOpen) {
        closeAnalysis();
    }
    
    if (e.ctrlKey && e.key === 'f') {
        e.preventDefault();
        document.getElementById('nav-scroll').scrollIntoView({ behavior: 'smooth' });
    }
    
    if (e.ctrlKey && e.key === 'e' && isAnalysisOpen) {
        e.preventDefault();
        exportData();
    }
});

// Debounce function for performance
function debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
        const later = () => {
            clearTimeout(timeout);
            func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
    };
}

// Add click handlers to nav buttons
document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
        filterMarkets(btn.getAttribute('data-filter'), btn);
    });
});

// Initialize
initWebSocket();
buildDigitUI();

// Handle visibility change
document.addEventListener('visibilitychange', () => {
    if (document.hidden && activeTickSubscription) {
        ws.send(JSON.stringify({ forget: activeTickSubscription }));
    }
});

// Clean up on page unload
window.addEventListener('beforeunload', () => {
    if (activeTickSubscription) {
        ws.send(JSON.stringify({ forget: activeTickSubscription }));
    }
});
