<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ZION TRADING LAB - AI POWERED</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0f172a;color:#e2e8f0;}
.container{max-width:1400px;margin:0 auto;padding:15px;}

/* Header */
.header{background:#111827;padding:15px 20px;border-radius:12px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;}
.logo{font-size:22px;font-weight:bold;color:white;}
.logo span{color:#22c55e;}
.auth-buttons{display:flex;gap:10px;}
.auth-btn{padding:8px 20px;border-radius:8px;border:none;cursor:pointer;font-weight:500;}
.login{background:transparent;border:1px solid #22c55e;color:#22c55e;}
.signup{background:#22c55e;color:#0f172a;}

/* Token Row */
.token-row{display:flex;gap:10px;margin-bottom:20px;align-items:center;flex-wrap:wrap;background:#111827;padding:15px;border-radius:12px;}
.token-input{flex:2;min-width:250px;background:#1e293b;border:1px solid #334155;border-radius:12px;padding:12px 15px;color:white;font-family:monospace;}
.app-select{width:120px;background:#1e293b;border:1px solid #334155;border-radius:12px;padding:12px;color:white;}
.connect-btn{background:#22c55e;color:#0f172a;border:none;border-radius:12px;padding:12px 25px;font-weight:600;cursor:pointer;}
.disconnect-btn{background:#dc2626;color:white;border:none;border-radius:12px;padding:12px 25px;font-weight:600;cursor:pointer;}

/* Connection Status */
.status-bar{background:#1e293b;border-radius:12px;padding:12px 20px;margin-bottom:20px;display:flex;align-items:center;gap:10px;}
.status-dot{width:10px;height:10px;border-radius:50%;background:#22c55e;display:inline-block;}
.status-text{color:#22c55e;font-weight:500;}

/* Stats Grid */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:25px;}
.stat-card{background:#111827;border-radius:16px;padding:20px;border:1px solid #1e293b;}
.stat-label{font-size:14px;color:#94a3b8;margin-bottom:8px;}
.stat-value{font-size:28px;font-weight:bold;color:white;}
.stat-value small{font-size:14px;color:#64748b;margin-left:5px;}

/* Tabs */
.tabs{display:flex;gap:10px;margin-bottom:20px;background:#111827;padding:10px;border-radius:16px;overflow-x:auto;}
.tab{padding:12px 25px;border-radius:12px;cursor:pointer;font-weight:500;transition:all 0.2s;white-space:nowrap;}
.tab:hover{background:#1e293b;}
.tab.active{background:#22c55e;color:#0f172a;font-weight:600;}

/* Market Scroll */
.market-scroll{display:flex;overflow-x:auto;gap:8px;padding:10px 0;margin-bottom:15px;}
.market-btn{flex:0 0 auto;padding:8px 16px;background:#1e293b;border:none;border-radius:20px;color:#94a3b8;cursor:pointer;font-size:13px;}
.market-btn.active{background:#22c55e;color:#0f172a;font-weight:500;}

/* Main Content Grid */
.main-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:20px;}
@media(max-width:768px){.main-grid{grid-template-columns:1fr;}}

/* Chart Container */
.chart-container{background:#111827;border-radius:16px;padding:20px;border:1px solid #1e293b;}
.chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;}
.chart-title{font-size:18px;font-weight:600;}
.chart-price{font-size:32px;font-weight:bold;color:#22c55e;}
.chart-change{font-size:14px;color:#94a3b8;}
.chart-time{display:flex;gap:10px;margin:15px 0;}
.time-btn{padding:6px 12px;background:#1e293b;border:none;border-radius:6px;color:#94a3b8;cursor:pointer;font-size:12px;}
.time-btn.active{background:#22c55e;color:#0f172a;}
.chart-canvas{width:100%;height:300px;background:#0f172a;border-radius:12px;margin:15px 0;position:relative;}

/* Candlestick Chart */
.candlestick-chart{display:flex;align-items:flex-end;height:250px;gap:2px;margin:20px 0;}
.candle{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;}
.candle-body{width:80%;background:#22c55e;min-height:2px;border-radius:2px;}
.candle-body.red{background:#dc2626;}
.candle-wick{width:2px;background:#94a3b8;height:100%;position:absolute;top:0;}

/* Digit Distribution */
.digit-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:20px 0;}
.digit-card{background:#1e293b;border-radius:12px;padding:12px;text-align:center;}
.digit-number{font-size:20px;font-weight:bold;color:#22c55e;}
.digit-percent{font-size:14px;color:#94a3b8;margin-top:5px;}
.digit-bar{height:4px;background:#22c55e;border-radius:2px;margin-top:8px;}

/* Trade Panel */
.trade-panel{background:#111827;border-radius:16px;padding:20px;border:1px solid #1e293b;}
.trade-header{font-size:18px;font-weight:600;margin-bottom:20px;}
.price-large{font-size:48px;font-weight:bold;color:white;margin-bottom:5px;}
.price-label{color:#94a3b8;font-size:14px;margin-bottom:20px;}
.prediction-title{color:#94a3b8;font-size:14px;margin-bottom:10px;}
.digit-row{display:flex;justify-content:space-between;margin-bottom:15px;gap:5px;}
.digit-pill{flex:1;background:#1e293b;border-radius:8px;padding:8px;text-align:center;}
.digit-pill .digit{font-size:16px;font-weight:bold;color:white;}
.digit-pill .percent{font-size:12px;color:#22c55e;}

/* Trade Controls */
.trade-controls{background:#1e293b;border-radius:12px;padding:15px;margin:20px 0;}
.control-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;}
.control-label{color:#94a3b8;}
.control-value{font-weight:600;}
.duration-select{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:8px;color:white;width:100px;}
.stake-input{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:8px;color:white;width:100px;}

/* Payout Cards */
.payout-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:20px 0;}
.payout-card{background:#1e293b;border-radius:12px;padding:15px;text-align:center;}
.payout-label{color:#94a3b8;font-size:13px;margin-bottom:5px;}
.payout-amount{font-size:24px;font-weight:bold;}
.payout-amount.green{color:#22c55e;}
.payout-amount.red{color:#dc2626;}

/* Signal Box */
.signal-box{background:#1e293b;border-radius:12px;padding:20px;text-align:center;margin:15px 0;}
.signal-badge{display:inline-block;padding:4px 12px;background:#22c55e;color:#0f172a;border-radius:20px;font-size:12px;margin-bottom:10px;}
.signal-text{font-size:24px;font-weight:bold;margin:10px 0;}
.signal-confidence{color:#94a3b8;font-size:14px;}

/* Timer */
.timer{text-align:center;color:#22c55e;font-size:14px;margin:10px 0;}

/* Probability Bar */
.prob-bar{height:6px;background:#1e293b;border-radius:3px;margin:15px 0;overflow:hidden;}
.prob-fill{height:100%;background:#22c55e;width:0%;transition:width 0.3s;}

/* Trade History */
.trade-history{background:#111827;border-radius:16px;padding:20px;margin-top:20px;}
.history-item{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #1e293b;}
.history-item:last-child{border-bottom:none;}
.history-win{color:#22c55e;}
.history-loss{color:#dc2626;}

/* Risk Warning */
.risk-warning{background:#dc262610;border:1px solid #dc2626;border-radius:8px;padding:10px;font-size:12px;color:#94a3b8;text-align:center;margin-top:20px;}
</style>
</head>

// Switch tab function
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  currentTab = tab;
  renderTabContent();
}

// Render tab content based on active tab
function renderTabContent() {
  const content = document.getElementById('tabContent');
  
  switch(currentTab) {
    case 'rise':
      content.innerHTML = renderRiseFall();
      break;
    case 'evenodd':
      content.innerHTML = renderEvenOdd();
      break;
    case 'overunder':
      content.innerHTML = renderOverUnder();
      break;
    case 'matchdiff':
      content.innerHTML = renderMatchDiff();
      break;
  }
  
  // Initialize market scroll for this tab
  initMarketScroll(currentTab);
}

// Helper functions to generate chart elements
function generateCandlesticks() {
  let candles = '';
  for(let i = 0; i < 20; i++) {
    let height = Math.random() * 100 + 50;
    let isGreen = Math.random() > 0.5;
    candles += `
      <div class="candle" style="height:${height}px;">
        <div class="candle-wick" style="height:${height}px;"></div>
        <div class="candle-body ${isGreen ? '' : 'red'}" style="height:${height * 0.7}px;"></div>
      </div>
    `;
  }
  return candles;
}

function generateDigitDistribution() {
  let digits = '';
  const percents = [10.2, 9, 9.3, 11.1, 10.3, 9.1, 9.8, 11.2, 9.8, 10.2];
  for(let i = 0; i < 10; i++) {
    digits += `
      <div class="digit-card">
        <div class="digit-number">${i}</div>
        <div class="digit-percent">${percents[i]}%</div>
        <div class="digit-bar" style="width:${percents[i] * 10}%"></div>
      </div>
    `;
  }
  return digits;
}

function generateDigitPills() {
  let pills = '';
  const percents = [9.6, 10, 11, 8.4, 10.2, 11.6, 9.5, 10.5, 9.2, 10];
  for(let i = 0; i < 10; i++) {
    pills += `
      <div class="digit-pill">
        <div class="digit">${i}</div>
        <div class="percent">${percents[i]}%</div>
      </div>
    `;
  }
  return pills;
}

function generateMiniChart() {
  let bars = '';
  for(let i = 0; i < 20; i++) {
    let height = Math.random() * 100 + 20;
    bars += `<div style="flex:1;background:#22c55e;height:${height}px;border-radius:2px 2px 0 0;"></div>`;
  }
  return bars;
}

function generatePriceLine() {
  let points = '';
  let y = 50;
  for(let i = 0; i < 20; i++) {
    y += (Math.random() - 0.5) * 10;
    y = Math.max(10, Math.min(90, y));
    points += `${i*5}% ${y}% `;
  }
  return `<svg width="100%" height="100%" style="position:absolute;">
    <polyline points="${points}" style="fill:none;stroke:#22c55e;stroke-width:2;" />
  </svg>`;
}

// Market scroll initialization
function initMarketScroll(tab) {
  const container = document.getElementById('marketScroll');
  if(!container) return;
  
  container.innerHTML = '';
  marketsList.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'market-btn';
    btn.textContent = name;
    btn.onclick = () => {
      document.querySelectorAll('.market-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeMarkets[tab] = markets[name];
      updateChart(tab, markets[name]);
    };
    container.appendChild(btn);
  });
  if(container.children.length > 0) {
    container.children[0].classList.add('active');
  }
}

// WebSocket functions
function connectWS() {
  document.getElementById('connectionStatus').innerHTML = 'Connected (AI Ready)';
  startTimers();
}

function disconnectWS() {
  document.getElementById('connectionStatus').innerHTML = 'Disconnected';
  clearAllTimers();
}

function startTimers() {
  clearAllTimers();
  ['rise', 'evenodd', 'overunder', 'matchdiff'].forEach(engine => {
    timerValues[engine] = 35;
    timerIntervals[engine] = setInterval(() => {
      timerValues[engine]--;
      if(timerValues[engine] < 0) timerValues[engine] = 35;
      if(engine === currentTab) {
        document.getElementById('timer').innerHTML = `🔒 Next AI analysis in: ${timerValues[engine]}s`;
      }
    }, 1000);
  });
}

function clearAllTimers() {
  for(let key in timerIntervals) {
    clearInterval(timerIntervals[key]);
  }
}

// Execute trade
function executeTrade(type) {
  const stake = document.getElementById('stake')?.value || 10;
  const confidence = Math.floor(Math.random() * 30) + 60; // 60-90%
  
  const win = Math.random() < 0.6; // 60% win rate for demo
  const payout = stake * 0.95;
  
  const trade = {
    time: new Date().toLocaleTimeString(),
    type: type,
    stake: stake,
    result: win ? 'WIN' : 'LOSS',
    profit: win ? payout : -stake,
    confidence: confidence
  };
  
  trades.unshift(trade);
  if(trades.length > 10) trades.pop();
  
  balance = win ? balance + payout : balance - stake;
  updateDashboard();
  updateTradeHistory();
}

function updateDashboard() {
  const wins = trades.filter(t => t.result === 'WIN').length;
  const total = trades.length;
  document.getElementById('winRate').innerHTML = total ? Math.round((wins/total)*100) + '%' : '0%';
  document.getElementById('totalTrades').innerHTML = total;
  document.getElementById('balance').innerHTML = '$' + balance.toFixed(2);
}

function updateTradeHistory() {
  const list = document.getElementById('historyList');
  if(trades.length === 0) {
    list.innerHTML = '<div class="history-item"><span>No trades yet</span></div>';
    return;
  }
  
  list.innerHTML = trades.map(t => `
    <div class="history-item">
      <span>${t.time} - ${t.type} (${t.confidence}% AI)</span>
      <span class="${t.result === 'WIN' ? 'history-win' : 'history-loss'}">
        ${t.result === 'WIN' ? '+' : '-'}$${Math.abs(t.profit)}
      </span>
    </div>
  `).join('');
}

// Initialize
window.onload = function() {
  renderTabContent();
  updateDashboard();
};
