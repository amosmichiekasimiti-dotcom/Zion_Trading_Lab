<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deriv Pro Trading Terminal</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #151a25;
            --bg-tertiary: #1e2530;
            --accent-green: #00d084;
            --accent-red: #ff4757;
            --accent-blue: #3498db;
            --accent-purple: #9b59b6;
            --text-primary: #ffffff;
            --text-secondary: #8892a0;
            --border-color: #2a3441;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        .app-container {
            display: grid;
            grid-template-columns: 250px 1fr 300px;
            grid-template-rows: 60px 1fr 250px;
            height: 100vh;
            gap: 1px;
            background: var(--border-color);
        }

        /* Header */
        .header {
            grid-column: 1 / -1;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-red);
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: var(--accent-green);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .balance-display {
            font-size: 20px;
            font-weight: 600;
            color: var(--accent-green);
        }

        /* Sidebar - Markets */
        .markets-panel {
            background: var(--bg-secondary);
            overflow-y: auto;
            padding: 15px;
        }

        .panel-title {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .market-category {
            margin-bottom: 20px;
        }

        .category-title {
            font-size: 11px;
            color: var(--accent-blue);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .symbol-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 4px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
        }

        .symbol-item:hover {
            background: var(--bg-tertiary);
        }

        .symbol-item.active {
            background: rgba(52, 152, 219, 0.15);
            border-left: 3px solid var(--accent-blue);
        }

        .symbol-name {
            font-weight: 500;
        }

        .symbol-price {
            font-family: 'Courier New', monospace;
            font-weight: 600;
        }

        .price-up { color: var(--accent-green); }
        .price-down { color: var(--accent-red); }

        /* Main Chart Area */
        .chart-container {
            background: var(--bg-primary);
            position: relative;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .current-symbol {
            font-size: 24px;
            font-weight: 700;
        }

        .current-price {
            font-size: 32px;
            font-family: 'Courier New', monospace;
            font-weight: 700;
            transition: color 0.3s;
        }

        .chart-wrapper {
            flex: 1;
            position: relative;
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid var(--border-color);
        }

        /* Right Panel - Trading */
        .trading-panel {
            background: var(--bg-secondary);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .trade-form {
            background: var(--bg-tertiary);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .duration-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        .duration-btn {
            padding: 8px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .duration-btn:hover, .duration-btn.active {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }

        .trade-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-trade {
            padding: 15px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .btn-call {
            background: linear-gradient(135deg, #00d084, #00b894);
            color: white;
        }

        .btn_put {
            background: linear-gradient(135deg, #ff4757, #ee5a6f);
            color: white;
        }

        .btn-trade:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .payout-display {
            text-align: center;
            padding: 15px;
            background: rgba(0, 208, 132, 0.1);
            border-radius: 6px;
            margin-top: 15px;
        }

        .payout-label {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .payout-value {
            font-size: 24px;
            color: var(--accent-green);
            font-weight: 700;
        }

        /* Bottom Panel */
        .bottom-panel {
            grid-column: 1 / -1;
            background: var(--bg-secondary);
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1px;
            background: var(--border-color);
        }

        .panel-section {
            background: var(--bg-secondary);
            padding: 15px;
            overflow-y: auto;
        }

        .positions-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .position-item {
            background: var(--bg-tertiary);
            padding: 12px;
            border-radius: 6px;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr auto;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            border-left: 3px solid transparent;
        }

        .position-item.call {
            border-left-color: var(--accent-green);
        }

        .position-item.put {
            border-left-color: var(--accent-red);
        }

        .digit-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            margin-top: 10px;
        }

        .digit-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-tertiary);
            border-radius: 4px;
            font-weight: 700;
            font-size: 14px;
            position: relative;
            overflow: hidden;
        }

        .digit-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--accent-blue);
            opacity: 0.3;
            transition: height 0.3s;
        }

        .last-digit {
            color: var(--accent-purple);
            font-size: 48px;
            font-weight: 700;
            text-align: center;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
        }

        .tick-history {
            display: flex;
            gap: 4px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .tick-item {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-tertiary);
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 14, 26, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 20px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="loading-overlay" id="loadingScreen">
    <div class="loading-spinner"></div>
    <div class="loading-text">Connecting to Deriv...</div>
</div>

<div class="app-container">
    <!-- Header -->
    <header class="header">
        <div class="logo">⚡ Deriv Pro</div>
        <div class="connection-status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Connecting...</span>
        </div>
        <div class="balance-display" id="balanceDisplay">$0.00</div>
    </header>

    <!-- Markets Sidebar -->
    <aside class="markets-panel">
        <div class="panel-title">Markets</div>
        <div id="marketsList"></div>
    </aside>

    <!-- Main Chart -->
    <main class="chart-container">
        <div class="chart-header">
            <div>
                <div class="current-symbol" id="currentSymbol">R_100</div>
                <div style="color: var(--text-secondary); font-size: 12px;">Volatility Index</div>
            </div>
            <div class="current-price" id="currentPrice">---</div>
        </div>
        <div class="chart-wrapper">
            <canvas id="mainChart"></canvas>
        </div>
    </main>

    <!-- Trading Panel -->
    <aside class="trading-panel">
        <div class="panel-title">Trade</div>
        
        <div class="trade-form">
            <div class="form-group">
                <label class="form-label">Stake (USD)</label>
                <input type="number" class="form-input" id="stakeInput" value="10" min="1" step="1">
            </div>

            <div class="form-group">
                <label class="form-label">Duration</label>
                <div class="duration-buttons">
                    <button class="duration-btn active" data-value="5" data-unit="t">5 Ticks</button>
                    <button class="duration-btn" data-value="10" data-unit="t">10 Ticks</button>
                    <button class="duration-btn" data-value="15" data-unit="t">15 Ticks</button>
                    <button class="duration-btn" data-value="1" data-unit="m">1 Min</button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Contract Type</label>
                <select class="form-select" id="contractType">
                    <option value="CALL">Rise</option>
                    <option value="PUT">Fall</option>
                    <option value="DIGITMATCH">Digit Match</option>
                    <option value="DIGITDIFF">Digit Differs</option>
                    <option value="DIGITOVER">Digit Over</option>
                    <option value="DIGITUNDER">Digit Under</option>
                </select>
            </div>

            <div class="form-group" id="digitSelection" style="display: none;">
                <label class="form-label">Last Digit Prediction</label>
                <input type="number" class="form-input" id="digitInput" min="0" max="9" value="5">
            </div>

            <div class="payout-display">
                <div class="payout-label">Potential Payout</div>
                <div class="payout-value" id="payoutValue">$0.00</div>
            </div>

            <div class="trade-buttons">
                <button class="btn-trade btn_call" id="btnCall">Rise</button>
                <button class="btn-trade btn_put" id="btnPut">Fall</button>
            </div>
        </div>
    </aside>

    <!-- Bottom Panels -->
    <div class="bottom-panel">
        <!-- Open Positions -->
        <div class="panel-section">
            <div class="panel-title">Open Positions</div>
            <div class="positions-list" id="positionsList">
                <div style="color: var(--text-secondary); text-align: center; padding: 20px;">No open positions</div>
            </div>
        </div>

        <!-- Digit Analysis -->
        <div class="panel-section">
            <div class="panel-title">Digit Analysis</div>
            <div class="last-digit" id="lastDigit">-</div>
            <div class="digit-grid" id="digitGrid"></div>
            <div class="tick-history" id="tickHistory"></div>
        </div>

        <!-- Recent Trades -->
        <div class="panel-section">
            <div class="panel-title">Trade History</div>
            <div class="positions-list" id="historyList">
                <div style="color: var(--text-secondary); text-align: center; padding: 20px;">No recent trades</div>
            </div>
        </div>
    </div>
</div>

<script>
    // Enhanced WebSocket Implementation
    const APP_ID = 1089;
    const WS_URL = `wss://ws.binaryws.com/websockets/v3?app_id=${APP_ID}`;
    
    class DerivTradingTerminal {
        constructor() {
            this.ws = null;
            this.reconnectAttempts = 0;
            this.maxReconnectAttempts = 5;
            this.reconnectDelay = 3000;
            
            this.marketData = {
                activeSymbols: [],
                ticks: {},
                history: {},
                digitAnalysis: {},
                priceHistory: {},
                openContracts: [],
                portfolio: {},
                balance: null,
                time: null
            };

            this.currentSymbol = 'R_100';
            this.chart = null;
            this.priceChartData = [];
            this.tickCount = 0;
            
            this.init();
        }

        init() {
            this.connect();
            this.initChart();
            this.initDigitGrid();
            this.setupEventListeners();
        }

        connect() {
            this.ws = new WebSocket(WS_URL);

            this.ws.onopen = () => {
                console.log('Connected to Deriv');
                this.reconnectAttempts = 0;
                this.updateConnectionStatus(true);
                this.authorize();
            };

            this.ws.onmessage = (msg) => {
                const data = JSON.parse(msg.data);
                this.handleMessage(data);
            };

            this.ws.onclose = () => {
                this.updateConnectionStatus(false);
                this.attemptReconnect();
            };

            this.ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }

        attemptReconnect() {
            if (this.reconnectAttempts < this.maxReconnectAttempts) {
                this.reconnectAttempts++;
                console.log(`Reconnecting... Attempt ${this.reconnectAttempts}`);
                setTimeout(() => this.connect(), this.reconnectDelay);
            }
        }

        authorize() {
            // For demo purposes - in production, use real token
            this.send({ ping: 1 });
            this.send({ active_symbols: 'brief', product_type: 'basic' });
            this.send({ balance: 1, subscribe: 1 });
            this.send({ time: 1, subscribe: 1 });
            
            // Subscribe to default symbol
            this.subscribeToSymbol(this.currentSymbol);
        }

        send(data) {
            if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                this.ws.send(JSON.stringify(data));
            }
        }

        handleMessage(data) {
            switch(data.msg_type) {
                case 'active_symbols':
                    this.handleActiveSymbols(data.active_symbols);
                    break;
                case 'tick':
                    this.handleTick(data.tick);
                    break;
                case 'history':
                    this.handleHistory(data.history);
                    break;
                case 'balance':
                    this.handleBalance(data.balance);
                    break;
                case 'portfolio':
                    this.handlePortfolio(data.portfolio);
                    break;
                case 'proposal':
                    this.handleProposal(data.proposal);
                    break;
                case 'buy':
                    this.handleBuyResponse(data.buy);
                    break;
                case 'proposal_open_contract':
                    this.handleOpenContract(data.proposal_open_contract);
                    break;
                case 'time':
                    this.marketData.time = data.time;
                    break;
            }
        }

        handleActiveSymbols(symbols) {
            this.marketData.activeSymbols = symbols;
            this.renderMarkets(symbols);
            document.getElementById('loadingScreen').classList.add('hidden');
        }

        handleTick(tick) {
            const symbol = tick.symbol;
            this.marketData.ticks[symbol] = tick;
            
            if (symbol === this.currentSymbol) {
                this.updatePriceDisplay(tick.quote);
                this.updateChart(tick);
                this.updateDigitAnalysis(tick.quote);
            }
        }

        handleHistory(history) {
            const prices = history.prices;
            this.priceChartData = prices.map((price, index) => ({
                x: Date.now() - (prices.length - index) * 1000,
                y: price
            }));
            this.updateChartData();
        }

        handleBalance(balance) {
            this.marketData.balance = balance.balance;
            document.getElementById('balanceDisplay').textContent = 
                `$${parseFloat(balance.balance).toFixed(2)}`;
        }

        handlePortfolio(portfolio) {
            this.marketData.portfolio = portfolio;
            this.renderPositions(portfolio.contracts);
        }

        handleProposal(proposal) {
            if (proposal.id) {
                document.getElementById('payoutValue').textContent = 
                    `$${parseFloat(proposal.payout).toFixed(2)}`;
                this.currentProposal = proposal;
            }
        }

        handleBuyResponse(buy) {
            console.log('Trade executed:', buy);
            this.addToHistory(buy);
            this.send({ portfolio: 1 });
        }

        handleOpenContract(contract) {
            const index = this.marketData.openContracts.findIndex(c => c.id === contract.contract_id);
            if (index >= 0) {
                this.marketData.openContracts[index] = contract;
            } else {
                this.marketData.openContracts.push(contract);
            }
            this.renderPositions(this.marketData.openContracts);
        }

        subscribeToSymbol(symbol) {
            this.send({ ticks: symbol, subscribe: 1 });
            this.send({ history: symbol, count: 100, subscribe: 1 });
            this.currentSymbol = symbol;
            document.getElementById('currentSymbol').textContent = symbol;
            
            // Reset digit analysis
            this.marketData.digitAnalysis[symbol] = Array(10).fill(0);
            this.tickCount = 0;
        }

        updatePriceDisplay(price) {
            const priceEl = document.getElementById('currentPrice');
            const oldPrice = parseFloat(priceEl.textContent) || 0;
            priceEl.textContent = price.toFixed(2);
            
            if (price > oldPrice) {
                priceEl.className = 'current-price price-up';
            } else if (price < oldPrice) {
                priceEl.className = 'current-price price-down';
            }
        }

        updateDigitAnalysis(price) {
            const lastDigit = parseInt(price.toFixed(2).slice(-1));
            document.getElementById('lastDigit').textContent = lastDigit;
            
            if (!this.marketData.digitAnalysis[this.currentSymbol]) {
                this.marketData.digitAnalysis[this.currentSymbol] = Array(10).fill(0);
            }
            
            this.marketData.digitAnalysis[this.currentSymbol][lastDigit]++;
            this.tickCount++;
            
            this.updateDigitGrid();
            this.addToTickHistory(lastDigit);
        }

        initDigitGrid() {
            const grid = document.getElementById('digitGrid');
            for (let i = 0; i < 10; i++) {
                const cell = document.createElement('div');
                cell.className = 'digit-cell';
                cell.innerHTML = `
                    <div class="digit-bar" style="height: 0%"></div>
                    <span>${i}</span>
                `;
                grid.appendChild(cell);
            }
        }

        updateDigitGrid() {
            const stats = this.marketData.digitAnalysis[this.currentSymbol] || Array(10).fill(0);
            const max = Math.max(...stats, 1);
            const cells = document.querySelectorAll('.digit-cell');
            
            cells.forEach((cell, index) => {
                const percentage = (stats[index] / max) * 100;
                cell.querySelector('.digit-bar').style.height = `${percentage}%`;
                cell.style.opacity = stats[index] > 0 ? 1 : 0.5;
            });
        }

        addToTickHistory(digit) {
            const history = document.getElementById('tickHistory');
            const item = document.createElement('div');
            item.className = 'tick-item';
            item.textContent = digit;
            item.style.color = digit >= 5 ? 'var(--accent-green)' : 'var(--accent-red)';
            
            history.insertBefore(item, history.firstChild);
            if (history.children.length > 20) {
                history.removeChild(history.lastChild);
            }
        }

        initChart() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            this.chart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: 'Price',
                        data: [],
                        borderColor: '#3498db',
                        backgroundColor: 'rgba(52, 152, 219, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0,
                        pointHoverRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(21, 26, 37, 0.9)',
                            titleColor: '#fff',
                            bodyColor: '#fff',
                            borderColor: '#2a3441',
                            borderWidth: 1
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'second',
                                displayFormats: {
                                    second: 'HH:mm:ss'
                                }
                            },
                            grid: {
                                color: 'rgba(42, 52, 65, 0.5)'
                            },
                            ticks: {
                                color: '#8892a0'
                            }
                        },
                        y: {
                            position: 'right',
                            grid: {
                                color: 'rgba(42, 52, 65, 0.5)'
                            },
                            ticks: {
                                color: '#8892a0'
                            }
                        }
                    },
                    animation: {
                        duration: 0
                    }
                }
            });
        }

        updateChart(tick) {
            this.priceChartData.push({
                x: tick.epoch * 1000,
                y: tick.quote
            });
            
            if (this.priceChartData.length > 100) {
                this.priceChartData.shift();
            }
            
            this.updateChartData();
        }

        updateChartData() {
            if (this.chart) {
                this.chart.data.datasets[0].data = this.priceChartData;
                this.chart.update('none');
            }
        }

        renderMarkets(symbols) {
            const container = document.getElementById('marketsList');
            const categories = {};
            
            symbols.forEach(sym => {
                if (!categories[sym.market]) {
                    categories[sym.market] = [];
                }
                categories[sym.market].push(sym);
            });

            container.innerHTML = '';
            
            Object.entries(categories).forEach(([market, syms]) => {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'market-category';
                
                const title = document.createElement('div');
                title.className = 'category-title';
                title.textContent = market.replace(/_/g, ' ');
                categoryDiv.appendChild(title);
                
                syms.slice(0, 10).forEach(sym => {
                    const item = document.createElement('div');
                    item.className = 'symbol-item';
                    item.dataset.symbol = sym.symbol;
                    item.innerHTML = `
                        <span class="symbol-name">${sym.display_name}</span>
                        <span class="symbol-price" id="price-${sym.symbol}">--</span>
                    `;
                    item.onclick = () => this.selectSymbol(sym.symbol);
                    categoryDiv.appendChild(item);
                });
                
                container.appendChild(categoryDiv);
            });
            
            this.highlightActiveSymbol();
        }

        selectSymbol(symbol) {
            this.send({ forget_all: 'ticks' });
            this.subscribeToSymbol(symbol);
            this.highlightActiveSymbol();
            this.requestProposal();
        }

        highlightActiveSymbol() {
            document.querySelectorAll('.symbol-item').forEach(item => {
                item.classList.toggle('active', item.dataset.symbol === this.currentSymbol);
            });
        }

        renderPositions(contracts) {
            const container = document.getElementById('positionsList');
            
            if (!contracts || contracts.length === 0) {
                container.innerHTML = '<div style="color: var(--text-secondary); text-align: center; padding: 20px;">No open positions</div>';
                return;
            }
            
            container.innerHTML = '';
            contracts.forEach(contract => {
                const div = document.createElement('div');
                div.className = `position-item ${contract.contract_type === 'CALL' ? 'call' : 'put'}`;
                div.innerHTML = `
                    <div>
                        <div style="font-weight: 600;">${contract.display_name || contract.underlying}</div>
                        <div style="font-size: 11px; color: var(--text-secondary);">${contract.contract_type}</div>
                    </div>
                    <div style="text-align: right;">
                        <div>$${contract.buy_price}</div>
                        <div style="font-size: 11px; color: var(--text-secondary);">Stake</div>
                    </div>
                    <div style="text-align: right;">
                        <div style="color: ${contract.profit > 0 ? 'var(--accent-green)' : 'var(--accent-red)'}">
                            ${contract.profit > 0 ? '+' : ''}$${Math.abs(contract.profit || 0).toFixed(2)}
                        </div>
                        <div style="font-size: 11px; color: var(--text-secondary);">P/L</div>
                    </div>
                    <div style="text-align: right;">
                        <div>${contract.expiry_time ? new Date(contract.expiry_time * 1000).toLocaleTimeString() : '--'}</div>
                        <div style="font-size: 11px; color: var(--text-secondary);">Expiry</div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        addToHistory(trade) {
            const container = document.getElementById('historyList');
            if (container.children[0]?.textContent === 'No recent trades') {
                container.innerHTML = '';
            }
            
            const div = document.createElement('div');
            div.className = 'position-item';
            div.innerHTML = `
                <div>
                    <div style="font-weight: 600;">${this.currentSymbol}</div>
                    <div style="font-size: 11px; color: var(--text-secondary);">${new Date().toLocaleTimeString()}</div>
                </div>
                <div style="text-align: right;">
                    <div>$${trade.buy_price}</div>
                    <div style="font-size: 11px; color: var(--text-secondary);">Buy</div>
                </div>
                <div style="text-align: right;">
                    <div style="color: var(--accent-green)">$${trade.payout}</div>
                    <div style="font-size: 11px; color: var(--text-secondary);">Payout</div>
                </div>
                <div style="text-align: right;">
                    <div style="color: var(--accent-blue)">${trade.contract_id}</div>
                    <div style="font-size: 11px; color: var(--text-secondary);">ID</div>
                </div>
            `;
            container.insertBefore(div, container.firstChild);
        }

        requestProposal() {
            const stake = parseFloat(document.getElementById('stakeInput').value) || 10;
            const duration = parseInt(document.querySelector('.duration-btn.active')?.dataset.value) || 5;
            const durationUnit = document.querySelector('.duration-btn.active')?.dataset.unit || 't';
            const contractType = document.getElementById('contractType').value;
            
            const proposal = {
                proposal: 1,
                amount: stake,
                basis: 'stake',
                contract_type: contractType,
                currency: 'USD',
                duration: duration,
                duration_unit: durationUnit,
                symbol: this.currentSymbol
            };
            
            if (contractType.includes('DIGIT')) {
                proposal.barrier = document.getElementById('digitInput').value;
            }
            
            this.send(proposal);
        }

        executeTrade(contractType) {
            if (!this.currentProposal) return;
            
            this.send({
                buy: this.currentProposal.id,
                price: this.currentProposal.ask_price
            });
        }

        updateConnectionStatus(connected) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            
            if (connected) {
                dot.classList.add('connected');
                text.textContent = 'Connected';
            } else {
                dot.classList.remove('connected');
                text.textContent = 'Disconnected';
            }
        }

        setupEventListeners() {
            // Duration buttons
            document.querySelectorAll('.duration-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.duration-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    this.requestProposal();
                });
            });

            // Stake input
            document.getElementById('stakeInput').addEventListener('input', () => {
                this.requestProposal();
            });

            // Contract type
            document.getElementById('contractType').addEventListener('change', (e) => {
                const digitSelection = document.getElementById('digitSelection');
                digitSelection.style.display = e.target.value.includes('DIGIT') ? 'block' : 'none';
                this.requestProposal();
            });

            // Digit input
            document.getElementById('digitInput').addEventListener('input', () => {
                this.requestProposal();
            });

            // Trade buttons
            document.getElementById('btnCall').addEventListener('click', () => {
                document.getElementById('contractType').value = 'CALL';
                this.requestProposal();
                setTimeout(() => this.executeTrade('CALL'), 100);
            });

            document.getElementById('btnPut').addEventListener('click', () => {
                document.getElementById('contractType').value = 'PUT';
                this.requestProposal();
                setTimeout(() => this.executeTrade('PUT'), 100);
            });

            // Update proposal on symbol change
            setInterval(() => {
                if (this.currentProposal) {
                    this.requestProposal();
                }
            }, 5000);
        }
    }

    // Initialize the terminal
    const terminal = new DerivTradingTerminal();
</script>

</body>
</html>
