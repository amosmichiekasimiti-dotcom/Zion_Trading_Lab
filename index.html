<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zion Trading Lab | Live Data</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0e11; color: #eaecef; padding: 20px; margin: 0; }
        .container { max-width: 900px; margin: 20px auto; background: #161a1e; border-radius: 12px; padding: 25px; border: 1px solid #2b3139; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2b3139; padding-bottom: 15px; margin-bottom: 20px; }
        h2 { margin: 0; color: #f0b90b; }
        #status { font-size: 0.85em; padding: 5px 12px; border-radius: 20px; background: #2b3139; color: #848e9c; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: #848e9c; font-size: 0.75em; padding: 12px; border-bottom: 1px solid #2b3139; }
        td { padding: 15px 12px; border-bottom: 1px solid #21262c; font-family: monospace; font-size: 1.05em; }
        .up { color: #0ecb81; font-weight: bold; }
        .down { color: #f6465d; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>ZION TRADING LAB</h2>
        <div id="status">INITIALIZING...</div>
    </div>

    <table>
        <thead>
            <tr>
                <th>MARKET INDEX</th>
                <th>LIVE PRICE</th>
            </tr>
        </thead>
        <tbody id="ticker-list">
            <tr><td colspan="2" style="text-align:center;">Connecting to stream...</td></tr>
        </tbody>
    </table>
</div>

<script>
    // YOUR OFFICIAL CONFIGURATION
    const APP_ID = 126973; 
    const REDIRECT_URL = "https://zion-trading-lab.vercel.app/";
    
    const list = document.getElementById('ticker-list');
    const status = document.getElementById('status');
    
    let ws;
    const symbols = {};

    function connect() {
        // Connect using your specific App ID
        ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);

        ws.onopen = () => {
            status.innerText = "CONNECTED";
            status.style.color = "#0ecb81";
            // Get all synthetic symbols
            ws.send(JSON.stringify({ "active_symbols": "brief", "product_type": "basic" }));
        };

        ws.onmessage = (msg) => {
            const res = JSON.parse(msg.data);

            if (res.error) {
                console.error("Deriv Error:", res.error.message);
                status.innerText = "AUTH ERROR";
                return;
            }

            // Create the list of indices
            if (res.msg_type === 'active_symbols') {
                const synthetics = res.active_symbols.filter(s => s.market === 'synthetic_index');
                list.innerHTML = ""; 
                
                synthetics.forEach(s => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="color:#ffffff; font-weight:600;">${s.display_name}</td>
                        <td id="p-${s.symbol}">---</td>
                    `;
                    list.appendChild(tr);
                    symbols[s.symbol] = { el: document.getElementById(`p-${s.symbol}`), last: 0 };
                    
                    // Subscribe to live price for this index
                    ws.send(JSON.stringify({ "ticks": s.symbol, "subscribe": 1 }));
                });
            }

            // Update prices in real-time
            if (res.msg_type === 'tick') {
                const t = res.tick;
                if (symbols[t.symbol]) {
                    const row = symbols[t.symbol];
                    row.el.className = t.quote >= row.last ? 'up' : 'down';
                    row.el.innerText = t.quote;
                    row.last = t.quote;
                }
            }
        };

        ws.onclose = () => { 
            status.innerText = "RECONNECTING..."; 
            setTimeout(connect, 5000); 
        };
    }

    // Ping to keep connection alive
    setInterval(() => { if(ws && ws.readyState === 1) ws.send(JSON.stringify({ping:1})); }, 30000);

    connect();
</script>
</body>
</html>
