<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zion Sniper | XML Integrated Terminal</title>
    <style>
        :root { --red: #ff444f; --dark: #0a0a0f; --green: #00ff88; --gold: #ffd700; --blue: #00f2fe; --panel: #151520; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; margin: 0; padding: 10px; overflow-x: hidden; }
        
        .account-panel { background: var(--panel); padding: 15px; border-radius: 12px; border: 1px solid #333; margin-bottom: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .balance-val { font-size: 28px; font-weight: bold; color: var(--green); font-family: monospace; }
        .token-input { background: #000; border: 1px solid #444; color: var(--gold); padding: 10px; border-radius: 6px; width: 100%; box-sizing: border-box; margin-top: 10px; font-size: 12px; }
        
        .bot-settings { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 10px 0; }
        .setting-card { background: #1a1a24; padding: 10px; border-radius: 8px; border: 1px solid #333; text-align: center; }
        .set-label { font-size: 9px; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        .set-input { background: none; border: none; color: var(--blue); font-weight: bold; width: 100%; text-align: center; font-size: 16px; outline: none; }

        .sniper-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .strat-card { background: var(--panel); padding: 15px; border-radius: 12px; border: 1px solid #333; transition: 0.3s; }
        .strat-title { font-size: 11px; color: var(--gold); font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .cond-row { display: flex; justify-content: space-between; font-size: 9px; margin-bottom: 4px; font-family: monospace; }
        .pass { color: var(--green); font-weight: bold; }
        .fail { color: #555; }

        .gino-active { border-color: var(--gold); box-shadow: 0 0 20px rgba(255, 215, 0, 0.3); }
        
        #price-display { font-size: 40px; text-align: center; font-family: monospace; color: var(--blue); margin: 15px 0; font-weight: bold; }
        .execution-btn { width: 100%; padding: 20px; border-radius: 12px; border: none; font-size: 18px; font-weight: 900; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .btn-locked { background: #222; color: #444; cursor: not-allowed; }
        .btn-ready { background: linear-gradient(to bottom, var(--gold), #ccac00); color: #000; box-shadow: 0 0 20px var(--gold); }
    </style>
</head>
<body>

<div class="account-panel">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 11px; color: #aaa;">DERIV LIVE BALANCE</span>
        <span id="conn-status" style="color: var(--red); font-size: 10px; font-weight: bold;">● OFFLINE</span>
    </div>
    <div id="balance-amt" class="balance-val">$0.00</div>
    <input type="password" id="api-token" class="token-input" placeholder="Enter API Token (Read/Trade scope)">
    <button onclick="initAccount()" style="width:100%; margin-top:8px; padding:8px; background:var(--blue); border:none; border-radius:5px; font-weight:bold; cursor:pointer;">CONNECT ACCOUNT</button>
</div>

<div class="bot-settings">
    <div class="setting-card"><div class="set-label">Initial Stake</div><input type="number" id="bot-stake" class="set-input" value="1.60"></div>
    <div class="setting-card"><div class="set-label">Martingale</div><input type="number" id="bot-multi" class="set-input" value="2.1"></div>
    <div class="setting-card"><div class="set-label">TP (Target)</div><input type="number" id="bot-tp" class="set-input" value="10.0"></div>
</div>

<div id="price-display">0.00</div>

<div class="sniper-grid">
    <div class="strat-card" id="card-ou">
        <div class="strat-title">ZONE SNIPER (OVER 4)</div>
        <div id="list-ou"></div>
    </div>
    <div class="strat-card" id="card-rf">
        <div class="strat-title">MOMENTUM SNIPER (RISE)</div>
        <div id="list-rf"></div>
    </div>
</div>

<button id="exec-btn" class="execution-btn btn-locked" disabled>Waiting for Legit Signal...</button>

<script>
    let apiWs, priceWs;
    let digitHistory = [], priceHistory = [];
    let currentStake = 1.60;
    
    // --- Account Integration ---
    function initAccount() {
        const token = document.getElementById('api-token').value;
        if (!token) return alert("Please enter your API token.");
        
        apiWs = new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=126973');
        
        apiWs.onopen = () => apiWs.send(JSON.stringify({ authorize: token }));
        
        apiWs.onmessage = (msg) => {
            const data = JSON.parse(msg.data);
            if (data.authorize) {
                document.getElementById('conn-status').innerText = "● ONLINE";
                document.getElementById('conn-status').style.color = "var(--green)";
                document.getElementById('balance-amt').innerText = "$" + data.authorize.balance;
                apiWs.send(JSON.stringify({ balance: 1, subscribe: 1 }));
            }
            if (data.balance) document.getElementById('balance-amt').innerText = "$" + data.balance.balance;
            if (data.buy) alert("Legit Trade Executed Successfully!");
        };
    }

    // --- Price Sniper Engine ---
    priceWs = new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=126973');
    priceWs.onopen = () => priceWs.send(JSON.stringify({ ticks: 'R_100', subscribe: 1 }));
    
    priceWs.onmessage = (msg) => {
        const data = JSON.parse(msg.data);
        if (data.tick) {
            const price = data.tick.quote;
            const digit = parseInt(price.toString().slice(-1));
            priceHistory.push(price);
            digitHistory.push(digit);
            if (digitHistory.length > 20) { digitHistory.shift(); priceHistory.shift(); }
            
            document.getElementById('price-display').innerText = price;
            validateLegitSignals(digit, price);
        }
    };

    function validateLegitSignals(digit, price) {
        const last10 = digitHistory.slice(-10);
        
        // legit conditions for Over 4
        const ouConds = [
            { n: "VACUUM (0,1 COLD)", v: !last10.includes(0) && !last10.includes(1) },
            { n: "ZONE DENSITY 80%+", v: last10.filter(d => d > 4).length >= 8 },
            { n: "REJECTION DETECTED", v: price > priceHistory[priceHistory.length-2] },
            { n: "ALGO SUPPORT (4,5)", v: last10.includes(4) || last10.includes(5) },
            { n: "GINO DIGIT (8,9)", v: digit >= 8 }
        ];

        updateUI('ou', ouConds, "LEGIT OVER 4");
    }

    function updateUI(id, conds, label) {
        const list = document.getElementById(`list-${id}`);
        const card = document.getElementById(`card-${id}`);
        const btn = document.getElementById('exec-btn');
        const passes = conds.filter(c => c.v).length;

        list.innerHTML = conds.map(c => `<div class="cond-row"><span>${c.n}</span><span class="${c.v?'pass':'fail'}">${c.v?'PASS':'FAIL'}</span></div>`).join('');
        
        if (passes === 5) {
            card.classList.add('gino-active');
            btn.disabled = false;
            btn.className = "execution-btn btn-ready";
            btn.innerText = "SNIPE NOW: " + label;
        } else {
            card.classList.remove('gino-active');
            btn.disabled = true;
            btn.className = "execution-btn btn-locked";
            btn.innerText = `Waiting for Legit Signal (${passes}/5)...`;
        }
    }

    // --- Execution Logic ---
    document.getElementById('exec-btn').onclick = () => {
        const stake = document.getElementById('bot-stake').value;
        if (!apiWs || apiWs.readyState !== 1) return alert("Please connect your account first!");
        
        apiWs.send(JSON.stringify({
            buy: "1",
            price: stake,
            parameters: {
                amount: stake,
                basis: "stake",
                contract_type: "CALL", // Adjust if your XML preferred PUT
                currency: "USD",
                duration: 1,
                duration_unit: "t",
                symbol: "R_100"
            }
        }));
    };
</script>
</body>
</html>
