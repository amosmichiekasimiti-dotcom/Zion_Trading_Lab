<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zion AI Lab | Pro Edition with Digit Analytics</title>
<style>
:root { 
    --red: #ff444f; 
    --dark: #0a0a0f; 
    --green: #00ff88; 
    --gold: #ffd700; 
    --blue: #00f2fe; 
    --panel: #151520; 
    --purple: #9c27b0;
}
body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; margin: 0; padding: 10px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

.nav-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
.nav-btn { background: var(--panel); border: 1px solid #333; color: #888; padding: 10px 15px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; white-space: nowrap; transition: 0.3s; }
.nav-btn.active { background: var(--red); color: white; border-color: var(--red); }

/* XML Bots Section */
.bots-section {
    background: var(--panel);
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 10px;
    border: 1px solid #333;
}

.bots-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
}

.bots-header i {
    color: var(--gold);
    font-size: 18px;
}

.bots-header h3 {
    margin: 0;
    color: white;
    font-size: 14px;
    flex: 1;
}

.bots-toggle {
    background: rgba(255,255,255,0.1);
    border: 1px solid #333;
    color: #888;
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
    transition: 0.3s;
}

.bots-toggle:hover {
    background: var(--blue);
    color: #000;
}

.bots-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
    margin-top: 10px;
    max-height: 200px;
    overflow-y: auto;
    padding: 5px;
}

.bot-card {
    background: rgba(255,255,255,0.05);
    border-radius: 8px;
    padding: 12px;
    border: 1px solid #333;
    cursor: pointer;
    transition: 0.3s;
    position: relative;
}

.bot-card:hover {
    border-color: var(--gold);
    transform: translateY(-2px);
}

.bot-card.selected {
    border-color: var(--green);
    background: rgba(0,255,136,0.1);
}

.bot-name {
    font-weight: bold;
    color: var(--gold);
    margin-bottom: 5px;
    font-size: 12px;
}

.bot-desc {
    font-size: 9px;
    color: #888;
    margin-bottom: 5px;
}

.bot-type {
    font-size: 8px;
    color: var(--blue);
    text-transform: uppercase;
}

.bot-badge {
    position: absolute;
    top: 5px;
    right: 5px;
    background: var(--purple);
    color: white;
    font-size: 8px;
    padding: 2px 4px;
    border-radius: 4px;
}

/* API Token Section */
.api-section {
    background: var(--panel);
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 10px;
    border: 1px solid #333;
}

.api-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
}

.api-header i {
    color: var(--blue);
    font-size: 16px;
}

.api-header span {
    color: white;
    font-size: 13px;
    font-weight: bold;
}

.api-input-container {
    display: flex;
    gap: 10px;
    align-items: center;
}

.api-input {
    flex: 1;
    background: #1a1a24;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 10px 12px;
    color: white;
    font-family: monospace;
    font-size: 12px;
}

.api-input:focus {
    outline: none;
    border-color: var(--gold);
}

.api-save-btn {
    background: var(--blue);
    color: #000;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 11px;
    cursor: pointer;
    transition: 0.3s;
}

.api-save-btn:hover {
    opacity: 0.9;
    transform: scale(1.02);
}

.api-status {
    font-size: 10px;
    color: var(--green);
    margin-top: 5px;
    min-height: 15px;
}

/* XML Preview */
.xml-preview {
    background: #1a1a24;
    border-radius: 8px;
    padding: 12px;
    margin-top: 15px;
    font-family: monospace;
    font-size: 10px;
    color: #aaa;
    border: 1px solid #333;
    max-height: 150px;
    overflow-y: auto;
    white-space: pre-wrap;
    display: none;
}

.xml-preview.show {
    display: block;
}

.table-container { background: var(--panel); border-radius: 12px; flex-grow: 1; overflow-y: auto; border: 1px solid #222; margin-top: 5px; }
table { width: 100%; border-collapse: collapse; }
th { position: sticky; top: 0; background: #1c1c2b; padding: 12px; text-align: left; font-size: 11px; color: #aaa; z-index: 10; }
td { padding: 12px; border-bottom: 1px solid #222; font-size: 13px; }

#analysis-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 1000; padding: 15px; box-sizing: border-box; overflow-y: auto; }
.price-card { background: #151520; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid var(--blue); margin-bottom: 10px; box-shadow: 0 0 15px rgba(0, 242, 254, 0.2); }
#live-price { font-size: 32px; font-weight: bold; font-family: monospace; }

.strategy-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
.strat-card { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; border: 1px solid #333; }
.strat-label { font-size: 9px; color: #888; text-transform: uppercase; margin-bottom: 4px; }
.strat-value { font-weight: bold; font-size: 14px; }

/* Enhanced Digit Circles - 10 digits grid */
.digit-circle-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 15px 0; position: relative; }
.digit-circle { 
    aspect-ratio: 1/1; border-radius: 50%; 
    background: #1a1a24; border: 2px solid #333; 
    display: flex; flex-direction: column; align-items: center; justify-content: center; 
    transition: all 0.3s ease; position: relative; font-size: 12px; color: white;
    padding: 5px;
}
.digit-num { font-size: 16px; font-weight: bold; color: white; }
.digit-pct { font-size: 9px; color: #aaa; margin-top: 2px; }
.digit-stats { font-size: 7px; line-height: 1.2; color: #ccc; margin-top: 3px; text-align: center; }

/* Hot and Cold - based on frequency */
.digit-circle.hot { 
    background: linear-gradient(145deg, #00ff88, #008844) !important; 
    border-color: #fff; 
    box-shadow: 0 0 15px var(--green);
}
.digit-circle.hot .digit-num, .digit-circle.hot .digit-pct, .digit-circle.hot .digit-stats { color: #000; font-weight: 900; }

.digit-circle.cold { 
    background: linear-gradient(145deg, #ff444f, #882222) !important; 
    border-color: #fff; 
    box-shadow: 0 0 15px var(--red);
}
.digit-circle.cold .digit-num, .digit-circle.cold .digit-pct, .digit-circle.cold .digit-stats { color: #fff; }

/* Active last digit indicator */
.digit-circle.active { border-color: var(--blue); box-shadow: 0 0 10px var(--blue); transform: scale(1.05); }

/* Cursor arrow for last digit */
.cursor { 
    position: absolute; 
    top: -15px; 
    width: 0; 
    height: 0; 
    border-left: 8px solid transparent; 
    border-right: 8px solid transparent; 
    border-bottom: 12px solid var(--gold); 
    filter: drop-shadow(0 0 8px var(--gold));
    transition: left 0.3s ease; 
    z-index: 100;
}

/* Chart container */
#chart-container { height: 250px; background: #000; border-radius: 12px; margin-top: 15px; overflow: hidden; border: 1px solid #222; }
.close-btn { background: #333; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; margin: 20px 0; cursor: pointer; }
.btn-analyze { background: var(--blue); color: #000; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }

/* Match/Diff bar container */
.match-bar-container { width: 100%; height: 4px; background: #333; border-radius: 2px; margin-top: 3px; overflow: hidden; }
.match-bar-fill { height: 100%; width: 0%; transition: width 0.3s ease; }
.match-bar-hot { background: var(--green); }
.match-bar-cold { background: var(--red); }

/* Market counter */
.market-count {
    color: var(--gold);
    font-size: 11px;
    margin-left: 10px;
}

/* Loading indicator */
.loading {
    text-align: center;
    padding: 20px;
    color: var(--gold);
}
</style>
</head>
<body>

<div style="display:flex; justify-content:space-between; align-items:center; padding: 5px 10px;">
    <h2 style="margin:0; color: var(--gold); font-size: 18px;">🤖 ZION PRO LAB</h2>
    <div style="display: flex; gap: 15px; align-items: center;">
        <small id="market-counter" style="color:var(--blue)">0 markets</small>
        <small id="status-text" style="color:var(--green)">● Connected</small>
    </div>
</div>

<div class="nav-scroll">
    <button class="nav-btn" onclick="filterMarkets('all', this)">ALL</button>
    <button class="nav-btn active" onclick="filterMarkets('synthetic', this)">VOLATILITY</button>
    <button class="nav-btn" onclick="filterMarkets('crashboom', this)">CRASH/BOOM</button>
    <button class="nav-btn" onclick="filterMarkets('step', this)">STEP/RANGE</button>
    <button class="nav-btn" onclick="filterMarkets('forex', this)">FOREX</button>
    <button class="nav-btn" onclick="filterMarkets('cryptocurrency', this)">CRYPTO</button>
    <button class="nav-btn" onclick="filterMarkets('commodities', this)">COMMODITIES</button>
    <button class="nav-btn" onclick="filterMarkets('indices', this)">INDICES</button>
</div>

<!-- XML Bots Section - NEW -->
<div class="bots-section">
    <div class="bots-header">
        <i class="fas fa-robot"></i>
        <h3>XML Trading Bots</h3>
        <button class="bots-toggle" onclick="toggleBots()">Hide</button>
    </div>
    <div id="bots-container">
        <div class="bots-grid" id="bots-grid">
            <!-- Bot cards will be populated by JavaScript -->
        </div>
        <div id="xml-preview" class="xml-preview"></div>
    </div>
</div>

<!-- API Token Section - NEW -->
<div class="api-section">
    <div class="api-header">
        <i class="fas fa-key"></i>
        <span>API Token</span>
    </div>
    <div class="api-input-container">
        <input type="password" id="api-token" class="api-input" placeholder="Enter your Deriv API token" value="">
        <button class="api-save-btn" onclick="saveApiToken()">Save</button>
    </div>
    <div id="api-status" class="api-status"></div>
</div>

<div class="table-container">
    <table>
        <thead><tr><th>Asset Name</th><th>Symbol</th><th>Market</th><th>Action</th></tr></thead>
        <tbody id="market-list"></tbody>
    </table>
</div>

<div id="analysis-overlay">
    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
        <h3 id="target-name" style="margin:0; color:var(--gold);">Asset Analysis</h3>
        <span id="target-symbol" style="color:#666; font-family: monospace;">---</span>
    </div>

    <div class="price-card">
        <div id="live-price">00.00</div>
    </div>

    <div class="strategy-grid">
        <div class="strat-card"><div class="strat-label">Even / Odd</div><div id="stat-even-odd" class="strat-value">---</div></div>
        <div class="strat-card"><div class="strat-label">Over / Under</div><div id="stat-over-under" class="strat-value">---</div></div>
        <div class="strat-card"><div class="strat-label">Match %</div><div id="stat-match-diff" class="strat-value">---</div></div>
        <div class="strat-card"><div class="strat-label">Tick Trend</div><div id="stat-rise-fall" class="strat-value">---</div></div>
    </div>

    <!-- Legend -->
    <div style="display: flex; justify-content: center; gap: 20px; margin: 10px 0; flex-wrap: wrap;">
        <div style="display: flex; align-items: center; gap: 8px;">
            <div style="width: 12px; height: 12px; background: var(--green); border-radius: 3px;"></div>
            <span style="font-size: 10px;">Hot (most frequent)</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
            <div style="width: 12px; height: 12px; background: var(--red); border-radius: 3px;"></div>
            <span style="font-size: 10px;">Cold (least frequent)</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
            <div style="width: 12px; height: 12px; background: var(--blue); border-radius: 3px;"></div>
            <span style="font-size: 10px;">Last digit</span>
        </div>
    </div>

    <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); position:relative;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <div style="font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 1px;">Digit Analytics (0-9)</div>
            <div id="tick-counter" style="background: var(--blue); color: #000; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: bold;">0/1000</div>
        </div>
        <div class="digit-circle-grid" id="digit-circles"></div>
        <div class="cursor" id="digit-cursor"></div>
    </div>

    <div id="chart-container"></div>
    <button class="close-btn" onclick="closeAnalysis()">EXIT ENGINE</button>
</div>

<script>
const APP_ID = 126973;
const ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);
let allSymbols = [];
let activeTickSubscription = null;
let digitHistory = [];
let priceHistory = [];
const MAX_DIGITS = 1000;
const cursor = document.getElementById("digit-cursor");

// XML Bots data from your files
const xmlBots = [
    {
        name: "Dollar Printer Bot",
        description: "Target profit: 607, Stake: 2, Loss limit: 1000",
        type: "Over/Under",
        xml: `<?xml version="1.0" encoding="UTF-8"?>
<deriv-bot>
  <strategy>
    <name>Dollar Printer</name>
    <market>R_100</market>
    <trade_type>overunder</trade_type>
    <duration>1</duration>
    <stake>2</stake>
    <target_profit>607</target_profit>
    <stop_loss>1000</stop_loss>
  </strategy>
</deriv-bot>`
    },
    {
        name: "Bandwagon Bot",
        description: "Take profit: 10, Stop loss: 30, Martingale: 2x",
        type: "Over/Under",
        xml: `<?xml version="1.0" encoding="UTF-8"?>
<deriv-bot>
  <strategy>
    <name>Bandwagon</name>
    <market>1HZ10V</market>
    <trade_type>overunder</trade_type>
    <duration>1</duration>
    <initial_stake>1</initial_stake>
    <take_profit>10</take_profit>
    <stop_loss>30</stop_loss>
    <martingale>2</martingale>
  </strategy>
</deriv-bot>`
    }
];

let selectedBot = null;

// Initialize bots grid
function initBots() {
    const grid = document.getElementById('bots-grid');
    if (!grid) return;
    
    grid.innerHTML = '';
    xmlBots.forEach((bot, index) => {
        const card = document.createElement('div');
        card.className = 'bot-card';
        card.onclick = () => selectBot(index);
        card.innerHTML = `
            <div class="bot-badge">XML</div>
            <div class="bot-name">${bot.name}</div>
            <div class="bot-desc">${bot.description}</div>
            <div class="bot-type">${bot.type}</div>
        `;
        grid.appendChild(card);
    });
}

function selectBot(index) {
    // Remove selected class from all cards
    document.querySelectorAll('.bot-card').forEach(card => {
        card.classList.remove('selected');
    });
    
    // Add selected class to clicked card
    const cards = document.querySelectorAll('.bot-card');
    if (cards[index]) {
        cards[index].classList.add('selected');
    }
    
    selectedBot = xmlBots[index];
    
    // Show XML preview
    const preview = document.getElementById('xml-preview');
    preview.innerHTML = `<pre style="margin:0;">${escapeHtml(selectedBot.xml)}</pre>`;
    preview.classList.add('show');
}

function escapeHtml(text) {
    return text.replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");
}

function toggleBots() {
    const container = document.getElementById('bots-container');
    const btn = document.querySelector('.bots-toggle');
    
    if (container.style.display === 'none') {
        container.style.display = 'block';
        btn.textContent = 'Hide';
    } else {
        container.style.display = 'none';
        btn.textContent = 'Show';
    }
}

// API Token functions
function saveApiToken() {
    const token = document.getElementById('api-token').value;
    const status = document.getElementById('api-status');
    
    if (token) {
        // Save to localStorage
        localStorage.setItem('deriv_api_token', token);
        status.innerHTML = '✓ Token saved successfully';
        status.style.color = 'var(--green)';
        
        // You can use this token for API calls if needed
        console.log('API Token saved:', token.substring(0, 5) + '...');
    } else {
        status.innerHTML = '✗ Please enter a token';
        status.style.color = 'var(--red)';
    }
}

// Load saved token on page load
function loadSavedToken() {
    const savedToken = localStorage.getItem('deriv_api_token');
    if (savedToken) {
        document.getElementById('api-token').value = savedToken;
        document.getElementById('api-status').innerHTML = '✓ Token loaded from storage';
    }
}

ws.onopen = () => {
    console.log("WebSocket connected");
    document.getElementById('status-text').innerHTML = '● Connected';
    ws.send(JSON.stringify({ active_symbols: "brief", product_type: "basic" }));
};

ws.onerror = (error) => {
    console.error("WebSocket error:", error);
    document.getElementById('status-text').innerHTML = '● Error';
};

ws.onmessage = (msg) => {
    const data = JSON.parse(msg.data);
    
    if (data.error) {
        console.error("API error:", data.error);
        return;
    }
    
    if (data.active_symbols) { 
        allSymbols = data.active_symbols; 
        console.log(`Loaded ${allSymbols.length} symbols`);
        document.getElementById('market-counter').innerHTML = `${allSymbols.length} markets`;
        // Show volatility markets by default
        filterMarkets('synthetic'); 
    }
    
    if (data.history && data.history.prices) {
        digitHistory = data.history.prices.map(p => {
            const num = Number(p);
            return parseInt(num.toFixed(2).slice(-1));
        });
        priceHistory = [...data.history.prices];
        updateDigitCircles();
        if (digitHistory.length > 0) {
            updateStrategyPanel(digitHistory[digitHistory.length-1], priceHistory[priceHistory.length-1]);
        }
    }
    
    if (data.tick) handleTick(data.tick);
};

function filterMarkets(type, btn) {
    // Update active button
    if(btn) {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
    
    const tbody = document.getElementById('market-list');
    if (!tbody) return;
    
    tbody.innerHTML = '<tr><td colspan="4" class="loading">Loading markets...</td></tr>';
    
    // Small delay to allow UI update
    setTimeout(() => {
        let filtered = [];
        
        if (type === 'all') {
            // Show all symbols
            filtered = allSymbols;
        } else {
            filtered = allSymbols.filter(s => {
                if (!s || !s.market) return false;
                
                const market = s.market.toLowerCase();
                const displayName = (s.display_name || '').toLowerCase();
                const symbol = (s.symbol || '').toLowerCase();
                
                switch(type) {
                    case 'synthetic':
                        return market === 'synthetic_index' && 
                               !displayName.includes('crash') && 
                               !displayName.includes('boom') &&
                               !displayName.includes('jump') &&
                               !displayName.includes('step');
                    
                    case 'crashboom':
                        return displayName.includes('crash') || 
                               displayName.includes('boom') ||
                               symbol.includes('crash') ||
                               symbol.includes('boom');
                    
                    case 'step':
                        return displayName.includes('step') || 
                               displayName.includes('range') ||
                               symbol.includes('step') ||
                               symbol.includes('range');
                    
                    case 'forex':
                        return market === 'forex';
                    
                    case 'cryptocurrency':
                        return market === 'cryptocurrency';
                    
                    case 'commodities':
                        return market === 'commodities';
                    
                    case 'indices':
                        return market === 'stock_index' || 
                               market === 'indices';
                    
                    default:
                        return true;
                }
            });
        }
        
        // Update market counter
        document.getElementById('market-counter').innerHTML = `${filtered.length} markets`;
        
        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#666; padding:20px;">No markets found in this category</td></tr>';
            return;
        }
        
        // Clear and populate
        tbody.innerHTML = '';
        
        // Display all markets (no limit)
        filtered.forEach(s => {
            const row = document.createElement('tr');
            const marketType = s.market || 'N/A';
            const symbol = s.symbol || '';
            const displayName = s.display_name || symbol;
            
            // Escape single quotes for onclick
            const escapedName = displayName.replace(/'/g, "\\'");
            
            row.innerHTML = `
                <td>${displayName}</td>
                <td style="color:#666; font-size:10px;">${symbol}</td>
                <td style="color:#888; font-size:10px;">${marketType}</td>
                <td><button class="btn-analyze" onclick="openAnalysis('${symbol}','${escapedName}')">Analyze</button></td>
            `;
            tbody.appendChild(row);
        });
    }, 100);
}

function openAnalysis(symbol, name){
    document.getElementById('target-name').innerText = name;
    document.getElementById('target-symbol').innerText = symbol;
    document.getElementById('analysis-overlay').style.display = 'block';
    
    // Load chart
    document.getElementById('chart-container').innerHTML = `
        <iframe src="https://tradingview.binary.com/v2/main.php?symbol=${symbol}&theme=dark" 
                width="100%" height="100%" frameborder="0"></iframe>`;
    
    // Reset data
    digitHistory = []; 
    priceHistory = []; 
    buildDigitUI();

    // Request history
    ws.send(JSON.stringify({
        ticks_history: symbol,
        adjust_start_time: 1,
        count: Math.min(MAX_DIGITS, 1000),
        end: "latest",
        style: "ticks"
    }));
    
    // Subscribe to ticks
    if (activeTickSubscription) {
        ws.send(JSON.stringify({ forget: activeTickSubscription }));
    }
    ws.send(JSON.stringify({ ticks: symbol, subscribe: 1 }));
}

function buildDigitUI(){
    const container = document.getElementById('digit-circles');
    if (!container) return;
    
    container.innerHTML = '';
    for(let i = 0; i <= 9; i++){
        container.innerHTML += `<div id="circle-${i}" class="digit-circle">
            <div class="digit-num">${i}</div>
            <div id="pct-${i}" class="digit-pct">0%</div>
            <div id="stats-${i}" class="digit-stats">E/O:--<br>M/D:--</div>
            <div class="match-bar-container" id="bar-${i}">
                <div class="match-bar-fill" id="fill-${i}" style="width:0%"></div>
            </div>
        </div>`;
    }
}

function handleTick(tick){
    if (!tick || !tick.quote) return;
    
    activeTickSubscription = tick.id;
    const pipSize = tick.pip_size || 2;
    const priceStr = Number(tick.quote).toFixed(pipSize);
    const lastDigit = parseInt(priceStr[priceStr.length-1]);

    document.getElementById('live-price').innerText = priceStr;

    digitHistory.push(lastDigit); 
    priceHistory.push(Number(tick.quote));
    
    if(digitHistory.length > MAX_DIGITS) digitHistory.shift();
    if(priceHistory.length > MAX_DIGITS) priceHistory.shift();

    updateDigitCircles(); 
    updateStrategyPanel(lastDigit, Number(tick.quote));
}

function updateDigitCircles(){
    if (digitHistory.length === 0) return;
    
    const recentDigits = digitHistory.slice(-MAX_DIGITS);
    const counts = Array(10).fill(0); 
    recentDigits.forEach(d => {
        if (d >= 0 && d <= 9) counts[d]++;
    });

    const total = recentDigits.length;
    document.getElementById('tick-counter').innerText = `${total}/${MAX_DIGITS}`;

    // Calculate match counts for each digit (consecutive same digits)
    const matchCounts = Array(10).fill(0);
    for(let i=1; i<recentDigits.length; i++){
        if(recentDigits[i] === recentDigits[i-1]){
            matchCounts[recentDigits[i]]++;
        }
    }

    // Calculate percentages
    const pctArr = counts.map(count => total > 0 ? (count / total * 100) : 0);
    
    // Find min/max for hot/cold
    const maxVal = Math.max(...counts);
    const minVal = Math.min(...counts.filter(c => c > 0));
    const maxDigit = counts.indexOf(maxVal);
    const minDigit = counts.indexOf(minVal);

    counts.forEach((count, i) => {
        const circle = document.getElementById(`circle-${i}`);
        if(!circle) return;
        
        const pctEl = document.getElementById(`pct-${i}`);
        const statsEl = document.getElementById(`stats-${i}`);
        const fillEl = document.getElementById(`fill-${i}`);
        
        if(pctEl) pctEl.innerText = `${pctArr[i].toFixed(1)}%`;
        
        // Even/Odd and Over/Under text
        const evenOdd = i%2===0 ? "E" : "O";
        const overUnder = i>=5 ? "Ov" : "Un";
        
        // Match percentage for this digit
        const matchPct = count>0 ? (matchCounts[i]/count * 100) : 0;
        
        if(statsEl) statsEl.innerHTML = `${evenOdd}/${overUnder}<br>M:${matchPct.toFixed(0)}%`;
        
        // Match bar
        if(fillEl) {
            fillEl.style.width = `${matchPct}%`;
            fillEl.className = `match-bar-fill ${matchPct >= 50 ? 'match-bar-hot' : 'match-bar-cold'}`;
        }
        
        // Hot/Cold classes based on frequency
        circle.classList.remove('hot', 'cold', 'active');
        if(i === recentDigits[recentDigits.length-1]) circle.classList.add('active');
        if(i === maxDigit && count > 0) circle.classList.add('hot');
        if(i === minDigit && count > 0 && minVal < maxVal) circle.classList.add('cold');
    });

    // Move cursor above last digit
    const lastDigit = recentDigits[recentDigits.length-1];
    if(lastDigit !== undefined){
        const targetCircle = document.getElementById(`circle-${lastDigit}`);
        if(targetCircle && cursor){
            const rect = targetCircle.getBoundingClientRect();
            const parentRect = document.getElementById('digit-circles').getBoundingClientRect();
            cursor.style.left = `${rect.left - parentRect.left + rect.width/2 - 8}px`;
        }
    }
}

function updateStrategyPanel(digit, price){
    const evOdEl = document.getElementById('stat-even-odd');
    const ovUnEl = document.getElementById('stat-over-under');
    const rfEl = document.getElementById('stat-rise-fall');
    const mdEl = document.getElementById('stat-match-diff');

    if (evOdEl) {
        evOdEl.innerText = digit % 2 === 0 ? "EVEN" : "ODD"; 
        evOdEl.style.color = digit % 2 === 0 ? "var(--blue)" : "var(--gold)";
    }
    
    if (ovUnEl) {
        ovUnEl.innerText = digit >= 5 ? "OVER" : "UNDER"; 
        ovUnEl.style.color = digit >= 5 ? "var(--green)" : "var(--red)";
    }
    
    if (rfEl && priceHistory.length > 1) {
        const lastPrice = priceHistory[priceHistory.length-2];
        rfEl.innerText = price >= lastPrice ? "RISE" : "FALL"; 
        rfEl.style.color = price >= lastPrice ? "var(--green)" : "var(--red)";
    }

    // Calculate overall match percentage
    let matches = 0;
    for(let i=1; i<digitHistory.length; i++){
        if(digitHistory[i] === digitHistory[i-1]) matches++;
    }
    const matchPct = digitHistory.length > 1 ? (matches/(digitHistory.length-1)*100).toFixed(1) : 0;
    if (mdEl) {
        mdEl.innerText = `${matchPct}% match`;
        mdEl.style.color = matchPct >= 50 ? "var(--green)" : "var(--red)";
    }
}

function closeAnalysis(){
    document.getElementById('analysis-overlay').style.display = 'none';
    if(activeTickSubscription) {
        ws.send(JSON.stringify({ forget: activeTickSubscription }));
        activeTickSubscription = null;
    }
}

// Initialize on load
window.addEventListener('load', () => {
    buildDigitUI();
    initBots();
    loadSavedToken();
});
</script>
