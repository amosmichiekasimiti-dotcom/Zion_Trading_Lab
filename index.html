<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zion AI Lab | Final Sync</title>
    <style>
        :root { --red: #ff444f; --dark: #0a0a0f; --green: #00ff88; --gold: #ffd700; --blue: #00f2fe; --panel: #151520; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; margin: 0; padding: 10px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .nav-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
        .nav-btn { background: var(--panel); border: 1px solid #333; color: #888; padding: 10px 15px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; white-space: nowrap; transition: 0.3s; }
        .nav-btn.active { background: var(--red); color: white; border-color: var(--red); }
        .table-container { background: var(--panel); border-radius: 12px; flex-grow: 1; overflow-y: auto; border: 1px solid #222; margin-top: 5px; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 12px; border-bottom: 1px solid #222; font-size: 13px; }
        #analysis-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 1000; padding: 15px; box-sizing: border-box; overflow-y: auto; }
        .price-card { background: #151520; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid var(--blue); margin-bottom: 10px; }
        #live-price { font-size: 32px; font-weight: bold; font-family: monospace; }
        .digit-circle-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin: 15px 0; }
        .digit-circle { aspect-ratio: 1/1; border-radius: 50%; background: #1a1a24; border: 2px solid #333; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.2s; }
        .digit-num { font-size: 16px; font-weight: bold; }
        .digit-pct { font-size: 9px; color: #888; }
        .digit-circle.active { border-color: var(--blue); box-shadow: 0 0 15px var(--blue); }
        .digit-circle.most-freq { background: var(--green) !important; color: #000; }
        .digit-circle.least-freq { background: var(--red) !important; color: #fff; }
        #chart-container { height: 350px; background: #000; border-radius: 12px; margin-top: 15px; overflow: hidden; border: 1px solid #222; }
        .btn-analyze { background: var(--blue); color: #000; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <div style="display:flex; justify-content:space-between; align-items:center; padding: 5px 10px;">
        <h2 style="margin:0; color: var(--gold); font-size: 18px;">🤖 ZION SYNC PRO</h2>
        <small id="status-text" style="color:var(--green)">● Engine Live</small>
    </div>

    <div class="nav-scroll" id="nav-tabs"></div>

    <div class="table-container">
        <table><tbody id="market-list"></tbody></table>
    </div>

    <div id="analysis-overlay">
        <h3 id="target-name" style="margin:0; color:var(--gold);">---</h3>
        <div class="price-card">
            <div id="live-price">0.0000</div>
            <div id="tick-counter" style="font-size: 10px; color: var(--blue); margin-top: 5px;">SYNCING...</div>
        </div>

        <div class="digit-circle-grid" id="digit-circles"></div>
        <div id="chart-container"></div>
        <button class="btn-analyze" style="width:100%; padding:15px; margin-top:10px;" onclick="closeAnalysis()">CLOSE ENGINE</button>
    </div>

<script>
    const APP_ID = 126973;
    const ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);
    let allSymbols = [], activeTickStream = null, digitHistory = [], priceHistory = [];
    let currentPipSize = 2;
    const MAX_DIGITS = 1000;

    ws.onopen = () => ws.send(JSON.stringify({ active_symbols: "brief", product_type: "basic" }));

    ws.onmessage = (msg) => {
        const data = JSON.parse(msg.data);

        if (data.active_symbols) {
            allSymbols = data.active_symbols;
            renderMarkets();
        }

        if (data.history) {
            // FIX: Match the platform's history exactly
            const prices = data.history.prices;
            digitHistory = prices.map(p => parseInt(p.toFixed(currentPipSize).slice(-1)));
            priceHistory = [...prices];
            updateUI();
        }

        if (data.tick) {
            // DUPLICATE FILTER: Check if this tick is already accounted for in history
            if (data.tick.quote === priceHistory[priceHistory.length - 1]) return;
            
            const priceStr = data.tick.quote.toFixed(currentPipSize);
            const lastDigit = parseInt(priceStr.slice(-1));
            
            digitHistory.push(lastDigit);
            priceHistory.push(data.tick.quote);

            while(digitHistory.length > MAX_DIGITS) digitHistory.shift();
            while(priceHistory.length > MAX_DIGITS) priceHistory.shift();

            document.getElementById('live-price').innerText = priceStr;
            updateUI();
        }
    };

    function renderMarkets() {
        const tbody = document.getElementById('market-list');
        tbody.innerHTML = '';
        allSymbols.filter(s => s.market === 'synthetic_index').forEach(s => {
            tbody.innerHTML += `<tr><td>${s.display_name}</td><td><button class="btn-analyze" onclick="openAnalysis('${s.symbol}', '${s.display_name}', ${s.pip_size})">Analyze</button></td></tr>`;
        });
    }

    function openAnalysis(symbol, name, pip) {
        currentPipSize = pip;
        document.getElementById('target-name').innerText = name;
        document.getElementById('analysis-overlay').style.display = 'block';
        document.getElementById('chart-container').innerHTML = `<iframe src="https://tradingview.binary.com/v2/main.php?symbol=${symbol}&theme=dark" width="100%" height="100%" frameborder="0"></iframe>`;
        
        digitHistory = []; priceHistory = [];
        buildCircles();

        // 1. Get History
        ws.send(JSON.stringify({ ticks_history: symbol, count: MAX_DIGITS, end: "latest", style: "ticks" }));
        // 2. Subscribe Live
        if (activeTickStream) ws.send(JSON.stringify({ forget: activeTickStream }));
        ws.send(JSON.stringify({ ticks: symbol, subscribe: 1 }));
    }

    function buildCircles() {
        const container = document.getElementById('digit-circles');
        container.innerHTML = '';
        for(let i=0; i<=9; i++) {
            container.innerHTML += `<div id="circle-${i}" class="digit-circle"><div class="digit-num">${i}</div><div id="pct-${i}" class="digit-pct">0%</div></div>`;
        }
    }

    function updateUI() {
        const counts = new Array(10).fill(0);
        digitHistory.forEach(d => counts[d]++);
        const total = digitHistory.length;
        document.getElementById('tick-counter').innerText = `DATA SAMPLES: ${total} / 1000`;

        const max = Math.max(...counts);
        const min = total >= MAX_DIGITS ? Math.min(...counts) : -1;

        counts.forEach((count, i) => {
            const pct = total > 0 ? ((count / total) * 100).toFixed(1) : "0.0";
            document.getElementById(`pct-${i}`).innerText = pct + "%";
            
            const el = document.getElementById(`circle-${i}`);
            el.classList.remove('active', 'most-freq', 'least-freq');
            
            if (i === digitHistory[digitHistory.length - 1]) el.classList.add('active');
            if (total >= 100) {
                if (count === max) el.classList.add('most-freq');
                else if (count === min) el.classList.add('least-freq');
            }
        });
    }

    function closeAnalysis() {
        document.getElementById('analysis-overlay').style.display = 'none';
        if (activeTickStream) ws.send(JSON.stringify({ forget: activeTickStream }));
    }
</script>
</body>
</html>
