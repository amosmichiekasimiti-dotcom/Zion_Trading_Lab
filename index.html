<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zion Trading Lab · Direct Sync</title>
    <style>
        :root { 
            --red: #ff444f; 
            --dark: #0e0e15; 
            --neon: #00f2fe;
            --card-bg: #1a1a1a;
            --border: #2e2e48;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            background: var(--dark); 
            color: white; 
            margin: 0; 
            height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-weight: 700;
            color: var(--neon);
            letter-spacing: 0.5px;
        }

        .status {
            font-size: 12px;
            color: #4caf50;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status::before {
            content: "";
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
            display: inline-block;
        }

        /* Navigation */
        .nav-scroll { 
            display: flex; 
            overflow-x: auto; 
            padding: 12px 16px; 
            gap: 12px; 
            border-bottom: 1px solid var(--border); 
            flex-shrink: 0;
            scrollbar-width: thin;
            scrollbar-color: var(--neon) var(--border);
        }

        .nav-scroll::-webkit-scrollbar {
            height: 4px;
        }

        .nav-scroll::-webkit-scrollbar-thumb {
            background: var(--neon);
            border-radius: 4px;
        }

        .nav-scroll button { 
            background: transparent; 
            color: #8899bb; 
            border: 1px solid var(--border); 
            padding: 8px 20px; 
            border-radius: 40px; 
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .nav-scroll button:hover {
            border-color: var(--neon);
            color: white;
        }

        .nav-scroll button.active {
            background: var(--red);
            color: white;
            border-color: var(--red);
        }

        /* Market List */
        .market-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .market-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
        }

        .market-info h4 {
            font-size: 16px;
            margin-bottom: 4px;
        }

        .market-info span {
            font-size: 12px;
            color: #8899bb;
        }

        .analyze-btn {
            background: var(--neon);
            color: black;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .analyze-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        /* MODAL */
        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--dark);
            z-index: 1000;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--neon);
        }

        .close-btn {
            background: transparent;
            color: var(--red);
            border: 1px solid var(--red);
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            padding: 16px;
            overflow-x: auto;
            scrollbar-width: thin;
        }

        .tab {
            background: transparent;
            color: #8899bb;
            border: 1px solid var(--border);
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .tab.active {
            background: var(--red);
            color: white;
            border-color: var(--red);
        }

        /* Price Display */
        .price-header {
            background: #000;
            margin: 0 16px 16px 16px;
            padding: 24px;
            border-radius: 24px;
            border: 1px solid var(--border);
        }

        #live-price {
            font-size: 42px;
            font-family: 'Courier New', monospace;
            font-weight: 700;
            text-align: center;
            letter-spacing: 2px;
        }

        /* Digit Panel */
        #digit-panel { 
            display: none; 
            padding: 0 16px 16px 16px;
        }

        .digit-grid { 
            display: grid; 
            grid-template-columns: repeat(10, 1fr); 
            gap: 6px; 
            height: 80px; 
            background: #000;
            padding: 12px;
            border-radius: 24px;
            border: 1px solid var(--border);
        }

        .d-box { 
            background: #1a1a1a; 
            display: flex; 
            flex-direction: column-reverse; 
            align-items: center; 
            border: 1px solid #333; 
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            transition: all 0.2s;
        }

        .d-bar { 
            width: 100%; 
            background: var(--neon); 
            transition: height 0.3s;
            min-height: 2px;
        }

        .d-num {
            position: absolute;
            top: 4px;
            font-size: 14px;
            font-weight: 700;
            color: white;
            z-index: 2;
        }

        .d-pct { 
            position: absolute;
            bottom: 4px;
            font-size: 9px; 
            font-weight: bold; 
            color: var(--neon); 
            z-index: 2;
            background: rgba(0,0,0,0.5);
            padding: 2px 6px;
            border-radius: 20px;
        }

        /* Chart */
        #chart-container { 
            flex: 1; 
            border-top: 1px solid var(--border);
            background: #0a0a12;
            min-height: 300px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Loading state */
        .loading {
            color: #8899bb;
            text-align: center;
            padding: 40px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">ZION · REEF SYNC</div>
        <div class="status">DIRECT FEED</div>
    </div>

    <!-- Navigation -->
    <div class="nav-scroll" id="navContainer">
        <button onclick="loadCategory('volatility', this)" class="active">VOLATILITY</button>
        <button onclick="loadCategory('forex', this)">FOREX</button>
        <button onclick="loadCategory('crashboom', this)">CRASH/BOOM</button>
        <button onclick="loadCategory('jump', this)">JUMP</button>
        <button onclick="loadCategory('range', this)">RANGE</button>
    </div>

    <!-- Market List (will be populated by JS) -->
    <div class="market-list" id="marketList">
        <div class="loading">Loading markets...</div>
    </div>

    <!-- Analysis Modal -->
    <div id="modal">
        <div class="modal-header">
            <span class="modal-title" id="modalTitle">Select an asset</span>
            <button class="close-btn" onclick="closeModal()">CLOSE</button>
        </div>

        <div class="tabs" id="tabContainer">
            <div class="tab active" onclick="switchMode('rise_fall', this)">RISE/FALL</div>
            <div class="tab" onclick="switchMode('even_odd', this)">EVEN/ODD</div>
            <div class="tab" onclick="switchMode('matches_differs', this)">MATCHES/DIFFERS</div>
            <div class="tab" onclick="switchMode('over_under', this)">OVER/UNDER</div>
        </div>

        <div class="price-header">
            <div id="live-price">0.00000<span style="color:red; border-bottom:2px solid red;">0</span></div>
        </div>

        <div id="digit-panel">
            <div class="digit-grid" id="digit-grid"></div>
        </div>

        <div id="chart-container">
            <div class="loading">Select an asset to load chart</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
