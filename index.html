<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZION TRADING LAB | v10.0 Adam Final</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="zion-lab-wrapper">
    <header>
        <div onclick="toggleSidebar()" style="cursor: pointer; font-size: 28px; color: white;">☰</div>
        <div class="header-center">
            <strong>ZION TRADING LAB</strong>
            <small id="acc-info">AUTHORIZING SERVER...</small>
        </div>
        <button id="voice-toggle" onclick="toggleMute()">ADAM: ON</button>
    </header>
    <div id="sidebar">
        <div class="nav-section">
            <h5>ENGINE MODES</h5>
            <div class="nav-item" onclick="toggleSidebar()">Rise/Fall Analysis</div>
            <div class="nav-item" onclick="toggleSidebar()">Even/Odd Scanners</div>
            <div class="nav-item" onclick="toggleSidebar()">Over/Under Physics</div>
        </div>
        <button onclick="toggleSidebar()" class="btn-action btn-no" style="padding: 10px; width: 100%;">CLOSE</button>
    </div>
    <div id="risk-panel">
        <div class="risk-input"><label>STAKE ($)</label><input id="p-stake" type="number" value="1.00"></div>
        <div class="risk-input"><label>MODE</label>
            <select id="acc-switch" onchange="switchAccount(this.value)">
                <option value="demo">DEMO</option>
                <option value="real">REAL</option>
            </select>
        </div>
    </div>
    <div class="tab-nav">
        <button class="tab-btn active" id="tab-engine" onclick="switchTab('signal-engine')">SIGNAL ENGINE</button>
        <button class="tab-btn" id="tab-monitor" onclick="switchTab('live-monitor')">LIVE SERVER</button>
    </div>
    <div id="view-container">
        <div id="signal-engine">
            <div id="market-grid" class="market-grid"></div>
            <div id="feed-status" style="text-align:center; color:#444; font-size:11px; margin-top:20px;">Scanning All Volatility Indices...</div>
        </div>
        <div id="live-monitor" style="display: none;"><div id="server-stream">Waiting for data stream...</div></div>
    </div>
    <div id="exec-prompt">
        <h2 id="prompt-market" style="color: var(--primary); margin:0;">SIGNAL!</h2>
        <p id="prompt-details" style="font-size: 13px; color: #888;">Prediction Ready</p>
        <div class="btn-group">
            <button onclick="confirmTrade(true)" class="btn-action btn-yes">BUY</button>
            <button onclick="confirmTrade(false)" class="btn-action btn-no">IGNORE</button>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
