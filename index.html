<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zion Trading Lab | AI Engine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --red: #ff444f; --dark: #0e0e13; --green: #4caf50; --gold: #ffd700; --blue: #00f2fe; --panel: #1a1a24; }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--dark); color: white; margin: 0; padding: 10px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Header & Status */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 5px 10px; margin-bottom: 10px; }
        .status-dot { height: 8px; width: 8px; background-color: #bbb; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .connected .status-dot { background-color: var(--green); box-shadow: 0 0 8px var(--green); }
        
        /* Navigation */
        .nav-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        .nav-btn { background: var(--panel); border: 1px solid #333; color: #888; padding: 12px 5px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; transition: 0.3s; }
        .nav-btn.active { background: var(--red); color: white; border-color: var(--red); }

        /* Market Table */
        .table-container { background: var(--panel); border-radius: 12px; flex-grow: 1; overflow-y: auto; border: 1px solid #222; }
        table { width: 100%; border-collapse: collapse; }
        th { position: sticky; top: 0; background: #252533; padding: 12px; text-align: left; font-size: 12px; color: #aaa; }
        td { padding: 15px 12px; border-bottom: 1px solid #222; font-size: 14px; }
        .btn-analyze { background: var(--blue); color: #000; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }

        /* Analysis Overlay */
        #analysis-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 1000; padding: 15px; box-sizing: border-box; overflow-y: auto; }
        .price-card { background: #151520; padding: 20px; border-radius: 15px; text-align: center; border: 1px solid var(--blue); margin-bottom: 15px; }
        #live-price { font-size: 36px; font-weight: bold; font-family: monospace; }
        
        .ai-card { background: linear-gradient(145deg, #1a1a2e, #16213e); border: 1px solid var(--gold); border-radius: 15px; padding: 20px; margin-bottom: 15px; }
        .signal-text { font-size: 28px; font-weight: 900; letter-spacing: 2px; }
        .rise { color: var(--green); }
        .fall { color: var(--red); }
        
        .close-btn { background: #333; color: white; border: none; padding: 10px 20px; border-radius: 20px; width: 100%; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="margin:0; color: var(--gold); font-size: 18px;">🤖 Zion AI Lab</h2>
        <div id="connection-status" class="status-container"><span class="status-dot"></span><small id="status-text">Connecting...</small></div>
    </div>

    <div class="nav-grid">
        <button class="nav-btn active" onclick="filterMarkets('volatility', this)">VOLATILITY</button>
        <button class="nav-btn" onclick="filterMarkets('crashboom', this)">CRASH/BOOM</button>
        <button class="nav-btn" onclick="filterMarkets('jump', this)">JUMP</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Market</th>
                    <th>Price</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="market-list">
                <tr><td colspan="3" style="text-align:center; padding:40px; color:#666;">Waiting for data...</td></tr>
            </tbody>
        </table>
    </div>

    <div id="analysis-overlay">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 id="target-name" style="margin:0;">Asset Name</h3>
            <span id="target-symbol" style="color:var(--blue); font-family:monospace;">SYMBOL</span>
        </div>

        <div class="price-card">
            <div id="live-price">0.0000</div>
            <small style="color:#888;">LIVE MARKET FEED</small>
        </div>

        <div class="ai-card">
            <div style="color:#aaa; font-size:12px; margin-bottom:10px;">AI PREDICTION ENGINE</div>
            <div id="ai-signal" class="signal-text">ANALYZING...</div>
            <div style="margin-top:10px; display:flex; justify-content:space-between;">
                <span>Confidence: <b id="ai-conf" style="color:var(--gold);">0%</b></span>
                <span>Trend: <b id="ai-trend">Neutral</b></span>
            </div>
        </div>

        <div style="height: 300px; border-radius: 12px; overflow: hidden; background: #000;">
            <iframe id="tradingview-widget" width="100%" height="100%" frameborder="0"></iframe>
        </div>

        <button class="close-btn" onclick="closeAnalysis()">BACK TO LIST</button>
    </div>

<script>
    // Critical Configuration from your screenshots
    const APP_ID = 126973; 
    const ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);
    
    let allSymbols = [];
    let activeTickStream = null;
    let priceHistory = [];

    ws.onopen = () => {
        document.getElementById('connection-status').classList.add('connected');
        document.getElementById('status-text').innerText = "Live";
        // Fetch symbols
        ws.send(JSON.stringify({ active_symbols: "brief", product_type: "basic" }));
    };

    ws.onmessage = (msg) => {
        const data = JSON.parse(msg.data);

        if (data.active_symbols) {
            allSymbols = data.active_symbols;
            filterMarkets('volatility');
        }

        if (data.tick) {
            updateLiveAnalysis(data.tick);
        }

        if (data.error) {
            console.error("Deriv API Error:", data.error.message);
            if(data.error.code === 'InvalidAppID') {
                alert("App ID Error: Ensure 'https://zion-trading-lab-ddmu.vercel.app/' is added to your Deriv Dashboard Redirect URLs.");
            }
        }
    };

    function filterMarkets(type, btn) {
        if(btn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        const tbody = document.getElementById('market-list');
        tbody.innerHTML = '';

        const filtered = allSymbols.filter(s => {
            if (type === 'volatility') return s.market === 'synthetic_index' && !s.display_name.includes('Crash') && !s.display_name.includes('Boom');
            if (type === 'crashboom') return s.display_name.includes('Crash') || s.display_name.includes('Boom');
            if (type === 'jump') return s.display_name.includes('Jump');
            return false;
        });

        filtered.forEach(s => {
            const row = `<tr>
                <td>${s.display_name}</td>
                <td style="color:var(--blue)">Live</td>
                <td><button class="btn-analyze" onclick="openAnalysis('${s.symbol}', '${s.display_name}')">Analyze</button></td>
            </tr>`;
            tbody.innerHTML += row;
        });
    }

    function openAnalysis(symbol, name) {
        document.getElementById('target-name').innerText = name;
        document.getElementById('target-symbol').innerText = symbol;
        document.getElementById('analysis-overlay').style.display = 'block';
        
        // Reset analysis
        priceHistory = [];
        document.getElementById('ai-signal').innerText = "CALCULATING...";
        
        // Load Chart
        document.getElementById('tradingview-widget').src = `https://tradingview.binary.com/v2/main.php?symbol=${symbol}&theme=dark`;

        // Subscribe to ticks
        if (activeTickStream) ws.send(JSON.stringify({ forget: activeTickStream }));
        ws.send(JSON.stringify({ ticks: symbol, subscribe: 1 }));
    }

    function updateLiveAnalysis(tick) {
        activeTickStream = tick.id;
        const price = tick.quote;
        const priceEl = document.getElementById('live-price');
        
        // Price animation
        const oldPrice = parseFloat(priceEl.innerText);
        priceEl.innerText = price.toFixed(tick.pip_size || 2);
        priceEl.style.color = price >= oldPrice ? 'var(--green)' : 'var(--red)';

        // Simple AI Logic
        priceHistory.push(price);
        if (priceHistory.length > 20) priceHistory.shift();

        if (priceHistory.length >= 10) {
            let rises = 0;
            for(let i=1; i < priceHistory.length; i++) {
                if(priceHistory[i] > priceHistory[i-1]) rises++;
            }
            
            const ratio = rises / (priceHistory.length - 1);
            const signalEl = document.getElementById('ai-signal');
            const trendEl = document.getElementById('ai-trend');
            
            if (ratio > 0.6) {
                signalEl.innerText = "STRONG BUY";
                signalEl.className = "signal-text rise";
                trendEl.innerText = "Bullish";
                trendEl.style.color = "var(--green)";
            } else if (ratio < 0.4) {
                signalEl.innerText = "STRONG SELL";
                signalEl.className = "signal-text fall";
                trendEl.innerText = "Bearish";
                trendEl.style.color = "var(--red)";
            } else {
                signalEl.innerText = "NEUTRAL";
                signalEl.className = "signal-text";
                trendEl.innerText = "Sideways";
                trendEl.style.color = "#aaa";
            }
            document.getElementById('ai-conf').innerText = Math.floor(Math.abs(0.5 - ratio) * 200) + "%";
        }
    }

    function closeAnalysis() {
        document.getElementById('analysis-overlay').style.display = 'none';
        if (activeTickStream) ws.send(JSON.stringify({ forget: activeTickStream }));
    }
</script>
</body>
</html>
