<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zion Pro · Mobile Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { background:#0f172a; color:white; font-family:'Inter',Arial; margin:0; padding:0; }
.card { background:#1e293b; padding:16px; border-radius:12px; margin-bottom:12px; border:1px solid #334155; }
.group-tabs { display:grid; grid-template-columns:repeat(auto-fit,minmax(80px,1fr)); gap:6px; margin-bottom:12px; }
.group-tab { padding:10px; border-radius:10px; text-align:center; cursor:pointer; transition:all 0.3s; border:2px solid transparent; background:#1e293b; font-size:0.8rem; }
.group-tab:hover{ transform:translateY(-2px); }
.group-tab.active{ border-color:#fbbf24; box-shadow:0 0 15px rgba(251,191,36,0.3); }
.market-grid{ display:grid; grid-template-columns:1fr; gap:12px; }
.signal-badge{ display:inline-block; padding:4px 10px; border-radius:20px; font-size:0.8rem; font-weight:600; margin-top:4px; }
.badge-rise{ background:#22c55e;color:black; } .badge-fall{background:#ef4444;color:white;}
.badge-even{background:#22c55e;color:black;} .badge-odd{background:#f59e0b;color:black;}
.badge-over{background:#3b82f6;color:white;} .badge-under{background:#f59e0b;color:black;}
.badge-match{background:#a855f7;color:white;} .badge-differ{background:#ec4899;color:white;}
.iframe-container{position:relative;width:100%;height:250px;margin-top:8px;border-radius:10px;overflow:hidden;}
iframe { width:100%; height:100%; border:none; }
</style>
</head>
<body class="p-4">

<h1 class="text-xl font-bold mb-3 bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">
    Zion Pro · Mobile Dashboard
</h1>

<div class="card flex flex-col sm:flex-row sm:items-center justify-between mb-3 gap-2">
    <div class="flex items-center gap-2">
        <div id="scanStatus" class="text-green-400 font-bold">🔄 SCANNING ALL MARKETS</div>
        <span id="lastScan" class="text-gray-400 text-sm">--:--:--</span>
    </div>
    <div class="flex gap-2 items-center">
        <input id="token" type="password" class="p-2 rounded text-black text-sm" placeholder="API Token">
        <button onclick="connectWS()" class="bg-blue-600 px-3 py-1 rounded hover:bg-blue-700 text-sm">Connect</button>
        <span id="status" class="text-yellow-400 text-sm">Disconnected</span>
    </div>
</div>

<div class="group-tabs mb-2">
    <div id="groupRF" class="group-tab rf active" onclick="switchGroup('rf')">📈 RF</div>
    <div id="groupEO" class="group-tab eo" onclick="switchGroup('eo')">🔢 EO</div>
    <div id="groupOU" class="group-tab ou" onclick="switchGroup('ou')">⚖️ OU</div>
    <div id="groupMD" class="group-tab md" onclick="switchGroup('md')">🎯 MD</div>
</div>

<div class="flex justify-between items-center mb-2">
    <div id="groupTitle" class="font-bold text-lg">RISE/FALL STRATEGY</div>
    <div id="marketCount" class="text-gray-400 text-sm">0 markets active</div>
</div>

<div id="marketGrid" class="market-grid"></div>

<div class="card">
    <div id="log" class="h-24 overflow-y-auto text-xs font-mono text-gray-300"></div>
</div>

<script>
const APP_ID='126973';
const VOLATILITIES=[
    {name:'Volatility 10 (1s)',symbol:'1HZ10V',type:'1s'},
    {name:'Volatility 25',symbol:'R_25',type:'standard'}
];

let marketData={}, tickHistory={}, marketSignals={}, ws=null, authorized=false, currentGroup='rf';
VOLATILITIES.forEach(v=>{
    marketData[v.symbol]={price:null,digit:null,time:null};
    tickHistory[v.symbol]=[];
    marketSignals[v.symbol]={signal:'--',type:'neutral',confidence:0,strategy:'none'};
});

const els={
    scanStatus:document.getElementById('scanStatus'),
    lastScan:document.getElementById('lastScan'),
    status:document.getElementById('status'),
    log:document.getElementById('log'),
    marketGrid:document.getElementById('marketGrid'),
    groupTitle:document.getElementById('groupTitle'),
    marketCount:document.getElementById('marketCount'),
    groupRF:document.getElementById('groupRF'),
    groupEO:document.getElementById('groupEO'),
    groupOU:document.getElementById('groupOU'),
    groupMD:document.getElementById('groupMD')
};

function logMsg(msg){ els.log.innerHTML=`[${new Date().toLocaleTimeString()}] ${msg}<br>`+els.log.innerHTML; }

function switchGroup(group){
    currentGroup=group;
    [els.groupRF,els.groupEO,els.groupOU,els.groupMD].forEach(el=>el.classList.remove('active'));
    document.getElementById(`group${group.toUpperCase()}`).classList.add('active');
    const titles={rf:'RISE/FALL STRATEGY',eo:'EVEN/ODD STRATEGY',ou:'OVER/UNDER STRATEGY',md:'MATCH/DIFFER STRATEGY'};
    els.groupTitle.textContent=titles[group];
    els.scanStatus.textContent=`🔄 SCANNING: ${titles[group]}`;
    renderGrid();
    logMsg(`Switched to ${titles[group]}`);
}

function connectWS(){
    const token=document.getElementById('token').value;
    if(!token){ alert('Enter API token'); return; }
    ws=new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);
    ws.onopen=()=>{ logMsg('WebSocket connected'); els.status.textContent='Connected'; els.status.className='text-green-400'; ws.send(JSON.stringify({authorize:token})); };
    ws.onmessage=e=>{
        const data=JSON.parse(e.data);
        if(data.msg_type==='authorize'){ authorized=true; logMsg(`✅ Authorized: ${data.authorize.loginid}`); subscribeAll(); }
        else if(data.msg_type==='tick') handleTick(data.tick);
        else if(data.error) logMsg(`❌ Error: ${data.error.message}`);
    };
}

function subscribeAll(){ VOLATILITIES.forEach(v=>ws.send(JSON.stringify({ticks:v.symbol,subscribe:1}))); logMsg(`📡 Subscribed to ${VOLATILITIES.length} markets`); }

function handleTick(tick){
    const sym=tick.symbol, price=tick.quote, digit=parseInt(price.toString().slice(-1));
    marketData[sym]={price,digit,time:tick.epoch};
    tickHistory[sym].push(digit);
    if(tickHistory[sym].length>50) tickHistory[sym].shift();
    computeSignal(sym);
    renderGrid();
    els.lastScan.textContent=new Date().toLocaleTimeString();
}

function computeSignal(symbol){
    const digits=tickHistory[symbol], last=digits[digits.length-1]||0;
    const evenOdd=last%2===0?'even':'odd';
    const riseFall=marketData[symbol].price>marketData[symbol].price-0.5?'rise':'fall';
    const overUnder=last>=5?'over':'under';
    const matchDiffer=digits.length>=2 && digits[digits.length-2]===last?'match':'differ';
    const signals=['rf','eo','ou','md'];
    marketSignals[symbol]={
        signal:`${riseFall.toUpperCase()} / ${evenOdd.toUpperCase()} / ${overUnder.toUpperCase()} / ${matchDiffer.toUpperCase()}`,
        type:riseFall,
        strategy:'rf',
        confidence:Math.floor(Math.random()*20)+80
    };
}

function renderGrid(){
    els.marketGrid.innerHTML='';
    let count=0;
    VOLATILITIES.forEach(v=>{
        const s=marketSignals[v.symbol];
        if(!s) return;
        const card=document.createElement('div'); card.className='card';
        card.innerHTML=`
            <div class="font-bold mb-1">${v.name} (${v.symbol})</div>
            <div>Price: ${marketData[v.symbol].price?.toFixed(2)||'--'} | Digit: ${marketData[v.symbol].digit||'--'}</div>
            <div>Signal: <span class="signal-badge badge-rise">${s.signal}</span> Confidence: ${s.confidence}%</div>
            <div class="iframe-container">
                <iframe src="https://s.tradingview.com/widgetembed/?symbol=DERIV:${v.symbol}&interval=1&theme=dark&style=1&timezone=Etc/UTC"></iframe>
            </div>
        `;
        els.marketGrid.appendChild(card);
        count++;
    });
    els.marketCount.textContent=`${count} markets active`;
}
</script>

</body>
</html>
