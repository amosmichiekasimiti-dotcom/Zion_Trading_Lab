<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zion Trading Lab | Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --red: #ff444f; --dark: #0e0e15; --card-bg: #161625; --border: #2e2e48; --green: #4caf50; --neon: #00f2fe; }
        body { font-family: sans-serif; background: var(--dark); margin: 0; padding: 10px; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Fixed Scrollable Navigation */
        .nav-grid { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 10px; margin-bottom: 10px; scrollbar-width: none; }
        .nav-grid::-webkit-scrollbar { display: none; }
        .nav-card { background: var(--card-bg); padding: 12px 18px; border-radius: 8px; text-align: center; cursor: pointer; border: 1px solid var(--border); font-size: 11px; font-weight: 800; color: #8e8e9e; white-space: nowrap; flex: 0 0 auto; }
        .nav-card.active { background: var(--red); color: white; border-color: var(--red); }
        
        .card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); flex-grow: 1; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; }
        td, th { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 12px; }

        /* Full Screen Modal */
        #modal { display:none; position:fixed; z-index:100; left:0; top:0; width:100%; height:100%; background:var(--dark); }
        .modal-body { display: flex; flex-direction: column; height: 100dvh; padding: 15px; box-sizing: border-box; }
        
        .tabs { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 5px; }
        .tab { padding: 8px 15px; background: #1c1c2d; border-radius: 20px; font-size: 11px; cursor: pointer; border: 1px solid var(--border); white-space: nowrap; color: #8e8e9e; }
        .tab.active { background: var(--red); color: white; }

        .price-header { background: #1c1c2d; padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); }
        #live-price { font-size: 26px; font-family: monospace; font-weight: bold; }
        #live-price span { color: var(--red); border-bottom: 3px solid var(--red); }

        /* Digit Analysis - Only shown for digit markets */
        #digit-analysis-panel { display: none; margin-bottom: 10px; }
        .digit-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; background: #000; padding: 8px; border-radius: 8px; }
        .d-box { background: #1a1a1a; height: 45px; display: flex; flex-direction: column-reverse; align-items: center; position: relative; border: 1px solid #333; }
        .d-bar { width: 100%; background: var(--neon); transition: height 0.3s; opacity: 0.6; }
        .d-num { position: absolute; top: 2px; font-size: 9px; font-weight: bold; color: white; }
        .d-pct { font-size: 8px; color: var(--neon); margin-bottom: 2px; z-index: 1; }

        #chart-container { flex-grow: 1; width: 100%; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
    </style>
</head>
<body>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h2 style="margin:0; font-size: 16px;">ZION <span style="color:var(--red)">TRADING LAB</span></h2>
        <div id="status" style="color:var(--green); font-weight:bold; font-size:10px;">● CONNECTED</div>
    </div>

    <div class="nav-grid">
        <div class="nav-card active" onclick="loadCategory('volatility', this)">VOLATILITY</div>
        <div class="nav-card" onclick="loadCategory('crashboom', this)">CRASH/BOOM</div>
        <div class="nav-card" onclick="loadCategory('jump', this)">JUMP</div>
        <div class="nav-card" onclick="loadCategory('range', this)">RANGE/STEP</div>
        <div class="nav-card" onclick="loadCategory('basket', this)">BASKETS</div>
        <div class="nav-card" onclick="loadCategory('forex', this)">FOREX</div>
    </div>

    <div class="card">
        <table>
            <thead><tr><th>Asset Name</th><th>Symbol</th><th>Action</th></tr></thead>
            <tbody id="market-list"></tbody>
        </table>
    </div>

    <div id="modal">
        <div class="modal-body">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <h3 id="mTitle" style="margin:0; font-size:14px;">Analysis</h3>
                <button onclick="closeModal()" style="background:var(--red); color:white; border:none; padding:8px 15px; border-radius:8px; font-weight:bold;">CLOSE</button>
            </div>
            
            <div class="tabs">
                <div class="tab active" onclick="switchContract('rise_fall', this)">Rise/Fall</div>
                <div class="tab" onclick="switchContract('even_odd', this)">Even/Odd</div>
                <div class="tab" onclick="switchContract('matches_differs', this)">Matches/Differs</div>
                <div class="tab" onclick="switchContract('over_under', this)">Over/Under</div>
            </div>

            <div class="price-header">
                <div id="live-price">0.00<span>0</span></div>
                <div id="signal-box" style="text-align:right;">
                    <div id="signal-text" style="font-size:10px; color:var(--neon); font-weight:bold;">ANALYZING</div>
                    <div id="direction-arrow" style="font-size:24px; font-weight:bold;">--</div>
                </div>
            </div>

            <div id="digit-analysis-panel"><div class="digit-grid" id="digit-grid"></div></div>
            <div id="chart-container"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
