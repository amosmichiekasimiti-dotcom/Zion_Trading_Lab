<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZION LAB | Universal Scavenger</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="main-header">
            <div class="brand">⚡ ZION MASTER HUB</div>
            <div class="connection-zone">
                <input type="password" id="apiToken" placeholder="Deriv API Token" value="rbQgwOkbsfDoKw2">
                <button onclick="initializeUniversalScavenger()" class="glow-btn">INITIALIZE ENGINE</button>
            </div>
        </header>

        <section id="discovery-wall" class="discovery-grid">
            <div class="status-msg">Engine Standby. Waiting for Handshake...</div>
        </section>

        <div id="analysis-overlay" class="overlay">
            <div class="overlay-content">
                <nav class="overlay-nav">
                    <span id="active-asset-name">SCAVENGER VIEW</span>
                    <button onclick="closeAnalysis()" class="close-btn">× CLOSE</button>
                </nav>
                <div id="dynamic-trade-container"></div>
                <div id="universal-chart"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
