<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zion Trading Lab | Pro Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --red: #ff444f; --dark: #1e1e1e; --light: #f4f7f6; --green: #4caf50; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); margin: 0; padding: 15px; }
        
        /* Navigation Grid */
        .nav-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .nav-card { background: white; padding: 15px 5px; border-radius: 12px; text-align: center; cursor: pointer; border: 1px solid #ddd; transition: 0.2s; height: 85px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .nav-card i { font-size: 1.5rem; color: #555; margin-bottom: 8px; }
        .nav-card span { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: #666; }
        .nav-card.active { background: var(--red); border-color: var(--red); }
        .nav-card.active i, .nav-card.active span { color: white; }

        /* Market Table */
        .card { background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #fafafa; padding: 15px; text-align: left; font-size: 12px; color: #999; border-bottom: 1px solid #eee; }
        td { padding: 15px; border-bottom: 1px solid #f8f8f8; font-weight: 600; }
        .btn-view { background: var(--dark); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }

        /* Modal & Analysis Grid */
        #modal { display:none; position:fixed; z-index:100; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.85); backdrop-filter: blur(5px); overflow-y: auto; }
        .modal-body { background:white; margin:2% auto; padding:25px; border-radius:16px; width:95%; max-width:850px; position: relative; }
        
        /* Prediction Grid (Matches your Volatility 100 Screenshots) */
        .prediction-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 15px 0; }
        .digit-box { background: #fdfdfd; border: 1px solid #eee; border-radius: 8px; padding: 12px 5px; text-align: center; transition: 0.3s; }
        .digit-box.active { background: var(--dark); color: white; border-color: var(--dark); }
        .d-val { font-size: 1.3rem; font-weight: bold; display: block; }
        .d-pct { font-size: 0.75rem; font-weight: 600; color: #999; }
    </style>
</head>
<body>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 style="margin:0;">Zion Trading Lab</h2>
        <div id="status" style="font-weight:bold; color:var(--red);">Connecting...</div>
    </div>

    <div class="nav-grid">
        <div class="nav-card active" onclick="loadCategory('volatility', this)"><i class="fas fa-chart-line"></i><span>Volatility</span></div>
        <div class="nav-card" onclick="loadCategory('crashboom', this)"><i class="fas fa-bolt"></i><span>Crash/Boom</span></div>
        <div class="nav-card" onclick="loadCategory('jump', this)"><i class="fas fa-arrow-up-right-dots"></i><span>Jump</span></div>
        <div class="nav-card" onclick="loadCategory('range', this)"><i class="fas fa-arrows-left-right"></i><span>Range/Step</span></div>
        <div class="nav-card" onclick="loadCategory('basket', this)"><i class="fas fa-basket-shopping"></i><span>Baskets</span></div>
        <div class="nav-card" onclick="loadCategory('forex', this)"><i class="fas fa-coins"></i><span>Forex</span></div>
        <div class="nav-card" onclick="loadCategory('crypto', this)"><i class="fab fa-bitcoin"></i><span>Crypto</span></div>
    </div>

    <div class="card">
        <table>
            <thead><tr><th>Market</th><th>Symbol</th><th>Action</th></tr></thead>
            <tbody id="market-list"></tbody>
        </table>
    </div>

    <div id="modal">
        <div class="modal-body">
            <span onclick="closeModal()" style="position:absolute; right:20px; top:15px; font-size:28px; cursor:pointer;">&times;</span>
            <h3 id="mTitle" style="margin:0;">Market Analysis</h3>
            <div id="analysis-content" style="text-align:center;">
                <h1 id="mPrice" style="font-size:3.5rem; font-family:monospace; margin:10px 0; font-weight:bold;">---</h1>
                <div id="mDir" style="font-weight:bold; margin-bottom:15px;">Awaiting Data...</div>
                
                <div style="text-align:center; font-size:11px; font-weight:bold; color:#777; margin-top:15px;">LAST DIGIT PREDICTION (100 TICKS)</div>
                <div class="prediction-grid" id="digit-grid">
                    </div>

                <div id="chart-area" style="height:400px; border-radius:10px; overflow:hidden; border:1px solid #eee; margin-top:20px;"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
