<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level-3 Quant Dashboard | Institutional Suite</title>
<style>
  body { font-family: Arial, sans-serif; margin:0; padding:0; background:#111; color:#eee; }
  h1 { text-align:center; margin:10px 0; color:#0ff; }
  #dashboard { display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap:10px; padding:10px; }
  .card { background:#222; border-radius:10px; padding:15px; overflow:auto; max-height:400px; }
  .card h2 { font-size:1.1em; color:#0ff; margin:0 0 10px 0; }
  pre { font-size:0.85em; color:#0f0; overflow:auto; }
</style>
</head>
<body>
<h1>Level-3 Quant Dashboard | Institutional Suite</h1>
<div id="dashboard">
  <div class="card"><h2>Markets</h2><pre id="markets"></pre></div>
  <div class="card"><h2>Ticks</h2><pre id="ticks"></pre></div>
  <div class="card"><h2>Candles</h2><pre id="candles"></pre></div>
  <div class="card"><h2>Balance</h2><pre id="balance"></pre></div>
  <div class="card"><h2>Open Contracts</h2><pre id="openContracts"></pre></div>
  <div class="card"><h2>Transactions</h2><pre id="transactions"></pre></div>
  <div class="card"><h2>Currencies</h2><pre id="currencies"></pre></div>
</div>

<script>
const APP_ID = 126973; // Your App ID
const WS_URL = "wss://ws.binaryws.com/websockets/v3?app_id=" + APP_ID;

let state = {
  markets: [],
  ticks: {},
  candles: {},
  balance: null,
  openContracts: [],
  transactions: [],
  currencies: []
};

const ws = new WebSocket(WS_URL);

ws.onopen = () => {
  console.log("WebSocket connected");
  ws.send(JSON.stringify({ authorize: APP_ID }));
};

ws.onmessage = (msg) => {
  const data = JSON.parse(msg.data);
  handleMessage(data);
};

function handleMessage(data) {
  if (data.error) {
    console.error("API Error:", data.error.message);
    return;
  }

  switch(data.msg_type) {
    case "authorize": subscribeAllStreams(); break;
    case "active_symbols": handleActiveSymbols(data.active_symbols); break;
    case "tick": handleTick(data.tick); break;
    case "ohlc": handleCandle(data.ohlc); break;
    case "balance": handleBalance(data.balance); break;
    case "proposal_open_contract": handleOpenContracts(data.proposal_open_contract); break;
    case "transaction": handleTransactions(data.transaction); break;
    case "payout_currencies": handleCurrencies(data.payout_currencies); break;
  }

  renderDashboard();
}

// ---------- Handlers ----------
function handleActiveSymbols(symbols) {
  state.markets = symbols.map(s => s.symbol);
  // Subscribe to ticks & candles for all markets
  state.markets.forEach(sym => {
    ws.send(JSON.stringify({ ticks: sym, subscribe: 1 }));
    ws.send(JSON.stringify({ candles: sym, granularity: 60, subscribe: 1 }));
  });
}

function handleTick(tick) {
  state.ticks[tick.symbol] = tick;
}

function handleCandle(candle) {
  if (!state.candles[candle.symbol]) state.candles[candle.symbol] = [];
  state.candles[candle.symbol].push(candle);
  if (state.candles[candle.symbol].length > 50) state.candles[candle.symbol].shift();
}

function handleBalance(balance) {
  state.balance = balance.balance;
}

function handleOpenContracts(contracts) {
  state.openContracts = contracts;
}

function handleTransactions(transaction) {
  state.transactions.push(transaction);
  if (state.transactions.length > 50) state.transactions.shift();
}

function handleCurrencies(currencies) {
  state.currencies = currencies;
}

// ---------- Dashboard Render ----------
function renderDashboard() {
  document.getElementById("markets").textContent = state.markets.join("\n");
  document.getElementById("ticks").textContent = JSON.stringify(state.ticks, null, 2);
  document.getElementById("candles").textContent = JSON.stringify(state.candles, null, 2);
  document.getElementById("balance").textContent = state.balance;
  document.getElementById("openContracts").textContent = JSON.stringify(state.openContracts, null, 2);
  document.getElementById("transactions").textContent = JSON.stringify(state.transactions, null, 2);
  document.getElementById("currencies").textContent = state.currencies.join("\n");
}

// ---------- Subscribe to All Streams ----------
function subscribeAllStreams() {
  // Request active symbols
  ws.send(JSON.stringify({ active_symbols: "full", product_type: "basic" }));

  // Subscribe to balance updates
  ws.send(JSON.stringify({ balance: 1, subscribe: 1 }));

  // Payout currencies
  ws.send(JSON.stringify({ payout_currencies: 1 }));

  console.log("Subscribed to all core streams. Waiting for active symbols to subscribe ticks & candles...");
}
</script>
</body>
</html>
