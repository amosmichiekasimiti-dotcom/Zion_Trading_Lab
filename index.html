<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zion Trading Lab | Upgraded</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="price-card">
            <div id="live-price">0.0000<span class="active-digit">0</span></div>
            <div style="text-align: right;">
                <small style="color: #8b949e;">LIVE FEED</small><br>
                <span id="price-symbol" style="font-weight: bold; color: var(--red);">1HZ50V</span>
            </div>
        </div>

        <div class="engine-panel">
            <div class="engine-header"><i class="fas fa-microchip"></i> Digit Analysis Engine</div>
            <div id="engine-status" style="font-size: 10px; color: var(--gold); margin-bottom: 10px;">ANALYZING TICK DATA...</div>
            
            <div class="signal-grid">
                <div class="signal-box">
                    <small style="color: #8b949e;">Signal</small>
                    <div id="primary-signal" class="value" style="color: var(--blue);">WAIT</div>
                </div>
                <div class="signal-box">
                    <small style="color: #8b949e;">Trend</small>
                    <div id="market-direction" class="value">--</div>
                </div>
            </div>

            <div class="conditions-list">
                <div class="condition">
                    <span>Pattern Recognition</span>
                    <span id="cond-pattern" class="status status-checking">Checking</span>
                </div>
                <div class="condition">
                    <span>Volatility Filter</span>
                    <span id="cond-vol" class="status status-checking">Checking</span>
                </div>
                <div class="condition">
                    <span>Momentum Confirmation</span>
                    <span id="cond-momentum" class="status status-checking">Checking</span>
                </div>
            </div>
        </div>

        <div id="chart-container">
            <iframe id="trading-chart" src="" width="100%" height="400" frameborder="0"></iframe>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
