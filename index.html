<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zion AI | Final Sniper Terminal</title>
    <style>
        :root { --red: #ff444f; --dark: #050508; --green: #00ff88; --gold: #ffd700; --blue: #00f2fe; --panel: #111118; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--dark); color: white; margin: 0; padding: 10px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Dashboard Stats */
        .dash-header { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .box { background: var(--panel); padding: 10px; border-radius: 10px; border: 1px solid #222; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .lbl { font-size: 8px; color: #888; text-transform: uppercase; margin-bottom: 3px; letter-spacing: 1px; }
        .val { font-size: 16px; font-weight: bold; font-family: monospace; color: var(--blue); }

        /* API & Control Panel */
        .control-panel { background: var(--panel); padding: 12px; border-radius: 12px; border: 1px solid #333; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .row { display: flex; gap: 10px; }
        input { background: #000; border: 1px solid #444; color: var(--gold); padding: 10px; border-radius: 6px; flex-grow: 1; outline: none; font-size: 13px; font-family: monospace; }
        .btn-start { background: var(--green); border: none; padding: 0 20px; border-radius: 6px; font-weight: bold; cursor: pointer; color: #000; transition: 0.3s; }
        .btn-start:hover { background: #00cc6e; transform: scale(1.02); }

        /* The Global Radar Matrix */
        .matrix-container { flex-grow: 1; background: var(--panel); border-radius: 12px; border: 1px solid #222; overflow-y: auto; padding: 5px; }
        table { width: 100%; border-collapse: collapse; }
        th { font-size: 10px; color: #555; text-align: left; padding: 8px; border-bottom: 1px solid #222; }
        td { padding: 12px 8px; border-bottom: 1px solid #1a1a24; font-size: 12px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .pulse-green { background: var(--green); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* Pop-up Notification */
        #snipe-alert { position: fixed; top: -100px; left: 10px; right: 10px; background: var(--gold); color: #000; padding: 15px; border-radius: 10px; font-weight: bold; text-align: center; z-index: 1000; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .alert-show { top: 20px !important; }

        /* Terminal Logs */
        .terminal { height: 70px; background: #000; border-top: 2px solid #222; color: var(--green); font-family: monospace; font-size: 10px; padding: 8px; overflow-y: auto; }
    </style>
</head>
<body>

<div id="snipe-alert">🚀 LEGIT SIGNAL DETECTED! EXECUTING...</div>

<div class="dash-header">
    <div class="box"><div class="lbl">Account Balance</div><div id="ui-bal" class="val">$0.00</div></div>
    <div class="box"><div class="lbl">Session P/L</div><div id="ui-pl" class="val">$0.00</div></div>
    <div class="box"><div class="lbl">Next Stake</div><div id="ui-stake" class="val">$1.60</div></div>
</div>

<div class="control-panel">
    <div class="row">
        <input type="password" id="api-token" placeholder="Enter Deriv API Token (Trade/Read)">
        <button class="btn-start" onclick="igniteSystem()">IGNITE RADAR</button>
    </div>
    <div class="row" style="justify-content: space-between; font-size: 10px; color: #888; padding: 0 5px;">
        <span>Target: <input type="number" id="target-profit" value="10.00" style="width:40px; border:none; background:none; color:var(--green); font-weight:bold;"></span>
        <span>Stop: <input type="number" id="stop-loss" value="20.00" style="width:40px; border:none; background:none; color:var(--red); font-weight:bold;"></span>
        <span id="sys-status" style="color:var(--red)">System: Standby</span>
    </div>
</div>

<div class="matrix-container">
    <table>
        <thead>
            <tr><th>MARKET ASSET</th><th>SIGNAL SCORE</th><th>TREND STATUS</th></tr>
        </thead>
        <tbody id="radar-rows">
            </tbody>
    </table>
</div>

<div class="terminal" id="term-log">>> Zion Master AI v3.0 initialized. Awaiting ignition...</div>

<script>
    let wsMkt, wsTrade;
    let marketStorage = {};
    let isLocked = false;
    let baseStake = 1.60;
    let currentStake = 1.60;
    let sessionPL = 0;

    function log(m) {
        const t = document.getElementById('term-log');
        t.innerHTML += `<br>> ${m}`;
        t.scrollTop = t.scrollHeight;
    }

    function igniteSystem() {
        const token = document.getElementById('api-token').value;
        if(!token) return alert("Please enter your API Token first.");
        
        log("Connecting to Deriv Secure Gateway...");
        wsTrade = new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=126973');
        
        wsTrade.onopen = () => wsTrade.send(JSON.stringify({ authorize: token }));
        
        wsTrade.onmessage = (e) => {
            const d = JSON.parse(e.data);
            if(d.authorize) {
                document.getElementById('ui-bal').innerText = "$" + d.authorize.balance;
                document.getElementById('sys-status').innerText = "System: Active Scan";
                document.getElementById('sys-status').style.color = "var(--green)";
                wsTrade.send(JSON.stringify({ balance: 1, subscribe: 1 }));
                wsTrade.send(JSON.stringify({ proposal_open_contract: 1, subscribe: 1 }));
                startGlobalRadar();
            }
            if(d.balance) document.getElementById('ui-bal').innerText = "$" + d.balance.balance;
            if(d.proposal_open_contract) handleTradeResolution(d.proposal_open_contract);
        };
    }

    function startGlobalRadar() {
        wsMkt = new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=126973');
        wsMkt.onopen = () => wsMkt.send(JSON.stringify({ active_symbols: "brief", product_type: "basic" }));
        
        wsMkt.onmessage = (e) => {
            const d = JSON.parse(e.data);
            if(d.active_symbols) {
                const synthetics = d.active_symbols.filter(s => s.market === 'synthetic_index').slice(0, 12);
                synthetics.forEach(s => {
                    marketStorage[s.symbol] = { digits: [], prices: [], name: s.display_name };
                    wsMkt.send(JSON.stringify({ ticks: s.symbol, subscribe: 1 }));
                });
                log(`Radar tracking ${synthetics.length} assets in parallel.`);
            }
            if(d.tick) processTick(d.tick);
        };
    }

    function processTick(t) {
        const s = t.symbol;
        const p = t.quote;
        const d = parseInt(p.toString().slice(-1));
        const data = marketStorage[s];

        data.digits.push(d);
        data.prices.push(p);
        if(data.digits.length > 20) { data.digits.shift(); data.prices.shift(); }

        renderRadar();

        // THE SNIPER LOGIC (HARD-CODED FILTERS)
        const last10 = data.digits.slice(-10);
        const vacuum = !last10.includes(0) && !last10.includes(1);
        const density = last10.filter(v => v > 4).length >= 8;
        const trigger = d >= 8;

        if(vacuum && density && trigger && !isLocked) {
            triggerSnipe(s, data.name);
        }
    }

    function renderRadar() {
        const tbody = document.getElementById('radar-rows');
        tbody.innerHTML = Object.keys(marketStorage).map(key => {
            const m = marketStorage[key];
            const score = m.digits.slice(-10).filter(x => x > 4).length;
            const trend = m.prices[m.prices.length-1] > m.prices[0] ? 'BULLISH' : 'BEARISH';
            return `<tr>
                <td><div class="status-dot ${score >= 8 ? 'pulse-green' : ''}"></div> ${m.name}</td>
                <td style="color:${score >= 8 ? 'var(--gold)' : '#555'}">${score}/10 GINO</td>
                <td style="color:${trend === 'BULLISH' ? 'var(--green)' : 'var(--red)'}; font-size:10px;">${trend}</td>
            </tr>`;
        }).join('');
    }

    function triggerSnipe(sym, name) {
        isLocked = true;
        const alert = document.getElementById('snipe-alert');
        alert.innerText = `🚀 AUTO-SNIPE: ${name.toUpperCase()} ($${currentStake})`;
        alert.classList.add('alert-show');

        wsTrade.send(JSON.stringify({
            buy: "1",
            price: currentStake,
            parameters: {
                amount: currentStake,
                basis: "stake",
                contract_type: "CALL",
                currency: "USD",
                duration: 1,
                duration_unit: "t",
                symbol: sym
            }
        }));

        setTimeout(() => alert.classList.remove('alert-show'), 3500);
    }

    function handleTradeResolution(c) {
        if(c.is_sold) {
            const profit = parseFloat(c.profit);
            sessionPL += profit;
            
            document.getElementById('ui-pl').innerText = "$" + sessionPL.toFixed(2);
            document.getElementById('ui-pl').style.color = sessionPL >= 0 ? 'var(--green)' : 'var(--red)';
            
            if(profit > 0) {
                log(`WIN: +$${profit.toFixed(2)} | Resetting stake.`);
                currentStake = baseStake;
            } else {
                currentStake = (currentStake * 2.1).toFixed(2);
                log(`LOSS: -$${Math.abs(profit).toFixed(2)} | Martingale: $${currentStake}`);
            }
            
            document.getElementById('ui-stake').innerText = "$" + currentStake;
            checkGoals();
            isLocked = false;
        }
    }

    function checkGoals() {
        const tp = parseFloat(document.getElementById('target-profit').value);
        const sl = parseFloat(document.getElementById('stop-loss').value);
        
        if(sessionPL >= tp) {
            alert("TARGET PROFIT REACHED! Bot Stopping.");
            location.reload();
        }
        if(sessionPL <= (sl * -1)) {
            alert("STOP LOSS HIT. Protecting remaining balance.");
            location.reload();
        }
    }
</script>
</body>
</html>
