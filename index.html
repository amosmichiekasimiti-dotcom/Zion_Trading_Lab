<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zion Trading Lab | Direct Feed</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --red: #ff444f; --dark: #1e1e1e; --green: #4caf50; }
        body { font-family: sans-serif; background: #f4f7f6; margin: 0; padding: 15px; }
        .nav-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .nav-card { background: white; padding: 15px; border-radius: 12px; text-align: center; cursor: pointer; border: 1px solid #ddd; display: flex; flex-direction: column; align-items: center; }
        .nav-card.active { background: var(--red); color: white; border-color: var(--red); }
        .card { background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        td, th { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        .btn-view { background: var(--dark); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }

        /* Modal & Direct Panels */
        #modal { display:none; position:fixed; z-index:100; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.9); }
        .modal-body { background:white; margin:1% auto; padding:20px; border-radius:12px; width:95%; height: 95vh; display: flex; flex-direction: column; }
        .contract-selector { display: flex; gap: 10px; margin-bottom: 10px; overflow-x: auto; }
        .c-btn { padding: 10px 15px; border-radius: 20px; border: 1px solid #ddd; background: #eee; cursor: pointer; white-space: nowrap; font-weight: bold; }
        .c-btn.active { background: var(--red); color: white; }

        #digit-panel { display: none; background: #111; color: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
        .digit-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin-top: 10px; }
        .d-box { background: #222; padding: 10px 5px; text-align: center; border-bottom: 3px solid #444; font-size: 12px; }
        
        /* Fix: TradingView Full View */
        #chart-container { flex-grow: 1; width: 100%; border-radius: 8px; overflow: hidden; }
    </style>
</head>
<body>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2>Zion Trading Lab</h2>
        <div id="status">Connecting...</div>
    </div>

    <div class="nav-grid">
        <div class="nav-card active" onclick="loadCategory('volatility', this)"><i class="fas fa-chart-line"></i><span>VOLATILITY</span></div>
        <div class="nav-card" onclick="loadCategory('crashboom', this)"><i class="fas fa-bolt"></i><span>CRASH/BOOM</span></div>
        <div class="nav-card" onclick="loadCategory('jump', this)"><i class="fas fa-arrow-up"></i><span>JUMP</span></div>
        <div class="nav-card" onclick="loadCategory('range', this)"><i class="fas fa-arrows-alt-h"></i><span>RANGE/STEP</span></div>
        <div class="nav-card" onclick="loadCategory('basket', this)"><i class="fas fa-shopping-basket"></i><span>BASKETS</span></div>
        <div class="nav-card" onclick="loadCategory('forex', this)"><i class="fas fa-dollar-sign"></i><span>FOREX</span></div>
    </div>

    <div class="card">
        <table>
            <thead><tr><th>Market</th><th>Symbol</th><th>Action</th></tr></thead>
            <tbody id="market-list"></tbody>
        </table>
    </div>

    <div id="modal">
        <div class="modal-body">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <h3 id="mTitle" style="margin:0;">Analysis</h3>
                <button onclick="closeModal()" style="background:var(--red); color:white; border:none; padding:5px 15px; border-radius:5px; cursor:pointer;">Close</button>
            </div>

            <div class="contract-selector">
                <button class="c-btn active" onclick="setMode('rise_fall', this)">Rise/Fall</button>
                <button class="c-btn" onclick="setMode('even_odd', this)">Even/Odd</button>
                <button class="c-btn" onclick="setMode('matches_differs', this)">Matches/Differs</button>
                <button class="c-btn" onclick="setMode('over_under', this)">Over/Under</button>
            </div>

            <div id="digit-panel">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div id="mPrice" style="font-size:24px; font-family:monospace;">0.0000</div>
                    <div style="font-weight:bold; color:var(--red);">LIVE FEED</div>
                </div>
                <div class="digit-grid" id="digit-grid"></div>
            </div>

            <div id="chart-container"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
