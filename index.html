<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zion Pro Lab | Ultimate Trading Dashboard</title>
<style>
:root{
  --red:#ff444f;
  --green:#00ff88;
  --blue:#00f2fe;
  --dark:#0a0a0f;
  --panel:#151520;
  --gold:#ffd700;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:var(--dark);color:white;overflow:hidden;display:flex;height:100vh;}

.sidebar{
  width:250px;background:var(--panel);display:flex;flex-direction:column;position:fixed;top:0;left:-250px;height:100%;transition:0.3s;z-index:1000;padding-top:60px;
}
.sidebar.active{left:0;}
.sidebar button{padding:12px 20px;background:none;border:none;color:#888;text-align:left;font-size:14px;cursor:pointer;transition:0.3s;}
.sidebar button:hover{background:rgba(255,255,255,0.05);color:white;}
.sidebar .active{color:var(--blue);}
.sidebar h2{color:var(--gold);padding:0 20px;margin-bottom:15px;font-size:18px;}

.main-content{flex-grow:1;margin-left:0;transition:margin-left 0.3s;padding:10px;display:flex;flex-direction:column;gap:10px;overflow:auto;}
.main-content.shift{margin-left:250px;}

header{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#111827;position:fixed;top:0;width:100%;z-index:999;}
header h1{font-size:20px;color:var(--gold);}
header #menu-btn{font-size:20px;cursor:pointer;color:var(--blue);}
header #status-text{font-size:12px;color:var(--green);}

.nav-tabs{display:flex;gap:8px;margin-top:50px;overflow-x:auto;}
.nav-tabs button{padding:6px 12px;border-radius:6px;background:var(--panel);border:1px solid #333;color:#888;cursor:pointer;white-space:nowrap;}
.nav-tabs button.active{background:var(--red);color:white;border-color:var(--red);}

.price-panel{display:flex;flex-direction:column;background:var(--panel);padding:10px;border-radius:12px;gap:10px;}
#live-price{font-family:monospace;font-size:32px;text-align:center;}
.strategy-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-card{background:rgba(255,255,255,0.05);padding:6px;border-radius:8px;display:flex;justify-content:space-between;font-size:12px;}

.digit-panel{position:relative;background:var(--panel);padding:10px;border-radius:12px;display:flex;flex-direction:column;align-items:center;}
.digit-circle-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px;}
.digit-circle{aspect-ratio:1/1;border-radius:50%;background:#1a1a24;border:2px solid #333;display:flex;align-items:center;justify-content:center;flex-direction:column;color:white;font-size:12px;transition:all 0.3s ease;position:relative;}
.digit-circle.hot{background:linear-gradient(145deg,var(--green),#008844);border-color:white;color:black;}
.digit-circle.cold{background:linear-gradient(145deg,var(--red),#882222);border-color:white;color:white;}
.digit-circle.active{border-color:var(--blue);box-shadow:0 0 10px var(--blue);transform:scale(1.05);}
.cursor{position:absolute;top:-12px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid var(--red);transition:left 0.3s ease;}
#tick-counter{font-size:10px;color:#aaa;margin-top:4px;}

#chart-container{height:400px;border-radius:12px;background:#000;border:1px solid #222;}
.ai-panel{background:var(--panel);padding:10px;border-radius:12px;display:flex;flex-direction:column;gap:5px;}
.ai-panel input{padding:6px;border-radius:6px;border:none;}
.ai-panel button{padding:6px 12px;border:none;border-radius:6px;background:var(--blue);color:black;cursor:pointer;}
.ai-panel #ai-response{margin-top:5px;font-size:14px;}

table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:8px;}
th,td{padding:8px;border-bottom:1px solid #222;font-size:12px;color:#aaa;}
th{background:#1c1c2b;position:sticky;top:0;}
</style>
</head>
<body>

<!-- Sidebar Menu -->
<div class="sidebar" id="sidebar">
  <h2>Menu</h2>
  <button class="active" onclick="openSection('dashboard')">Dashboard</button>
  <button onclick="openSection('markets')">Markets</button>
  <button onclick="openSection('strategies')">Strategies</button>
  <button onclick="openSection('ai')">AI Insights</button>
  <button onclick="openSection('history')">History / Logs</button>
  <button onclick="openSection('settings')">Settings</button>
  <button onclick="openSection('help')">Help</button>
</div>

<!-- Main Content -->
<div class="main-content" id="main-content">
<header>
  <span id="menu-btn" onclick="toggleMenu()">☰</span>
  <h1>🤖 Zion Pro Lab</h1>
  <span id="status-text">● System Ready</span>
</header>

<!-- Dashboard -->
<section id="dashboard" style="margin-top:60px;display:block;flex-direction:column;gap:10px;">
  <div class="nav-tabs">
    <button class="active" onclick="setMarketTab('synthetic',this)">VOLATILITY</button>
    <button onclick="setMarketTab('crashboom',this)">CRASH/BOOM</button>
    <button onclick="setMarketTab('step',this)">STEP/RANGE</button>
    <button onclick="setMarketTab('dex',this)">DEX/DRIFT</button>
  </div>

  <div class="price-panel">
    <div id="live-price">00</div>
    <div class="strategy-grid">
      <div class="stat-card"><span>Even/Odd:</span> <span id="stat-even-odd">---</span></div>
      <div class="stat-card"><span>Over/Under:</span> <span id="stat-over-under">---</span></div>
      <div class="stat-card"><span>Tick Trend:</span> <span id="stat-rise-fall">---</span></div>
      <div class="stat-card"><span>Hot Digit:</span> <span id="stat-match-diff">---</span></div>
    </div>
  </div>

  <div class="digit-panel">
    <div class="digit-circle-grid" id="digit-circles"></div>
    <div class="cursor" id="digit-cursor"></div>
    <div id="tick-counter">0/1000</div>
  </div>

  <div id="chart-container">
    <iframe id="tv-chart" src="" width="100%" height="100%" frameborder="0"></iframe>
  </div>
</section>

<!-- AI Insights -->
<section id="ai" style="display:none;">
  <div class="ai-panel">
    <h2>Ask AI</h2>
    <input type="text" id="ai-prompt" placeholder="Ask AI about this market...">
    <button onclick="askAI()">Send</button>
    <p id="ai-response"></p>
  </div>
</section>

<!-- Other sections placeholders -->
<section id="markets" style="display:none;">
  <h2>Markets</h2>
  <table>
    <thead><tr><th>Asset</th><th>Symbol</th><th>Action</th></tr></thead>
    <tbody id="market-list"></tbody>
  </table>
</section>
<section id="strategies" style="display:none;"><h2>Strategies</h2></section>
<section id="history" style="display:none;"><h2>History / Logs</h2></section>
<section id="settings" style="display:none;"><h2>Settings</h2></section>
<section id="help" style="display:none;"><h2>Help</h2></section>

</div>

<script>
let sidebar=document.getElementById('sidebar');
let mainContent=document.getElementById('main-content');
function toggleMenu(){sidebar.classList.toggle('active');mainContent.classList.toggle('shift');}
function openSection(id){
  document.querySelectorAll('main section').forEach(s=>s.style.display='none');
  document.getElementById(id).style.display='block';
}

// Nav Tabs
function setMarketTab(type,btn){
  document.querySelectorAll('.nav-tabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  console.log("Market tab:",type);
}

// WebSocket Deriv Live Ticks
const APP_ID=126973;
const ws=new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);
let digitHistory=[],priceHistory=[],activeTickStream=null;
const MAX_DIGITS=1000;
const cursor=document.getElementById("digit-cursor");

ws.onopen=()=>console.log("Connected to Deriv WebSocket");
ws.onmessage=(msg)=>{
  const data=JSON.parse(msg.data);
  if(data.active_symbols) allSymbols=data.active_symbols;
  if(data.tick) handleTick(data.tick);
};

function buildDigitUI(){
  const container=document.getElementById('digit-circles');
  container.innerHTML='';
  for(let i=0;i<=9;i++){
    container.innerHTML+=`<div id="circle-${i}" class="digit-circle"><div>${i}</div><div id="pct-${i}">0%</div></div>`;
  }
}
buildDigitUI();

function handleTick(tick){
  const pipSize=tick.pip_size||2;
  const priceStr=Number(tick.quote).toFixed(pipSize);
  const lastDigit=parseInt(priceStr[priceStr.length-1]);
  document.getElementById('live-price').innerText=priceStr;

  digitHistory.push(lastDigit);
  priceHistory.push(Number(priceStr));
  if(digitHistory.length>MAX_DIGITS) digitHistory.shift();
  if(priceHistory.length>MAX_DIGITS) priceHistory.shift();

  updateDigits(lastDigit);
}

function updateDigits(lastDigit){
  const counts=Array(10).fill(0);
  digitHistory.forEach(d=>counts[d]++);
  const total=digitHistory.length;
  document.getElementById('tick-counter').innerText=`${total}/1000`;
  const maxVal=Math.max(...counts);
  const minVal=Math.min(...counts.filter(c=>c>0));
  counts.forEach((count,i)=>{
    const circle=document.getElementById(`circle-${i}`);
    document.getElementById(`pct-${i}`).innerText=((count/total)*100).toFixed(1)+'%';
    circle.classList.remove('hot','cold','active');
    if(i===lastDigit) circle.classList.add('active');
    if(count===maxVal) circle.classList.add('hot');
    if(count===minVal) circle.classList.add('cold');
  });
  // Cursor
  const targetCircle=document.getElementById(`circle-${lastDigit}`);
  if(targetCircle){
    const rect=targetCircle.getBoundingClientRect();
    const parentRect=targetCircle.parentElement.getBoundingClientRect();
    cursor.style.left=`${rect.left-parentRect.left+rect.width/2-6}px`;
  }
  document.getElementById('stat-even-odd').innerText=lastDigit%2===0?'EVEN':'ODD';
  document.getElementById('stat-over-under').innerText=lastDigit>4?'OVER':'UNDER';
  const lastPrice=priceHistory[priceHistory.length-2]||priceHistory[priceHistory.length-1];
  document.getElementById('stat-rise-fall').innerText=priceHistory[priceHistory.length-1]>=lastPrice?'RISE':'FALL';
  document.getElementById('stat-match-diff').innerText=`HOT: ${counts.indexOf(Math.max(...counts))}`;
}

// TradingView embed
function setChart(symbol="R_100"){document.getElementById("tv-chart").src=`https://tradingview.binary.com/v2/main.php?symbol=${symbol}&theme=dark`;}
setChart();

// AI placeholder
async function askAI(){
  const prompt=document.getElementById('ai-prompt').value;
  if(!prompt) return;
  try{
    const res=await fetch('/ask_ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});
    const data=await res.json();
    document.getElementById('ai-response').innerText=data.response||data.error;
  }catch(e){document.getElementById('ai-response').innerText="Error contacting AI";}
}
</script>

</body>
</html>
