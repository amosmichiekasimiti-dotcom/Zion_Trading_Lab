services:
  - type: web
    name: deriv-ai-trading-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.13
      - key: PORT
        value: 10000
    healthCheckPath: /api/health
    autoDeploy: true
